old = ""
new = "gItemsFlags"
kind = "global"
why = "A view of the 14-byte ITEM.DAT records gItems (ds:8DD0) two bytes later, so its +0 is the record's flags byte (E0BD2.C ItemRecord +2), +1 the icon, +2 the item type and +4 the key; named after gItems as the view that starts at the flags."
date = "2026-11-03"

[[rename]]
id = "1A29:008B=DrawShapeRemapped"
addr = "1A29:008B"
old = "f1A29_008B"
new = "DrawShapeRemapped"
kind = "function"
why = "Like DrawShape (1A29:000F) but through the driver pointer ds:80D6; both callers first hand the colour callback ds:80D2 a 16-byte remap row: 0D1C:070F an ITEMRMP row for a flagged item icon, and ovl4:0D1B (through 082C:06C7) the hit-flash rows ds:1CD3/ds:1CE3 for a monster with m16 bit 1."
date = "2026-11-03"

[[rename]]
id = "ds:3237=gTurnForType1To3"
addr = "ds:3237"
old = "gArg3237"
new = "gTurnForType1To3"
kind = "global"
why = "The bytes {2, -1, 1} at ds:3238 seen with base ds:3237 so UpdateObjects (08E6:0CC8) can index them by monster type 1..3 for StepObjectOrient's turn: type 1 turns around (+2), 2 left (-1), 3 right (+1). Same bytes as gTurnForType5To6 (ds:3234), which is the base four bytes earlier."
date = "2026-11-03"

[[rename]]
id = "ds:3234=gTurnForType5To6"
addr = "ds:3234"
old = "gArg3234"
new = "gTurnForType5To6"
kind = "global"
why = "The same three bytes {2, -1, 1} at ds:3238 seen with base ds:3234, so UpdateObjects (08E6:0CC8) indexes them by monster type 5 and 6 and passes -1 or +1 to Obj0B94 (the side the wall follower keeps to). One object with gTurnForType1To3 (ds:3237)."
date = "2026-11-03"

[[rename]]
id = "ds:321E=gDirSearchLeftFirst"
addr = "ds:321E"
old = "g321E"
new = "gDirSearchLeftFirst"
kind = "global"
why = "An int Obj0430 (08E6:0430) flips whenever a monster's state exceeds 6; it selects which direction search table the step uses: 0 gDirSearchRight (ds:31FE, tries +1 before -1) and 1 gDirSearchLeft (ds:320E, tries -1 first)."
date = "2026-11-03"

[[rename]]
id = "ds:31FE=gDirSearchRight"
addr = "ds:31FE"
old = "g31FE"
new = "gDirSearchRight"
kind = "global"
why = "Eight words {7,-6,5,-4,3,-2,1,0} that Obj0430 (08E6:0430) adds to the preferred eighth-direction from index 7 down to 0, so the tries are d, d+1, d-1, d+2, d-2, d+3, d-3, d+4: the clockwise neighbour first. Selected when gDirSearchLeftFirst (ds:321E) is 0."
date = "2026-11-03"

[[rename]]
id = "ds:320E=gDirSearchLeft"
addr = "ds:320E"
old = "g320E"
new = "gDirSearchLeft"
kind = "global"
why = "Eight words {-7,6,-5,4,-3,2,-1,0}, the mirror of gDirSearchRight: Obj0430 (08E6:0430) tries d, d-1, d+1, d-2, d+2 and so on, the anticlockwise neighbour first. Selected when gDirSearchLeftFirst (ds:321E) is 1."
date = "2026-11-03"

[[rename]]
id = "ds:31F2=gFrontLeftPosByDir"
addr = "ds:31F2"
old = "g31F2"
new = "gFrontLeftPosByDir"
kind = "global"
why = "Four bytes {0,1,3,2} by orientation: BuildObjectFrameMask (08E6:017E) gives a monster at the centre position 4 the position g31F2[orient], which is the front-left quarter of the cell for that facing (N: 0 NW, E: 1 NE, S: 3 SE, W: 2 SW)."
date = "2026-11-03"

[[rename]]
id = "ds:31F6=gPosSearchOrder"
addr = "ds:31F6"
old = "g31F6"
new = "gPosSearchOrder"
kind = "global"
why = "Two rows of four bytes {0,1,2,3} and {0,2,1,3}, chosen by orient & 1 and XORed with the orientation by FindObjectFrameBit (08E6:0218): the order in which the four sub-cell positions are tried for a free one when a monster enters a cell."
date = "2026-11-03"

[[rename]]
id = "ds:849A=gFrameWaitTicks"
addr = "ds:849A"
old = "gCount849A"
new = "gFrameWaitTicks"
kind = "global"
why = "A 32-bit countdown the INT 1Ch handler decrements to zero (E1D8F.ASM 1D8F:0098); DrawViewFrame (ovl4:1F51) spins until it is zero, and 08E6:05EA, 0DCA and 0E48 set it to 8 or 1 around the attack and hit-flash frames to hold them on screen."
date = "2026-11-03"

[[rename]]
id = "ds:F518=gDeferMonsterHits"
addr = "ds:F518"
old = "gF518"
new = "gDeferMonsterHits"
kind = "global"
why = "Set to 1 by Obj16D6 (08E6:16D6), TurnUndead (0D1C:0A43) and 0EF3:18D8 before damaging several monsters; while set DamageObject (08E6:0FBE) only marks a visible monster (m16 bit 1) and leaves its death to 08E6:0E48, which shows the frame, kills the dead and clears it."
date = "2026-11-03"

[[rename]]
id = "ds:1CD3=gHitFlashRemap"
addr = "ds:1CD3"
old = "g1CD3"
new = "gHitFlashRemap"
kind = "global"
why = "A 16-byte colour row {0, 15 x 15}: RestoreObjectFlags (08E6:0DCA) passes it to the colour callback ds:80D2 when gGraphicsChoice is nonzero right after a monster is damaged, and ovl4:0D1B uses it for monsters with m16 bit 1, so every colour but 0 draws as 15 (a white hit flash)."
date = "2026-11-03"

[[rename]]
id = "ds:1CE3=gHitFlashRemapCga"
addr = "ds:1CE3"
old = "g1CE3"
new = "gHitFlashRemapCga"
kind = "global"
why = "The CGA counterpart of gHitFlashRemap: 08E6:0DCA and ovl4:0D1B pass it to ds:80D2 when gGraphicsChoice is 0 (cga.ovl, table ds:3074); its first four bytes {0,255,255,255} are the remap and the bytes from ds:1CE7 are the selection-frame colour string, which overlaps it."
date = "2026-11-03"

[[rename]]
id = "ds:1991=gNearSideByDir"
addr = "ds:1991"
old = "g1991"
new = "gNearSideByDir"
kind = "global"
why = "Four bytes {2,3,0,1} by direction, the side of the cell ahead that faces back toward the viewer: ovl4:044B caches g1991[gPartyDir] in gA9C6 to pick the front wall of each view cell, and Obj0B94 (08E6:0B94) reads gMaze[cell * 9 + g1991[dir]]. Same bytes as gOppositeSide (ds:547E)."
date = "2026-11-03"

[[rename]]
id = "ds:32C3=gProjectileHitOrder"
addr = "ds:32C3"
old = "gTable32C3"
new = "gProjectileHitOrder"
kind = "global"
why = "64 bytes read as [dir * 16 + position * 4] by Obj1775 (08E6:1775), which 08E6:17FD calls with a ds:DD2C projectile's cell, position (m06) and direction (m07): the order of sub-cell positions (centre 4 first) whose monster is hit when none stands at the exact position."
date = "2026-11-03"

[[rename]]
id = "ds:329B=gTargetPosOrder"
addr = "ds:329B"
old = "gTable329B"
new = "gTargetPosOrder"
kind = "global"
why = "32 bytes read as [gPartyDir * 8 + (who & 1) * 4] by Obj15B4 (08E6:15B4): for facing north the left front member tries positions 2,3,0,1 and the right one 3,2,1,0, the near-side quarter on its own side first; the melee target order of the two front members."
date = "2026-11-03"

[[rename]]
id = "ds:32BB=gNearPosPair"
addr = "ds:32BB"
old = "gTable32BB"
new = "gNearPosPair"
kind = "global"
why = "Eight bytes, two per party facing {2,3, 0,2, 0,1, 1,3}: the two sub-cell positions of the cell ahead nearest the party (facing north the south pair 2 and 3), which Obj16D6 (08E6:16D6) damages together with the centre position 4."
date = "2026-11-03"

[[rename]]
id = "ds:324B=gAttackSideByDir"
addr = "ds:324B"
old = "gTable324B"
new = "gAttackSideByDir"
kind = "global"
why = "16 bytes read as [gPartyDir * 4 + monster orient] by Obj10F3 (08E6:10F3); the value is (orient - gPartyDir + 2) & 3, the side of the party the monster attacks from, which selects one of the four 12-byte groups of gAttackTargetOrder. The comment's \"page\" index is gPartyDir."
date = "2026-11-03"

[[rename]]
id = "ds:325B=gAttackTargetOrder"
addr = "ds:325B"
old = "gTable325B"
new = "gAttackTargetOrder"
kind = "global"
why = "48 bytes, four groups of two six-member orders, which Obj10F3 (08E6:10F3) scans for the first living member to attack: from the front {1,0,3,2,5,4} or {0,1,2,3,4,5}, from behind {4,5,2,3,0,1} or {5,4,3,2,1,0}, the rank nearest the attacker first."
date = "2026-11-03"

[[rename]]
id = "ds:328B=gRightSidePosByDir"
addr = "ds:328B"
old = "gTable328B"
new = "gRightSidePosByDir"
kind = "global"
why = "16 bytes read as [orient * 4 + position] by Obj10F3 (08E6:10F3) to choose a half of the target order: the value is 1 exactly for the two positions on the monster's right for that facing (north: 1 and 3, east: 2 and 3, south: 0 and 2, west: 0 and 1)."
date = "2026-11-03"

[[rename]]
id = "ds:8492=gGameTicks"
addr = "ds:8492"
old = "g8492"
new = "gGameTicks"
kind = "global"
why = "The 32-bit counter the INT 1Ch handler increments only while ds:849E bit 1 is set (E1D8F.ASM 1D8F:006E), so animations that clear the bit pause it; RunEffects (1414:04E7) compares effect expiries with it and the level timer deadline (ds:F512) is set from it (ovl3:0A7C, 08E6:1410)."
date = "2026-11-03"

[[rename]]
id = "ds:F51B=gLevelTimerMode"
addr = "ds:F51B"
old = "gF51B"
new = "gLevelTimerMode"
kind = "global"
why = "The first byte of a level script header (LoadMapScreen ovl3:0A7C stores script[0]); Obj1410 (08E6:1410) fires the level's timed script on 1 when gGameTicks passes gDeadline, on 2 when gStepCount reaches ds:FB32, on 3 on either, never otherwise."
date = "2026-11-03"

[[rename]]
id = "ds:FB32=gLevelTimerSteps"
addr = "ds:FB32"
old = "gFB32"
new = "gLevelTimerSteps"
kind = "global"
why = "A word from the level script header (ovl3:0A7C); Obj1410 (08E6:1410) fires the timed level script in modes 2 and 3 once gStepCount (the party's steps, MoveParty) reaches it, then clears gStepCount."
date = "2026-11-03"

[[rename]]
id = "ds:3220=gBossSpellModes"
addr = "ds:3220"
old = "g3220"
new = "gBossSpellModes"
kind = "global"
why = "Three bytes {2,10,11} indexed by a 1d4-1 roll in Obj0765 case 21 (08E6:0765) and passed as the StartCellEffect mode; type 21 (0x15) is the monster whose death 08E6:0EC3 answers with the winner screen and ShutdownGame, so these are the final enemy's spells."
date = "2026-11-03"

[[rename]]
id = "ds:3223=gBossSpellSounds"
addr = "ds:3223"
old = "g3223"
new = "gBossSpellSounds"
kind = "global"
why = "Three sound numbers {0x62,0x53,0x40} played through PlaySoundAtCell in Obj0765 case 21 (08E6:0765) with the spell gBossSpellModes (ds:3220) picks by the same roll; type 21 is the monster whose death ends the game (08E6:0EC3)."
date = "2026-11-03"

