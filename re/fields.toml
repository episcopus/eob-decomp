[[field]]
struct = "CharRec"
at = "01"
old = "flags, m01"
new = "status"
why = "the character's status bits: bit 0 the slot holds a character, bit 1 poisoned, bit 2 paralyzed (MemberIs 0D1C:0670; the POISONED and PARALYZED labels of the status line in 1547; 'is no longer paralyzed!' clears bit 2 in the effect ends of 1414)"
date = "2026-11-03"

