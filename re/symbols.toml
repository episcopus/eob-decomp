notes = "blocked: the unit's switches. The body is written from the disassembly and matches byte for byte under -B (TCC -S then TASM, 379 bytes, `make match` with /*@flags -ml -O -Z -B */), but not under the file's -ml -O -Z. The one difference is TCC's internal assembler merging two identical call tails: case 1's else `DrawSheetCell(5, 0x74, 0x68)` at ovl5:0140 and case 2's else `DrawSheetCell(body[gEFC6], 0x74, feet[gEFC6])` at ovl5:019B each end in `push ax; push cs; call DrawSheetCell; add sp,6; jmp 0x208` in the original (separate copies, 0x153 and 0x1C2), while our -c build routes both to the shared tail at 0x200 and is 16 bytes short. That is the -B signature of WHITEPAPER 2.1.1 (kept jump tails). The unit cannot be -B, though: SurrenderPanel (0x10A6) and ChooseChar (0x067B) match only under -ml -O -Z; under -B SurrenderPanel's item test becomes `or ax,ax; jne body; jmp skip` (2 bytes longer) where the original has `or ax,ax; je 0xD4; body`, and every source form tried for that test (assignment in the condition, a separate assignment then if, `if (item)`/`!=0`/`>0`, `if (!item) continue`, goto, an empty then, &&, no braces, do/while(0)) keeps one or the other. So overlay 5 was assembled from at least two modules with different switches, which one file's /*@flags*/ cannot express. A flags-per-function mechanism, or a documented way to split a unit across two src files, would let this match. The three local arrays `char head[6] = {9,8,8,9,9,0x0A}, body[6] = {0x0D,..}, feet[6] = {..}` are the F_SCOPY templates at ds:7B77, ds:7B7D and ds:7B83 (whitepaper 2.1.1); ds:7B89 is defined in the file because the original lays it right after those templates and the matcher compares that literal block by content."

