evidence = ["near", "frame"]
notes = "blocked: compiler codegen, and the unit cannot be `-B`. The original keeps both `bestVal = ...; best = who;` pairs inline (0D1C:096C and 0D1C:09A7, 200 bytes); our `-ml -O -Z` build cross-jumps the first pair into the second (a `jmp` to the shared store at 0D1C:099E, 6 bytes shorter). That is TCC's internal assembler (WHITEPAPER 2.1.1), the same class as 0ACD:091C, 14EF:0274 and 1414:034B. The assembler back-scans from the jump target and finds the pair there, so no source form avoids it: tried if/else and its reverse, two continues, one continue with a nested if, `&&`/`||`, goto, a trailing `continue` (the label still lands on the pair), braces, `else if`, `if (.. == 0) continue`, and every tail order. Through the assembler (`-B`, TCC -S then TASM /jNOSMART /m2) the tails stay apart but TCC -S emits the first `continue` in its far form (`jne @@7; jmp`, 2 bytes longer than the original `je` to 0D1C:09AD): the estimate sits on the 127-byte boundary and the -S pass takes it as too far, and TASM keeps it. DrawRowList needs the same internal-assembler inversion (`jne then; jmp else` against the original `je`, 0D1C:0465), so -B breaks it as well: 22 of 26 match with -B against 24 of 26 with -c. Applied here: the second parameter of FindClassSlot (0A72:007B) is `int` (the original sign-extends m20: `mov al,es:[bx+0x20]; cwde; push ax` at 0D1C:0942 and 0D1C:0977), which brings the draft within one cross-jump of the original.; blocked: CampLoop (ovl6:0000) matches every byte except its calls to its five later-defined siblings, which the original reaches with nop; push cs; call near (5 bytes, 90 0E E8) at ovl6:001F, 00AC, 012A, 013E, 04FD, 0707, 0722, 0729, 0731, 075A, 0770, 0778 and 07D3; our build emits a far call (9A) at each. The +0008 copy is fixed: it is a local ARRAY initialised from a list, char counters[6] = { 0, 0, 0, 0, 0, 0 } (TCC pushes ss before lea for that and lea first for a struct), and it now matches the original. Evidence that the nop+push cs is not a source form: (1) tc100, tc101, tc20, tc201 and bc20 all emit a far call (9A) for a call to a function defined later in the same file and push cs; call near (4 bytes, no nop) for one defined earlier; probes with -ml -O -Z plus -G, -Y, -Yf/-Yo/-Yn, -B, -P, -ms/-mc/-mm, near/far/pascal/cdecl/static prototypes, and empty statements or labels before the call never give 90 0E E8. (2) Every C overlay of EOB.EXE splits the same way: forward same-file calls are nop+push cs (ovl0 11, ovl1 19, ovl3 3, ovl5 1, ovl6 13) and backward ones are push cs with no nop (ovl0 83, ovl1 65, ovl2 8, ovl3 16, ovl4 52, ovl5 82); a non-overlay unit keeps a far call for a forward one (E1DE7 SetTextWindowAndClear reaches ClearTextRegion at 1DE7:00C2 with lcall). (3) ovl6 has 102 fixups, all segment words; 100 sit at a far call, and the 13 nop+push cs sites are not fixups, so a far call there was rewritten in place with a nop as the freed byte. That is the VROOMM overlay build (TLINK /o), which the matcher does not run: it links the unit as a plain segment, so our forward calls stay lcall. A matcher question: emulating the overlay patch, or building overlay units the overlay way, would match CampLoop. The body is written from the disassembly and reads correctly; the tick/hour control flow, the two 30-slot spell scans, the healing scan and the string-table far object (segment 2003, the far strings at 0x20030) are behind that first difference. Evidence for names: f0858 prints Hours rested, f09D2 tests monsters near, f0A92 tests ready to rest, f0B9B draws the warning box, f07E2 finds the most wounded member. The spell record stride 0x13, the tables ds:151F and ds:1344 and the 28-byte ds:8A84 monster records are from the disassembly."

