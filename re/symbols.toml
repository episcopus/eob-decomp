notes = "2026-11-01: the format byte is sign-extended to long and the switch runs on the int in AX (cbw; cwd; mov bx,ax; cmp bx,4; jbe; shl bx,1; jmp cs:[bx+20d], 8 bytes of locals, n in SI). tc100/tc101 fold (int)(long)char to char in C mode and never give a long switch a jump table, so the unit is compiled as C++ with -P: the C++ front end keeps the cbw;cwd for (int)(long)*src and emits exactly these bytes. -P mangles names, so src/E1B82.C wraps the definitions in extern \"C\" for cmatch. Another -P effect: FP_SEG(work) on a far-pointer local folds to push dx, but the original reloads the segment (push [bp-2], 1B82:013F/0197), so the work block is kept in a union (WorkBuffer) read as words[1]."
name = "Unpack"
level = "L2"
match_flags = "-ml -O -Z -G -P"

