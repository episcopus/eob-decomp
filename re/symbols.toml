notes = "blocked: 2026-11-01: the sub-dispatcher the driver reaches for opcode 0xFFEE (handler index 17), a postfix expression evaluator over a word stack (gEvalStack at ds:A95C, index gEvalTop at ds:A9EE). The loop is `while ((op = *script++) != 0xFFEE)` with a switch over 0xFFDA..0xFFFF (jump table at 122E:19EF, 38 entries, default pushes a literal 0..0x7f) and the 0xFFEE epilogue that pops gEvalStack, jumps to gBuf8DCA + word when the value is 0, and returns the distance. Case order is the original body order. Fixed 2026-11-01 from the jump table and the compiler output: (a) the item-type case is 0xFFE7 and the gB894 byte case is 0xFFE9, not 0xFFE8/0xFFEA (jump-table indices 13 and 15); (b) case 0xFFDA reuses `lhs` as the loop counter and `rhs` as the flag (counter in SI, flag in DI) with `(status & 1) == 1`, unlike FFDD/FFDC (counter in memory, flag in SI, byte test); (c) FFEF/FFF0 write the two arms out (`if (cond) gEvalStack[gEvalTop++] = 1; else ... = 0;`) rather than `... = (cond) != 0`, which makes TCC share the store-0 tail. Matches: prologue, frame (0xe), loop head, switch dispatch, the epilogue, the eight comparison/logical cases, FFDA, and byte for byte FFEF/FFF0, FFF7, FFF3, FFF2, FFF1, FFED, FFE0. Remaining, a toolchain question: the unit needs both toolchain behaviours at once. With `-ml -O -Z` TCC's internal assembler cross-jumps a later identical block into an earlier one, merging the FFEF/FFF0 store-0 tails and the FFDD/FFDC `mov si,1`, and TCC's C-level optimizer shares the FFF5/FFF2 ScanListItem tail; the original keeps all of them apart. With `-B` (TCC -S + TASM /jNOSMART) they are kept apart but TCC -S inverts DisarmMemberEffect first `if` (122E:01E1) and MarkMemberItemsOp first `if`, which the original has as one short `jne` (the boundary class of whitepaper 2.1.1). So no flag set matches the whole unit: -c 38 of 42 (147F 0x48 short), -B 36 of 42 (01D9 and 1CAD break). The same open problem as 0ACD:091C and e0d1c f0D1C_0903. Other remaining 147F differences under -B (0x29 short): the FFF5 argument order (the original evaluates the `t2 == -1 ? -1 : t2` condition before pushing the constant count 1), the FFDD/FFDC loop init (`xor ax,ax; mov [bp-0xa],ax; mov si,ax`), and the default case re-reads `script[-1]` into SI instead of using `op`."

