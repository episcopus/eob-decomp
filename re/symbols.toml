name = "Obj00C3"
notes = "blocked: a TCC -S codegen question, one 3-byte instruction. The original reloads les bx,[bp+6] at 08E6:00F2 before the Distance argument obj->id (08E6:00EE push [ds:FBCA]; 08E6:00F2 les bx,[bp+6]; 08E6:00F5 push es:[bx+2]); ours reuses the bx the five-test && chain already holds, so ours is 3 bytes short (ours je 0x86, original je 0x89). The unit is -B (0765, 0B94, 17FD and 1410 need it); under -B the body matches byte for byte except that load. The reload is what TCC emits when it has not proved the far pointer still lives in ES:BX; it appears in the original exactly where a body is a jump target (the else branch at 03FE:041F, the statement after a || chain, and the if(cond) ; else { body } layout, probed 2026-11-01), but here the body is fall-through after the jle. -O (jump optimisation) is what suppresses the redundant load (WHITEPAPER 2.1.1). Forms tried, each either keeping the cached bx as ours does or laying the first test as jne @@; jmp instead of je: the && chain, one-line, parenthesised and negated conditions, nested ifs (with and without braces), switch, goto, empty-body if, do/while(0), for(;;), while, a nested block, a declaration initialiser, register and separate locals, a bare obj;, an assignment inside the condition, casts, the if(cond) ; else { body } layout, and the || early-return form (which reloads but its first test is jne @@; jmp under /jNOSMART; it matches only without -B and then 0765, 0B94 and 17FD do not match). Flags probed on the whole unit 2026-11-01: -ml -O -Z -B 35 of 36, -ml -O -Z 32, -ml -O -Z -G -B 10, -ml -Z -B 2; -B is the only set that reaches 35 and the one missing function is this one. C++ -P, -1 and -k make no difference. src/E08E6.C carries the same evidence."

