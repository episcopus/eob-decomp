name = "InsertListItem"
notes = "blocked: compiler register allocation. The original's frame is exactly 0xc bytes (rec, next, cur as three far pointers), so `item` (0BD2:01D8 `mov si, word ptr [bp + 0xc]`) is the only named register variable; DI is a compiler temporary holding `cur->m06` from 0BD2:0251 (`mov bx, ax; mov di, word ptr [bx - 0x7228]`) to 0BD2:029B, and `key` stays in memory and is reloaded in each branch (0BD2:0212 and 0BD2:0268 `mov ax, word ptr [bp + 0xa]; mov word ptr es:[bx + 6], ax`, the else test at 0BD2:0276 `cmp word ptr [bp + 0xa], 0`). Our build instead promotes `key`: bare, it takes DI (0BD2:01D8 `mov di, word ptr [bp + 0xa]`) and the `cur->m06` temporary falls into AX and is reloaded (two loads of es:[bx + 8]); with a `link` local taking DI the build caches `key` in CX (prologue `mov cx, word ptr [bp + 0xa]`). A dead `(void)&key;` frees DI, but the compiler then does not common `cur->m06` into DI (it reloads twice), so the original's DI temporary is a register variable or a CSE our build will not form. Also found: the original's branch-1 `mov ax, si` before the two stores (0BD2:0201) is the chained assignment `rec->m08 = rec->m06 = item;`, not `rec->m06 = item; rec->m08 = item;` (which stores SI directly). Tried: the `key >= 0 ? gFBC8 : -1` ternary, `0 <= key`, `!(key < 0)`, the inverted `if (key < 0)`, a combined `rec->m0A = (rec->m04 = key) >= 0 ? ...`, testing `rec->m04` instead of `key`, `volatile int key`, `register` on item or link or key, all declaration orders of rec/next/cur and link (block and function scope), and the same body under -O, -Z-, -v, -r-, -G and -B and under TCC 1.00 and 1.01; all still promote or cache key. No source form found."

