# The names of globals (DGROUP offsets), set by `make rename` (tools/match/rename.py) with their
# evidence. Every file of src/ that declares one uses this name (`make readability` checks it).

[[global]]
id = "ds:80CA"
name = "gDrawText"
why = "a far function pointer that draws text: its callers 082C:0864 to 08FF pass a far string, x, y, a colour (0Ch, then 0Fh for the shadow) and a flag (review of e1aa6)"

[[global]]
id = "ds:810A"
name = "gAllocFailHook"
why = "far function pointer to 19BC:02B6 (OutOfMemory), called by MemAlloc when farmalloc fails (evidence: the lcall [0x810a] at 19BC:0063 and the pointer stored at DGROUP 810A)"

[[global]]
id = "ds:009F"
name = "gRegions"
why = "the 16-byte region records read by the selector 1A29:0189 and by 082C:0650; record 0 is 0,0,40,200 = left, top, width in 8-pixel columns, height in lines (review of e1a29)"

[[global]]
id = "ds:8108"
name = "gCurRegion"
why = "the index of the region 1A29:0189 selected last; the drawing wrappers compare their region argument with it to decide whether to reselect (1A29:001D) (review of e1a29)"

[[global]]
id = "ds:FE48"
name = "gRegionLeft"
why = "the current region's left edge in 8-pixel columns, loaded from record word 0 by 1A29:019A (review of e1a29)"

[[global]]
id = "ds:FE4A"
name = "gRegionLeftPx"
why = "the current region's left edge in pixels (gRegionLeft * 8), added to x by the drawing wrappers (1A29:0036) (review of e1a29)"

[[global]]
id = "ds:FE4C"
name = "gRegionRight"
why = "the current region's right edge (left + width), pushed to the driver as its second argument at 1A29:01D3 (review of e1a29)"

[[global]]
id = "ds:FE46"
name = "gRegionTop"
why = "the current region's top line, loaded from record word 1 by 1A29:01BC and added to y by the wrappers (review of e1a29)"

[[global]]
id = "ds:FE44"
name = "gRegionBottom"
why = "the current region's bottom line (top + height), pushed to the driver as its first argument at 1A29:01CE (review of e1a29)"

[[global]]
id = "ds:80B6"
name = "gSetRegion"
why = "a far function pointer called with (left, right, top, bottom) after a region is selected; no writer in the resident code, filled at load time [H] (review of e1a29)"
[[global]]
id = "ds:DCAC"
name = "gSoundMap"
why = "the 120-byte u8 map from the game sound number to the driver's, read by LoadSoundDriver (177D:000A) and indexed by PlaySound (177D:0070); whitepaper 4.4"
[[global]]
id = "ds:80E6"
name = "gSoundOn"
why = "the sound-on flag from argv[2] (whitepaper 2.6): PlaySound and PlaySoundVolume return at once when it is zero"
[[global]]
id = "ds:B892"
name = "gSoundCard"
why = "the sound choice from argv[2] minus '1' (whitepaper 2.6): 0 opens adlib.dat, nonzero pcgamesn.dat, and it picks the AdLib or PC-speaker play path"
[[global]]
id = "ds:009E"
name = "gSpeakerMode"
why = "Purpose unknown: when 1 the PC-speaker path of PlaySound/PlaySoundVolume gates the speaker on the sign of the sound number through ds:8A67"
[[global]]
id = "ds:8A67"
name = "gSpeakerOn"
why = "the PC-speaker gate bit toggled by the sign of the sound number when gSpeakerMode is 1, then applied by 1948:0458"
[[global]]
id = "ds:5E22"
name = "gCurSound"
why = "the driver sound number PlaySoundVolume is playing; it guards the retune and becomes gSoundMap[sound] at the end"
[[global]]
id = "ds:5E24"
name = "gCurVolume"
why = "the volume of gCurSound (0..0x10); zero means stop, 10h or more skips the AdLib play"
[[global]]
id = "ds:5E26"
name = "gPrevSound"
why = "the sound whose driver registers gSoundLevel and gSoundAmp hold, restored through 0000:03B0 before the next sound"
[[global]]
id = "ds:5E28"
name = "gSoundLevel"
why = "the driver level written to register 3 of the current sound (0000:03B0/0000:03CA)"
[[global]]
id = "ds:5E2A"
name = "gSoundAmp"
why = "the driver amplitude written to register 1 of the current sound (0000:03B0/0000:03CA)"
[[global]]
id = "ds:FBCA"
name = "gSoundVolume"
why = "the default sound volume PlaySoundDefault (177D:00F3) passes and PlaySoundVolume uses to derive the level"
