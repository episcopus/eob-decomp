# The names of globals (DGROUP offsets), set by `make rename` (tools/match/rename.py) with their
# evidence. Every file of src/ that declares one uses this name (`make readability` checks it).

[[global]]
id = "ds:80CA"
name = "gDrawText"
why = "a far function pointer that draws text: its callers 082C:0864 to 08FF pass a far string, x, y, a colour (0Ch, then 0Fh for the shadow) and a flag (review of e1aa6)"

[[global]]
id = "ds:810A"
name = "gAllocFailHook"
why = "far function pointer to 19BC:02B6 (OutOfMemory), called by MemAlloc when farmalloc fails (evidence: the lcall [0x810a] at 19BC:0063 and the pointer stored at DGROUP 810A)"

[[global]]
id = "ds:009F"
name = "gRegions"
why = "the 16-byte region records read by the selector 1A29:0189 and by 082C:0650; record 0 is 0,0,40,200 = left, top, width in 8-pixel columns, height in lines (review of e1a29)"

[[global]]
id = "ds:8108"
name = "gCurRegion"
why = "the index of the region 1A29:0189 selected last; the drawing wrappers compare their region argument with it to decide whether to reselect (1A29:001D) (review of e1a29)"

[[global]]
id = "ds:FE48"
name = "gRegionLeft"
why = "the current region's left edge in 8-pixel columns, loaded from record word 0 by 1A29:019A (review of e1a29)"

[[global]]
id = "ds:FE4A"
name = "gRegionLeftPx"
why = "the current region's left edge in pixels (gRegionLeft * 8), added to x by the drawing wrappers (1A29:0036) (review of e1a29)"

[[global]]
id = "ds:FE4C"
name = "gRegionRight"
why = "the current region's right edge (left + width), pushed to the driver as its second argument at 1A29:01D3 (review of e1a29)"

[[global]]
id = "ds:FE46"
name = "gRegionTop"
why = "the current region's top line, loaded from record word 1 by 1A29:01BC and added to y by the wrappers (review of e1a29)"

[[global]]
id = "ds:FE44"
name = "gRegionBottom"
why = "the current region's bottom line (top + height), pushed to the driver as its first argument at 1A29:01CE (review of e1a29)"

[[global]]
id = "ds:80B6"
name = "gSetRegion"
why = "a far function pointer called with (left, right, top, bottom) after a region is selected; no writer in the resident code, filled at load time [H] (review of e1a29)"

[[global]]
id = "ds:8154"
name = "gPointerHeight"
why = "the pointer sprite's height in pixels: filled from shape record byte +3 (1BB1:0034); 1BBE:0002 copies it to gSpriteHeight (ds:8182) and negates it into gNegSpriteHeight (ds:8184), and 1BBE:0095 adds that copy to the pointer's top edge before clipping the bottom edge to 200"

[[global]]
id = "ds:8156"
name = "gPointerWidth8"
why = "the pointer sprite's width in 8-pixel units: filled from shape record byte +2 plus 1 (1BB1:003A); 1BBE:0002 copies it to gSpriteWidth (ds:8186) and negates it into gNegSpriteWidth (ds:8188), and 1BBE:005F adds that copy to the pointer's left edge before clipping the right edge to 40. The unit is proven in 1BBE: x is shifted right three times (1BBE:0048..004F sar ax,1), the column is stored (1BBE:005C) and the right edge is clipped to 0x28 = 40 columns (1BBE:0077..007E)"

[[global]]
id = "ds:8158"
name = "gPointerHotX"
why = "the hot-spot x subtracted from the last drawn pointer position ds:815C before drawing: set from argument 1 at 1BB1:001B and used at 1BBE:0021 and 1BBE:0117 (the caller SetMouseItem (07A9:010C) passes 8 or 0, src/E07A9.C)"

[[global]]
id = "ds:815A"
name = "gPointerHotY"
why = "the hot-spot y subtracted from the last drawn pointer position ds:815E before drawing: set from argument 2 at 1BB1:0021 and used at 1BBE:002B and 1BBE:0127 (the caller SetMouseItem (07A9:010C) passes 8 or 0, src/E07A9.C)"

[[global]]
id = "ds:816A"
name = "gPointerBackOff"
why = "the save-under buffer offset: 1BBE:0002 restores the saved screen through it and 1BBE:00ED saves the background into it; 1BB1:0002 frees and reallocates it when the sprite size changes"

[[global]]
id = "ds:816C"
name = "gPointerBackSeg"
why = "the save-under buffer segment (0 = none): 1BBE:0002/00ED keep the screen behind the pointer in it; 1BB1:0002 tests it before reusing the buffer"

[[global]]
id = "ds:816E"
name = "gPointerShapeOff"
why = "the pointer shape record's offset: set from the far pointer argument at 1BB1:0027 and drawn by 1BBE:00ED through [ds:80C2]"

[[global]]
id = "ds:8170"
name = "gPointerShapeSeg"
why = "the pointer shape record's segment: set from the far pointer argument at 1BB1:002E and drawn by 1BBE:00ED through [ds:80C2]"

[[global]]
id = "ds:DCAC"
name = "gSoundMap"
why = "a far pointer to the 120-byte u8 map from the game sound number to the driver's, allocated by StartupAlloc (gSoundMap = MemAlloc(120L, 0), src/E07A9.C:216), read by LoadSoundDriver (177D:000A) and indexed by PlaySound (177D:0070) and PlaySoundAtCell (177D:0283); whitepaper 4.4"

[[global]]
id = "ds:80E6"
name = "gSoundOn"
why = "the sound-on flag from argv[2] (whitepaper 2.6): PlaySound and PlaySoundAtCell return at once when it is zero"

[[global]]
id = "ds:B892"
name = "gSoundCard"
why = "the sound choice from argv[2] minus '1' (whitepaper 2.6): 0 opens adlib.dat, nonzero pcgamesn.dat, and it picks the AdLib path or the speaker path (1 PC speaker, 2 Tandy speaker)"

[[global]]
id = "ds:009E"
name = "gTandySelected"
why = "Its only store is mov byte [9E],1 on StartupGame's Tandy sound path (07C8 image 0x81E8, src/E07C8.C:436, next to gTandyOn = 1); PlaySound and PlaySoundAtCell test it == 1 (177D image 0x17871, 0x179D9) to gate the gTandyOn voice toggle, so it records that the Tandy card was chosen."

[[global]]
id = "ds:8A67"
name = "gTandyOn"
why = "1 is Tandy, 0 the PC speaker: every test in src/E1948.ASM takes 1 as the Tandy path (SN76489 tone and volume writes, the Tandy note table) and 0 as the port 61h speaker (1948:0119, 01D6, 02C7, 02F1, 0316, 03C5 and 0406); StartupGame sets it to 1 only on the Tandy path (src/E07C8.C:305-307)"

[[global]]
id = "ds:5E22"
name = "gCurSound"
why = "the driver sound number recorded by the previous call of PlaySoundAtCell; nonzero guards the retune, and 177D:0106 restarts this recorded number, not the new one, then becomes gSoundMap[sound] at the end"

[[global]]
id = "ds:5E24"
name = "gCurAttenuation"
why = "the attenuation of the recorded sound gCurSound: 0 means no fade, a larger value fades the level further toward full attenuation (177D:01AF), and 10h or more skips the AdLib play (177D:012B); computed from Distance(gPartyCell, cell) at 177D:026E, used only in src/E177D.C"

[[global]]
id = "ds:5E26"
name = "gPrevSound"
why = "the sound whose driver registers gSoundLevel and gSoundAmp hold, restored through 0000:03B0 before the next sound"

[[global]]
id = "ds:5E28"
name = "gSoundLevel"
why = "the value read from register 3 of the recorded sound gCurSound (177D:0170 to 017F, again at 0194 to 01A3); written back to register 3 of gPrevSound on the next call (177D:0142 to 014E through 0000:03B0)"

[[global]]
id = "ds:5E2A"
name = "gSoundReg1"
why = "the value read from register 1 of the recorded sound gCurSound (177D:0182 to 0191), written back to register 1 of gPrevSound on the next call (177D:0156 to 0167 through 0000:03B0); Purpose unknown: 177D:01DA writes driver register 1 with the value 20h - gCurAttenuation, and what that value means is not known. Named gSoundReg1, not gSoundAmp, because the bytes do not show an amplitude"

[[global]]
id = "ds:FBCA"
name = "gPartyCell"
why = "the party's map cell: ResetMapScreen sets it to 0x1EA (src/E0ACD.C:1004), monsters are measured from it (Distance(party cell, monster cell) < 2, src/EOV6.C:439), PlaySoundAtCell's callers pass an object's cell as the sound source (src/E08E6.C:349 and :561 to :604) and it is passed with that cell to Distance (17A6:0F61, 177D:026A), which reads each argument as a packed map cell (y * 32 + x, a 10-bit value whose low five bits are x) at 17A6:0F61; objects are compared with it (src/E08E6.C:334, :469) and it indexes the nine-byte cell records (src/E0D1C.C:44)"

[[global]]
id = "ds:DDE4"
name = "gItemIcons"
why = "One far pointer per item icon number: ovl2:03D0 fills entries 1..0x58 from 16x16 cells of the ITEMICN sheet (string ds:677D) and ovl2:0029 writes entry 0, the default pointer shape; SetMouseItem indexes it with Entry14.icon (07A9:0141) and DrawItemIcon draws gIconsDDE4[icon] (src/E0D1C.C:496). Entry 0x59 is gRemappedIcon (ds:DF48), so the two are one array."

[[global]]
id = "ds:80D2"
name = "gSetRemapTable"
why = "Graphics driver export 35. mcga.ovl 277B copies eight words from its far argument into the driver's 16-byte buffer at mcga.ovl 030C, the buffer ds:80E2 points at and that the remapped shape draw ds:80D6 translates pixels through (mcga.ovl 28C2 mov bx,30Ch then xlatb); callers pass an ITEMRMP row (07A9:0184) or the rows ds:1CD3/ds:1CE3 (08E6:0DFC). The driver table mapping: the graphics overlay's init (mcga.ovl 0BF2..0C2F) walks the request table at ds:802A (request +4, ds:8125 = 802A:212E), copies the game's seven import pointers into the driver and writes its own export pointers into the zero pairs that follow, so ds:8046 + 4*i is mcga.ovl export i (the far pointer table at mcga.ovl 001F)."

[[global]]
id = "ds:804E"
name = "gRestoreRect"
why = "a far function pointer called as (x, y, w, h, void far *buf) that writes a buffer rectangle back to the screen: 0EF3:08B1 restores the 16 rectangles saved before the palette was drawn, and 1BBE:0002 uses it to erase the pointer (E1BBE.ASM)"

[[global]]
id = "ds:80AE"
name = "gSaveRect"
why = "a far function pointer called as (x, y, w, h, void far *buf) that copies a screen rectangle into a buffer: 0EF3:0757 saves 16 rectangles before drawing the palette, and 1BBE:00ED saves the screen under the pointer before drawing the shape (E1BBE.ASM)"

[[global]]
id = "ds:8138"
name = "gCursorX"
why = "the cursor (mouse pointer) x in pixels: InitMouse sets it to the middle of a 320x200 screen at 1A72:00E6, the INT 33h handler rewrites it when the busy flag ds:812E is free and ds:80EC is not 2 at 1A72:0219, the pointer placer stores the clamped position at 1BF3:000E (E1BF3.ASM:35), and the recorded-input glue stores it at 1AAD:0CF7 (E1AAD.ASM:1352)"

[[global]]
id = "ds:813A"
name = "gCursorY"
why = "the cursor (mouse pointer) y in pixels: InitMouse sets it at 1A72:00EC, the INT 33h handler rewrites it under the same conditions as x at 1A72:021D, the pointer placer stores the clamped position at 1BF3:0028 (E1BF3.ASM:44), and the recorded-input glue stores it at 1AAD:0D01 (E1AAD.ASM:1355)"

[[global]]
id = "ds:8146"
name = "gHideDepth"
why = "the pointer hide depth: 1BBE:0002 increments it and 1BBE:00ED decrements it and only draws at zero, 1A72:00F2 sets it to 1 at start-up and 1A72:0235 skips the pointer work while it is non-zero (E1BBE.ASM)"

[[global]]
id = "ds:815C"
name = "gDrawnX"
why = "the x the pointer was last drawn at, in pixels: 1BBE:00ED copies 8138 here before drawing, 1A72:0225 compares it with 8138 to decide whether to draw (E1BBE.ASM)"

[[global]]
id = "ds:815E"
name = "gDrawnY"
why = "the y the pointer was last drawn at, in pixels: 1BBE:00ED copies 813A here before drawing, 1A72:022F compares it with 813A (E1BBE.ASM)"

[[global]]
id = "ds:8160"
name = "gPointerState"
why = "the pointer state word: 1BBE:01FE sets bit 8000 when it hides the pointer, 1BBE:02C2 clears the word and tests bit 4000 (redraw requested) when showing, 1A72:0204 sets bit 4000 and 1A72:0242 tests bit 8000; the low byte is a counter 1BBE:01FE advances and 1BBE:02C2 decrements (E1BBE.ASM)"

[[global]]
id = "ds:8162"
name = "gZoneLeft"
why = "the left edge of the zone the pointer is hidden over, in pixels: 1BBE:01FE stores its first argument here and reduces it by the sprite width, 1A72:0244 tests the cursor against it (E1BBE.ASM)"

[[global]]
id = "ds:8164"
name = "gZoneTop"
why = "the top edge of the hide zone, in pixels: 1BBE:01FE stores its second argument here and reduces it by the sprite height, 1A72:0250 tests the cursor against it (E1BBE.ASM)"

[[global]]
id = "ds:8166"
name = "gZoneRight"
why = "the right edge of the hide zone, in pixels: 1BBE:01FE stores its third argument here, 1A72:024A tests the cursor against it (E1BBE.ASM)"

[[global]]
id = "ds:8168"
name = "gZoneBottom"
why = "the bottom edge of the hide zone, in pixels: 1BBE:01FE stores its fourth argument here, 1A72:0256 tests the cursor against it (E1BBE.ASM)"

[[global]]
id = "ds:8176"
name = "gRectLeft"
why = "the clipped rectangle's left edge: 1BBE:0002/00ED write the pointer x here, divide it by 8 and clip it to 0..40 columns before the [ds:804E]/[ds:80AE] call; 1BBE:01FE writes it in pixels rounded down to a multiple of 8 (E1BBE.ASM)"

[[global]]
id = "ds:8178"
name = "gRectTop"
why = "the clipped rectangle's top row: 1BBE:0002/00ED write the pointer y here, clip it to 0..200 and pass it to [ds:804E]/[ds:80AE] (E1BBE.ASM)"

[[global]]
id = "ds:817A"
name = "gRectRight"
why = "the clipped rectangle's right edge: x/8 plus the sprite width in columns, clipped to 40; the width passed to [ds:804E]/[ds:80AE] is this minus ds:8176 (E1BBE.ASM)"

[[global]]
id = "ds:817C"
name = "gRectBottom"
why = "the clipped rectangle's bottom row: the pointer y plus the sprite height in pixels, clipped to 200; the height passed to [ds:804E]/[ds:80AE] is this minus ds:8178 (E1BBE.ASM)"

[[global]]
id = "ds:817E"
name = "gShapeX"
why = "the x the pointer shape is drawn at, in pixels and unclipped: 1BBE:00ED copies 8138 - 8158 here and pushes it to [ds:80C2] (E1BBE.ASM)"

[[global]]
id = "ds:8180"
name = "gShapeY"
why = "the y the pointer shape is drawn at, in pixels and unclipped: 1BBE:00ED copies 813A - 815A here and pushes it to [ds:80C2] (E1BBE.ASM)"

[[global]]
id = "ds:8182"
name = "gSpriteHeight"
why = "a copy of the sprite height ds:8154, the clip bound for the pointer y in 1BBE:0002/00ED (E1BBE.ASM)"

[[global]]
id = "ds:8184"
name = "gNegSpriteHeight"
why = "minus the sprite height ds:8154, the lower clip bound for the pointer y in 1BBE:0002/00ED (E1BBE.ASM)"

[[global]]
id = "ds:8186"
name = "gSpriteWidth"
why = "a copy of the sprite width ds:8156 in 8-pixel columns, the clip bound for the pointer x in 1BBE:0002/00ED (E1BBE.ASM)"

[[global]]
id = "ds:8188"
name = "gNegSpriteWidth"
why = "minus the sprite width ds:8156, the lower clip bound for the pointer x divided by 8 in 1BBE:0002/00ED (E1BBE.ASM)"

[[global]]
id = "ds:812A"
name = "gBufSeg"
why = "the shared unpack work buffer's segment, stored by SetUnpackBuffer (1B82:0217) and read by Unpack (1B82:00C7) for formats 1 and 2 when it is large enough (src/E1B82.C; WHITEPAPER 4.2 (WHITEPAPER.md:151))"

[[global]]
id = "ds:812C"
name = "gBufSize"
why = "the shared unpack work buffer's size in bytes, stored by SetUnpackBuffer (1B82:0217) and compared by Unpack (1B82:00C7) with 0x3C00/0xFC00 to decide whether to allocate (src/E1B82.C; WHITEPAPER 4.2 (WHITEPAPER.md:151))"

[[global]]
id = "ds:DCA6"
name = "gSegDCA6"
why = "19EC:0002 does not allocate: it returns MK_FP(gSegsFC0C[kind|1], 0), a far pointer with offset 0 to the page/buffer table segment of ds:DCA6's slot 7 (src/E19EC.C:18-20, src/E1B82.C); not an object (review of e07a9)"

[[global]]
id = "ds:DF4E"
name = "gSegDF4E"
why = "19EC:0002 returns MK_FP(gSegsFC0C[kind|1], 0), a far pointer with offset 0 to the page/buffer table segment of ds:DF4E's slot 5 (src/E19EC.C:18-20); not an object (review of e07a9)"

[[global]]
id = "ds:EFC2"
name = "gSegEFC2"
why = "19EC:0002 returns MK_FP(gSegsFC0C[kind|1], 0), a far pointer with offset 0 to the page/buffer table segment of ds:EFC2's slot 3 (src/E19EC.C:18-20); not an object (review of e07a9)"

[[global]]
id = "ds:812E"
name = "gPointerBusy"
why = "the word ds:812E is a busy flag, not a lock: 1BB1:0008 and 1BF3:0080 test it then increment it (not atomic), and 1BB1:00C8 and 1BF3:0085 decrement it; SetMousePointerShape and the 1BF3 cursor setters hold it across their work (review of e1bb1)"

[[global]]
id = "ds:814A"
name = "gMouseDisabled"
why = "nonzero disables the mouse: the INT 33h handler body skips all of its work (1A72:254-255) and HidePointer/ShowPointer do nothing (1BBE:89-90, 178); 1A72:215 sets it to 1 at install and the overlay loader 1C00:00D4 clears it once a driver overlay has loaded and its entry has run, which enables the handler and the pointer; the test at 07A9:0148 (SetMouseItem, 07A9:010C) and E14EF.C:144 and E14EF.C:227 test it the same way"

[[global]]
id = "ds:FE64"
name = "gTextLeft"
why = "the active text window's left edge in 8-pixel columns, loaded from region record word 0 by SetTextWindow (1DE7:0009) and used to place text and fills (1DE7:03B2, 1DE7:0344); the panel origin x in src/E14EF.C"

[[global]]
id = "ds:FE66"
name = "gTextTop"
why = "the active text window's top edge in pixel rows, loaded from region record word 1 by SetTextWindow (1DE7:0009) and used to place text and fills (1DE7:03B2, 1DE7:0344); the panel origin y in src/E14EF.C"

[[global]]
id = "ds:811D"
name = "gTextAttr1"
why = "the first text attribute (foreground colour) passed to the draw-text hook ds:80CA (1DE7:03B2, 1DE7:060A) and set by DrawText control code 0x06; default 0x0F at E07C8.C:251; the initial region record gRegions[0] at ds:009F (file offset 0x23B7F) holds saved0 = 0x0F (ds:00A7)"

[[global]]
id = "ds:811B"
name = "gTextAttr2"
why = "the second text attribute (the fill colour of ClearTextRegion and of the redrawn scroll line) passed to the rectangle hook ds:806A and to the draw-text hook (1DE7:0344, 1DE7:03B2) and set by DrawText control code 0x02; default 0x0C at E07C8.C:252; the initial region record gRegions[0] at ds:009F (file offset 0x23B7F) holds saved1 = 0x0C (ds:00A9)"

[[global]]
id = "ds:806A"
name = "gFillRect"
why = "a far rectangle-fill routine called with (x1, y1, x2, y2, pattern): E082C.C:442 fills the bevel interior, E1DE7.C:221/246 fill and redraw text-window rectangles; so gFillRect, not the address-suffix placeholder gRect806A"

[[global]]
id = "ds:FE6E"
name = "gFileNameBuf"
why = "the scratch text buffer EOV2 LoadItemSheets formats ITEMRMP.%s into for FileOpen (src/EOV2.C:294) and EOV6/E082C format filenames and messages into; main already named it so"

[[global]]
id = "ds:81EA"
name = "gSearchAllDrives"
why = "the flag 1C0E:1310 tests before scanning every logical drive for the overlay file; set by 1C0E:1724 and cleared by 1C0E:171A"

[[global]]
id = "ds:8148"
name = "gMouseHandlerInstalled"
why = "1 when the mouse driver handler is installed: set to 1 at install (1A72:014A, E1A72.ASM:233), cleared when no mouse driver is found (1A72:011B, the no-driver path of InitMouse, E1A72.ASM:219); MouseDisable tests it at 1A72:0288 (E1A72.ASM:368) to remove the handler only when installed; Main reads it to choose gMouseDisabled (E07C8.C:153); E07C8.C:36 says 'mouse event handler'"

[[global]]
id = "ds:8052"
name = "gCopyRegion"
why = "Graphics driver export 3 (mcga.ovl 05D4): it takes (x1, y1, x2, y2, width, height, srcPage, dstPage), x in 8-pixel columns, looks the two page segments up through the gSegsFC0C import (mcga.ovl 0641..064F calling 0B3F) and copies the rectangle at (x1, y1) to (x2, y2); ClipRect (19F3:000E) is its only caller, e.g. ClipRect(0,0,0,0,40,200,4,2) copies page 4 to page 2. The driver table mapping: the graphics overlay's init (mcga.ovl 0BF2..0C2F) walks the request table at ds:802A (request +4, ds:8125 = 802A:212E), copies the game's seven import pointers into the driver and writes its own export pointers into the zero pairs that follow, so ds:8046 + 4*i is mcga.ovl export i (the far pointer table at mcga.ovl 001F)."

[[global]]
id = "ds:810E"
name = "gAllocCount"
why = "net allocation counter: MemAlloc adds one per successful allocation (src/E19BC.C:97) and MemFree subtracts one on every call (src/E19BC.C:120), and StartupAlloc clears it (src/E07A9.C:242); what reads the count is unknown, so the name says what it holds"

[[global]]
id = "ds:88AA"
name = "gSongBase"
why = "the song base, not a current position: copied once from gSongPtr at song start (E1948.ASM 1948:006E and 0074) and read as the base of every voice (1948:00FA and 00FE); the value that moves is gVoicePos"

[[global]]
id = "ds:88AC"
name = "gSongBaseSeg"
why = "the song base segment, not a current position: copied once from gSongPtrSeg at song start (E1948.ASM 1948:0074) and read as the segment of every voice's song base (1948:00FE)"

[[global]]
id = "ds:8A58"
name = "gVoiceLengthMul"
why = "scales the note length, not an amplitude: its only read is mul on the note duration (E1948.ASM 1948:0144); set by E2h (1948:020F), changed by E8h and E9h (1948:0222, 022A, 023E, 0244) and set to 1 at song start (1948:008B); the Tandy volume is gVoiceTandyVol"

[[global]]
id = "ds:8A40"
name = "gVoiceMute"
why = "nonzero mutes the voice this tick, it does not restart it: E1948.ASM 1948:0278 falls through to muteVoice; only 0 is written in this unit (1948:0081 and 027F), the writer of 1 is unknown"

[[global]]
id = "ds:8A44"
name = "gVoiceReadNext"
why = "1 means the voice reads its next note or command this tick (set at E1948.ASM 1948:007C and 0273), not that a note sounds; 0 means a note is sounding and its duration counts down (set at 1948:0151; endCommand at 1948:0184 also leaves 0)"

[[global]]
id = "ds:8A6A"
name = "gTickSeconds"
why = "counts [H] seconds up to 60, not a phase: incremented once per 292-tick period (E1948.ASM 1948:001A) and wrapped at 3Bh (1948:0023 to 0025); nothing outside this unit reads it"

[[global]]
id = "ds:8100"
name = "gFontWidth"
why = "font cell width; the source is src/E1A47.C and src/E1DE7.C:54-55 calls it the font cell width"

[[global]]
id = "ds:8101"
name = "gFontHeight"
why = "font cell height; the source is src/E1A47.C and src/E1DE7.C:54-55 calls it the font cell height"

[[global]]
id = "ds:EFCC"
name = "gNameTable"
why = "the far table 0EF3:2295 reads names from; set to gClericSpellNames or gMageSpellNames by 0EF3:21E0 (only E0EF3.C references ds:EFCC)"

[[global]]
id = "ds:84A0"
name = "gRestoreMode"
why = "ds:84A0 is set from argv[5] (E07C8.C:193) and put back through f1DDD_002D(7) at exit (:368, :422); E1DDD.C:43-49 uses it as the restore mode, work/reviews/e1ddd.md:18 suggests gRestoreMode"

[[global]]
id = "ds:8894"
name = "gArgv"
why = "the C library's _argv: make rebuild links ds:8894 to the library public _argv (playbook 50 item 23), and StartupGame reads argv[6] through it, atol(gArgv->number) (07C8:0212)"

[[global]]
id = "ds:805A"
name = "gDrawCell8x8"
why = "Graphics driver export 5 (mcga.ovl 06AF): it clamps the column to 0..39 and the line to 0..192 and copies 8 rows of 8 bytes (rep movsw cx=4, eight times, stride 138h) from the far source to the page; DrawTextFrame and DrawTileRun draw each frame tile through it at gTileBuf + (n << 5 or 6) (src/E1DE7.C:180-215). The driver table mapping: the graphics overlay's init (mcga.ovl 0BF2..0C2F) walks the request table at ds:802A (request +4, ds:8125 = 802A:212E), copies the game's seven import pointers into the driver and writes its own export pointers into the zero pairs that follow, so ds:8046 + 4*i is mcga.ovl export i (the far pointer table at mcga.ovl 001F)."

[[global]]
id = "ds:8117"
name = "gScrollHook"
why = "the far routine DrawTextLine calls when the cursor row starts below the last full line (the same condition as the clip branch of DrawTextLine), gated by gScrollOn (ds:8110); overlay 5 sets the pair at ds:8117/ds:8119 when it opens windows 0xC and 9 (src/EOV5.C:1114-1115, :1254-1255, :1317-1318; EOV5.C:161 declares extern int gScrollHook; /*@ ds:8117 */ and g8119 at :162; the words 0xAC and 0x2D0 at EOV5.C:1114-1115 are the offset and segment of the far pointer)"

[[global]]
id = "ds:811F"
name = "gTextRegion"
why = "the record index of the current text window: SetTextWindow stores it as gRegions[g811F] (1DE7:0009; src/E1A29.C:38, 1C0E:0ADD keeps it in savedTextRegion); E07A9.C, E1C0E.C, EOV1.ASM, EOV2.C and EOV6.C read it"

[[global]]
id = "ds:8102"
name = "gGraphicsChoice"
why = "the graphics choice: Main sets it to argv[1][0] + 1 (src/E07C8.C:229) and StartupGame subtracts 0x31 (src/E07C8.C:298), after the 0x36 check at :296, so the digit 0..4 exists only after :298; the digit indexes gOverlayFiles (0 cga, 1 tandy, 2 ega, 3 mcga/VGA, 4 vga; src/E07C8.C:44-45); the dispatch at 17A6:03E7 names 0 CGA, 1 Tandy, 2 EGA, 3 MCGA; src/E14EF.C:68 reads it as the graphics choice, 1 Tandy and 3 VGA; 3 and 4 select the 6-bit cells (src/E1DE7.C:163-165, :197); whitepaper 2.6: 1 Tandy, 3 VGA"

[[global]]
id = "ds:8115"
name = "gDrawPage"
why = "the page the graphics driver draws to: the driver's import slot ds:8032 points at it (212E:8115) and MCGA.OVL 0B3F reads it masked with 1Fh to index the page segments gPageSegs (ds:FC0C); setting it to 2 draws to page 2; its INTRO.EXE twin ds:1FA1 is gDrawPage"

[[global]]
id = "ds:8140"
name = "gClickX"
why = "x of the last mouse click, written at src/E1AAD.ASM:396 and read as a point by ClickInRect at 082C:0A5D (src/E082C.C:529-531) and by src/E14EF.C:325"

[[global]]
id = "ds:8142"
name = "gClickY"
why = "y of the last mouse click, written at src/E1AAD.ASM:405 and read as a point by ClickInRect at 082C:0A5D (src/E082C.C:529-531) and by src/E14EF.C:325"

[[global]]
id = "intro/ds:28A0"
name = "gSoundMap"
why = "the 120-byte game-number to driver-number sound map StartupGame allocates and reads from sound.dat or pcsound.dat (SOUND_MAP_SIZE 0x78); EOB keeps the same map as gSoundMap at ds:DCAC (src/E07A9.C:122, src/E177D.C:3-4), so the same kind of block keeps one name across src/. make rename declines this name because EOB's ds:DCAC already uses it in another program"

[[global]]
id = "intro/ds:28C4"
name = "gMemTopSeg"
why = "the memory top ReserveMemoryBelowVideo (0923:0133) stores it at 0923:01F0 (src/I0923.ASM:3, the store at :328) and TrimMemoryToVideo reads back (0923:02B3); i0892 reads it at 0892:01D8 and hands it to EOB.EXE as argv[6]. make rename declines this name because EOB's word at 1990:0002 (src/E07C8.C:125) already uses it in another program"

[[global]]
id = "intro/ds:28C6"
name = "gSoundChoice"
why = "I0892.C (already merged) declares intro/ds:28C6 as gSoundChoice (atol(argv[2]); 1 AdLib, 2 PC speaker, 3 Tandy); IOV0.C called it gSoundCard, so one address keeps one name across src/"

[[global]]
id = "intro/ds:2D42"
name = "gPaletteBuf"
why = "I0892.C (already merged) declares intro/ds:2D42 as gPaletteBuf, the palette buffer StartupGame allocates and main loads palette.col into; IOV0.C called it gPalette, so one address keeps one name across src/"

[[global]]
id = "intro/ds:1F8E"
name = "gGraphicsChoice"
why = "I0892.C (already merged) declares intro/ds:1F8E as gGraphicsChoice (argv[1][0] + 1, reduced by 0x31 to the graphics choice); IOV0.C called it gGraphicsMode, so one address keeps one name across src/. make rename declines this name because EOB.EXE's ds:8102 already uses it for the same concept in another program"

[[global]]
id = "ds:80C6"
name = "gSaveRectSize"
why = "an indirect far function that returns the save-under buffer size in bytes for a (width, height) request; DisplayFileError (1C0E:0ADD) calls it before MemAlloc (src/E1C0E.C:553), and E1BB1.ASM:33 describes the query"

[[global]]
id = "ds:FE5A"
name = "gFont8x8"
why = "the 8x8 font loaded from Font8.fnt; E07C8.C:376 loads it (gFont8x8 = f1A47_0005(\"Font8.fnt\")) and 1C0E:0ADD (DisplayFileError) switches the text font to it through 1A47:0169 (EOV1.ASM:65 and EOV2.C:133 declare the same address)"

[[global]]
id = "ds:8104"
name = "gFatalHandler"
why = "the fatal file error handler, a far pointer at ds:8104; the image holds 1C0E:0D9B (ShowMessage) there (EOB.EXE file offset 2BBE4) and FatalError (1C0E:00AA) calls it (src/E1C0E.C:176, :177)"

[[global]]
id = "ds:8111"
name = "gRetryHandler"
why = "the retry file error handler, a far pointer at ds:8111; the image holds 1C0E:0ADD (DisplayFileError) there (EOB.EXE file offset 2BBF1) and RetryFile (1C0E:0046) calls it (src/E1C0E.C:165)"

[[global]]
id = "ds:628C"
name = "gMenus"
why = "seven 5-byte records (message, text window, first button definition, count, colour) indexed by the menu number ovl1:1153 takes (1 to 6 in its callers); ovl1:1ACD edits their message bytes in place"

[[global]]
id = "ds:80E8"
name = "gTunesOn"
why = "ovl1:1ACD formats the 'Tunes are %-3s' button label (gStrings2003 message 0x11) from BoolString(ds:80E8) and the Tunes button 0x800D toggles it"

[[global]]
id = "ds:F43C"
name = "gBarGraphsOn"
why = "ovl1:1ACD formats the 'Bar Graphs are %-3s' button label (gStrings2003 message 0x13) from BoolString(ds:F43C) and the Bar Graphs button 0x800F toggles it"

[[global]]
id = "ds:FE2C"
name = "gNeedsRest"
why = "ovl1:025D sets it when a spell slot is retired; ovl1:1ACD shows message 0x2C 'Your party needs to rest to gain spells.' when Exit is pressed with it set, and clears it when CampLoop (Rest Party) returns 0"

[[global]]
id = "ds:1278"
name = "gMageSpellNames"
why = "ds:1278 is a table of far name pointers whose strings, decoded from the EXE, are the 25 mage spell names (Armor, Burning Hands, Detect Magic, Magic Missile ... Hold Monster); ovl1:0881 draws spell rows from it and 0BD2:05B5 builds scroll names from it"

[[global]]
id = "ds:12E0"
name = "gClericSpellNames"
why = "ds:12E0 is a table of far name pointers whose strings, decoded from the EXE, are the 24 cleric spell names (Bless, Cure Light Wnds ... Lay on Hands); ovl1:0881 draws spell rows from it (cleric flag) and 0BD2:05B5 builds scroll names from it"

[[global]]
id = "intro/ds:1EE2"
name = "gClearDrawPage"
why = "Slot 11 of the driver table (ds:1EB6 + 4 * 11, as EOB's ds:8056): MCGA.OVL 0693 zeroes 7D00h words at the segment of the page named by the draw page word (driver import slot 2, gDrawPage ds:1FA1) through the page table (slot 1, ds:28CC); EGA 07FB, CGA 095B and TGA 07F2 do the same."

[[global]]
id = "intro/ds:19E7"
name = "gBuiltinPalette"
why = "the 16-byte palette table at ds:19E7 passed to the palette setter on the Tandy and EGA choices (Main 0892:010F, 0892:0116; StartupGame 0892:05E0); its bytes 00 05 03 02 0A 0E 0C 06 04 0B 09 01 00 08 07 0F are the built-in palette table, not a 6-bit EGA palette, and the Tandy choice uses it too so gEgaPalette has no evidence"

[[global]]
id = "intro/ds:1F46"
name = "gSetPalette"
why = "the far palette-setter pointer at ds:1F46 the front end installs; Main passes it the built-in table ds:19E7, the loaded palette.col buffer gPaletteBuf and the zero table ds:19F7 (0892:013E, 01AE), StartupGame passes it the built-in table and gPaletteBuf (0892:0635), IOV0.C calls it the same (ovl0:0000, ovl0:2A4E)"

[[global]]
id = "intro/ds:289B"
name = "gTandyOn"
why = "the PC speaker / Tandy driver select at ds:289B: StartupGame sets it to 1 only on the Tandy sound path (0892:0807) and ShutdownGame clears it (0892:087F); IOV0.C tests the same word in PlaySound (ovl0:2D4E). The same concept as EOB's ds:8A67 (re/renames.toml:1436); make rename declines the name because EOB's ds:8A67 already uses it in another program"

[[global]]
id = "ds:1879"
name = "gWallVmpSet"
why = "Per wall type (RegisterWallObject ovl3:01C8 fills it): the 1-based block set in the level's .VMP/.EMP file loaded into gBufF43E (ovl3:0A7C sprintf \"%s.%s\" VMP/EMP); CopyViewColumn (ovl4:02A5) reads blocks at (set - 1) * 0x35E bytes + 0x294, and 0 means nothing is drawn (ComputeViewSpan skips it, ovl4:0AD0 and ovl4:19C4 draw items behind it)."

[[global]]
id = "ds:A92A"
name = "gCompassIcons"
why = "Twelve cells, three rows by four facings, cut from DECORATE by LoadDecorateIcons (ovl2:0577); DrawViewRows (ovl4:1EDE) draws gCompassIcons[gPartyDir + 4 * i] for the three rows below the view (x 0x70, 0x4D, 0x95) and only when gPartyDir changed, which is the compass [H: the game's compass under the view]."

