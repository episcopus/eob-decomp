[[global]]
id = "ds:61C2"
name = "gFmtThreeLevels"
why = "The string is \"%d/%d/%d\"; DrawCharPanel ovl0:065B picks it when levels[2] is above 0 (a three-class character)."
[[global]]
id = "ds:115D"
name = "gAbilityAbbrevs"
why = "DrawCharPanel ovl0:065B draws entries 8..13, whose targets read STR, INT, WIS, DEX, CON, CHA. The real table starts at ds:117D (115D + 8 * 4); 115D..117C hold other tables (ds:115F, ds:116E), so src should declare it at 117D and index [i - 8]."
[[global]]
id = "ds:FC8A"
name = "gNewMemberFemale"
why = "PickOption ovl0:1F66 stores choice % 2 of the race list, and odd race indices are the FEMALE entries of gRaceNames; PickPartySlot passes it to FindSlot, which limits a female to portraits 0x1a.. and a male to ..0x1c."
[[global]]
id = "ds:5EB0"
name = "gBoxAnimMember"
why = "AnimateMemberBox ovl0:1224 compares it with gChargenMember and, when they differ, resets the frame timer and stores the member; its initial byte is 6 (no member yet)."
[[global]]
id = "ds:FC84"
name = "gBoxAnimFrame"
why = "AnimateMemberBox ovl0:1224 steps it 0..9 every two ticks and draws gBoxAnimCells[gFC84] into the current member's box."
[[global]]
id = "ds:FC85"
name = "gBoxAnimDrawnFrame"
why = "AnimateMemberBox ovl0:1224 returns early while it equals gBoxAnimFrame and sets it to gBoxAnimFrame after drawing, so it holds the frame last drawn."
[[global]]
id = "ds:FC86"
name = "gBoxAnimNextTick"
why = "AnimateMemberBox ovl0:1224 advances the frame when it is below gTicks and then sets it to gTicks + 2; a member change resets it to 0."
[[global]]
id = "ds:6079"
name = "gMemberBoxX"
why = "Four bytes 16, 80, 16, 80, the left edge of each member's box (the same values as ds:5E54); PickOption ovl0:1F66 draws the box outline with DrawRect from them."
[[global]]
id = "ds:607D"
name = "gMemberBoxY"
why = "Four bytes 63, 63, 127, 127, the top edge of each member's box (the same values as ds:5E5C); PickOption ovl0:1F66 draws the box outline with DrawRect from them."
[[global]]
id = "ds:623F"
name = "gStrSelectRace"
why = "The string reads \"SELECT RACE:\"; PickOption ovl0:1F66 draws it at (0x93, 0x43) before listing gRaceNames."
[[global]]
id = "ds:618C"
name = "gStrBlankName"
why = "The string is ten spaces; DrawCharName ovl0:05BA draws it at the name slot before the centred name, erasing the old name (ten is the name length EditTextField allows in ovl0:23EC)."
[[global]]
id = "ds:6081"
name = "gRaceClassMasks"
why = "Six longs indexed by race >> 1, a bit per class index the race may take (HUMAN 0x3f is the six single classes); PickClass ovl0:207A filters the class list gClassNames with it."
[[global]]
id = "ds:6099"
name = "gClassAlignmentMasks"
why = "Fifteen longs indexed by class, a bit per alignment allowed (PALADIN 0x1 is LAWFUL GOOD only, RANGER 0x7 the good ones, THIEF 0x1fe no LAWFUL GOOD); PickAlignment ovl0:2238 filters gAlignmentNames with it."
[[global]]
id = "ds:5EB1"
name = "gRaceAbilityBonus"
why = "Six rows of six words indexed by race >> 1 (ELF dex +1 con -1, DWARF con +1 cha -1, GNOME int +1 wis -1, HALFLING str -1 dex +1); RollCharacterStats ovl0:1BF2 adds row[i] to each rolled ability."
[[global]]
id = "ds:5EF9"
name = "gClassStartLevels"
why = "Fifteen 4-byte records per class: bytes 0..2 the starting level of each class slot for 5000 experience (FIGHTER 3, THIEF 4, FIGHTER/MAGE/THIEF 1/1/2), which RollCharacterStats ovl0:1BF2 copies to levels[]; byte 3 is ds:5EFC."
[[global]]
id = "ds:5EFC"
name = "gClassStartLevelsNumClasses"
why = "Byte 3 of each gClassStartLevels record (ds:5EF9 + 3), the number of classes (1, 2 or 3); RollCharacterStats ovl0:1BF2 gives each class slot 5000 / it experience. One object with ds:5EF9."
[[global]]
id = "ds:624C"
name = "gStrSelectClass"
why = "The string reads \"SELECT CLASS:\"; PickClass ovl0:207A draws it at (0x93, 0x43) before listing gClassNames."
[[global]]
id = "ds:625A"
name = "gStrSelectAlignment"
why = "The string reads \"SELECT ALIGNMENT:\"; PickAlignment ovl0:2238 draws it at (0x93, 0x43) before listing gAlignmentNames."
[[global]]
id = "ds:626C"
name = "gStrNamePrompt"
why = "The string reads \"Name:\"; CreateCharacter ovl0:23EC draws it at (0x95, 0x64) just before EditTextField reads the new member's name."
[[global]]
id = "ds:DD12"
name = "gUnwrittenPanelRow"
why = "CreateCharacter ovl0:23EC passes it to DrawPanelRow, but no code writes it (the bytes 12 DD occur once in the code, at that read), so it is always 0 and the call redraws the member's portrait."
[[global]]
id = "ds:5EAC"
name = "gMemberPortraits"
why = "Four bytes, initially 0xFF, the portrait index each member chose: PickPartySlot ovl0:0A5E stores the chosen cell into g5EAC[gChargenMember] and gChars[].m22, and FindSlot ovl0:0D5B skips portraits another named member already holds."
[[global]]
id = "ds:5E64"
name = "gPanelIconCells"
why = "The 17 sprite cells BuildIconTable ovl0:0000 slices from CHARGENB using gIcons2084, which DrawPanelIcon ovl0:0128 draws through DrawShape and FreeIconTable ovl0:00AF frees."
