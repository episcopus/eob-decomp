[[global]]
id = "ds:623C"
name = "gFmtValueOnExit"
why = "The string is \"%d\"; EditStatField ovl0:135D formats a non-strength field's final value with it when the field editor ends (index 1..6)."
[[global]]
id = "ds:FC8C"
name = "gPortraitCells"
why = "InitPanelScreens ovl0:2547 slices 0x2c (44) 32 by 32 cells out of CHARGENA into it; PickPartySlot ovl0:0A5E draws four of them in a row and unpacks the chosen one into gChars[].portrait (Unpack0, 0x514 bytes). FreePanelBuffers ovl0:28B0 frees 0x43 entries, so the table also covers ds:FD54 (entries 0x32..0x3b)."
[[global]]
id = "ds:DCB0"
name = "gChargenMember"
why = "The party member 0..3 the character-generation screens act on: RunCharacterPanel ovl0:28F9 sets it from the clicked box and flips bits 0/1 with the arrow keys, and CreateCharacter ovl0:23EC, ReviewRolledStats and EditStatField all index gChars[gDCB0]."
[[global]]
id = "ds:61CB"
name = "gStrSelectBoxPrompt"
why = "The string reads \"Select the box of the character you wish to create or view.\"; ShowReportLine1 ovl0:1071 draws it at (0xa8, 0x10) on the party screen."
[[global]]
id = "ds:6207"
name = "gStrEnteringGame"
why = "The string reads \"Entering game. Please wait.\"; ShowReportLine2 ovl0:10F6 draws it, and RunCharacterPanel ovl0:28F9 calls that only after the PLAY icon 0xf flashed."
[[global]]
id = "ds:5FC5"
name = "gClassMinAbilities"
why = "Fifteen rows of six words, one per class index, the minimum ability scores: row 1 (RANGER) is 13,0,14,13,14,0 and row 2 (PALADIN) 12,0,13,0,9,17; ovl0:1EA9 takes the larger of it and the race minimum into the stat minimum table ds:DD04."
[[global]]
id = "ds:5F35"
name = "gRaceMinAbilities"
why = "Six rows of six words indexed by race >> 1 (the race without its sex), the race minimum ability scores (row 3, DWARF: str 8, con 12); ovl0:1EA9 takes the larger of it and the class minimum into ds:DD04."
[[global]]
id = "ds:5F7D"
name = "gRaceMaxAbilities"
why = "Six rows of six words indexed by race >> 1, the race maximum ability scores (0x6412 is strength 18/100, elves have dex 19 and con 17); ovl0:1EA9 copies the row into the stat maximum table ds:DC98."
[[global]]
id = "ds:DD04"
name = "gStatMin"
why = "The minimum of each stat for the member being made: ovl0:1EA9 fills words 0..5 from gClassMinAbilities and gRaceMinAbilities, RollCharacterStats ovl0:1BF2 raises rolls to it and EditStatField ovl0:135D clamps to it, index 6 (hp) being ds:DD10."
[[global]]
id = "ds:DC98"
name = "gStatMax"
why = "The maximum of each stat for the member being made: ovl0:1EA9 copies gRaceMaxAbilities into words 0..5 (strength forced to 18 for classes with a nonzero ds:116E byte), and ovl0:1BF2 and ovl0:135D clamp to it, index 6 (hp) being ds:DCA4."
[[global]]
id = "ds:FD54"
name = "gBoxAnimCells"
why = "InitPanelScreens ovl0:2547 slices ten 32 by 32 cells from CHARGENB into it, and AnimateMemberBox ovl0:1224 cycles them (gFC84 0..9) into the current member's box; the ten entries are also entries 0x32..0x3b of gPortraitCells."
[[global]]
id = "ds:6272"
name = "gFileNameChargenA"
why = "The string is \"CHARGENA\"; InitPanelScreens ovl0:2547 loads that screen through LoadOverlayScreen and slices the 44 portraits from it, matching the gFileName naming of other screen names."
[[global]]
id = "ds:627B"
name = "gFileNameChargen"
why = "The string is \"CHARGEN\"; InitPanelScreens ovl0:2547 loads that screen through LoadScreenImage into gOverlayBuf as the character-generation background."
[[global]]
id = "ds:6283"
name = "gFileNameChargenB"
why = "The string is \"CHARGENB\"; InitPanelScreens ovl0:2547 loads it through LoadOverlayScreen and slices the ten box-animation cells and the 17 panel icons from it."
[[global]]
id = "ds:6197"
name = "gStrAcHpLvlLabels"
why = "The string is \"AC\\rHP\\rLVL\"; DrawCharPanel ovl0:065B draws it at (0xf8, 0x40), beside the values it formats with ds:61B3 and the level formats."
[[global]]
id = "ds:61A1"
name = "gFmtAbilityScores"
why = "The string is \"%s\\r%d\\r%d\\r%d\\r%d\\r%d\"; DrawCharPanel ovl0:065B formats strength (FormatStrengthPercent) and the five other abilities with it into one column."
[[global]]
id = "ds:61B3"
name = "gFmtAcHp"
why = "The string is \"%d\\r%d\"; DrawCharPanel ovl0:065B formats armorClass and maxHp with it, drawn at (0x118, 0x40) next to the AC and HP labels."
[[global]]
id = "ds:61B9"
name = "gFmtOneLevel"
why = "The string is \"%d\"; DrawCharPanel ovl0:065B formats the levels with it when the second and third class slots have no level (single class)."
[[global]]
id = "ds:61BC"
name = "gFmtTwoLevels"
