# Candidate Borland toolchains for the compiler pin (WHITEPAPER 2.1, docs/setup/SETUP-tc.md).
# The archives are NOT in git: the human puts them in build/toolchain/dist/, then `make tc-install`.
# Source of all four archives: WinWorld (winworldpc.com.txt inside each), placed 2026-10-31.
# Licence: proprietary (Borland, now Embarcadero); Turbo C++ 1.01 is also offered free by
# Embarcadero. Local use for comparison and matching only; never commit.
#
# zips: PKZIP archive on the disks -> directory under build/toolchain/<release>/
# files: hashes of the installed files the project depends on (filled by the first install)

# The compiler that built EOB.EXE (WHITEPAPER 2.1, `make rtl-compare`).
pinned = "tc100"
# [H] The assembler: TASM 2.0 shipped with Turbo C++ 1.0 (same TLINK.EXE, same dates); not proven
# until an assembly module is matched.
pinned_asm = "tasm20"
# The switches every C module matched so far needs (WHITEPAPER 2.1.1): large model, jump optimisation,
# register load suppression; register variables and 8086 code are the defaults.
cflags = "-ml -O -Z"

