<text x="0.0" y="406.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">Handlers 2, 3, 4 and 10 first ask IsWallDecorClicked: in mode 0x40 the click must fall in the decoration&#x27;s rectangle (entry 1 of its ten, from the wall</text>
