<text x="0.0" y="435.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">Selector 255 is never dispatched: a weapon hit on such a wall (ApplyItemAttack, 0DE8:0359) adds 1 to the wall byte of both faces instead. Selectors</text>
