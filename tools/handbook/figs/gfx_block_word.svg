<text x="484.0" y="225.3" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="middle">8 by 8 blocks, 4 bits a pixel</text>
<text x="0.0" y="254.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">offsets 0, 2, 12h, 22h. BRICK.VCN: 1,575 blocks (50,434 bytes), BLUE 1,512, DROW 1,456, GREEN 1,523, XANATHA 1,305.</text>
<text x="0.0" y="268.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">BRICK.ECN has 1,484 blocks and tables of zeros: the EGA and CGA blocks carry the screen&#x27;s own colours.</text>
