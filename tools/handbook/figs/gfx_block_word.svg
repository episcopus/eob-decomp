<text x="0.0" y="11.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="start" letter-spacing="1.6">THE BLOCK WORD, THE VCN FILE AND ONE 8 BY 8 BLOCK</text>
