<text x="0.0" y="109.0" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="700" fill="#2B2A28" text-anchor="start">n</text>
<text x="100.0" y="109.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">draw block n of the .VCN, opaque, through table B</text>
<text x="0.0" y="126.0" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="700" fill="#2B2A28" text-anchor="start">n | 4000h</text>
