<text x="418.0" y="62.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">view, two layers of 22 x 15</text>
<text x="0.0" y="92.0" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="700" fill="#2B2A28" text-anchor="start">0</text>
