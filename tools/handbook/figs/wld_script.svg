<text x="0.0" y="348.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">State the driver and handlers share: gScriptCell (the cell), gScriptTrigger (the mode; a script reads it as expression token E0), gScriptDone, a call</text>
<text x="0.0" y="361.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">stack of ten far pointers (gScriptStack) and the expression stack gEvalStack. Before it runs anything the driver reads the cell&#x27;s script offset</text>
<text x="0.0" y="374.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">(+7) and tests the mode against the cell&#x27;s mask: no offset or no matching event, no script.</text>
