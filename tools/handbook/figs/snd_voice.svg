<text x="0.0" y="421.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">Every offset is read in E_TEXT.ASM (the cites are in its comment at 0000:3B93). ClearVoice (4D95) zeroes +03 to +42 and then sets speed FFh,</text>
<text x="0.0" y="434.9" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">handlers to a bare ret and the second key-off count to 1. Voice 9 has a record but no OPL2 channel: it conducts.</text>
