<text x="0.0" y="204.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">PlaySoundDefault(0) runs once per pass of the map loop (5,954 times in</text>
<text x="0.0" y="217.9" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">the load-walk session). Sound 0 maps to driver sound 0, which is never</text>
<text x="0.0" y="231.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">played by this path, so it flushes the sound recorded before it.</text>
<text x="392.0" y="36.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#6E695F" text-anchor="start">One play when the recorded att is below 10h (else nothing at all)</text>
