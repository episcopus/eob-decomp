<text x="670.2" y="413.5" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#7A5412" text-anchor="middle">portraits</text>
<text x="670.2" y="427.1" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">re-cut from CHARGENA or</text>
<text x="670.2" y="439.8" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">OUTTAKE sheets; then LoadLevel</text>
