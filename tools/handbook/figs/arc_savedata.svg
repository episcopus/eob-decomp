<rect x="387.0" y="26.0" width="179.5" height="82.0" rx="6" fill="#FFFDF8" stroke="#3B4A8A" stroke-width="1.2"/>
<text x="476.8" y="51.5" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#2C386B" text-anchor="middle">write a slot</text>
<text x="476.8" y="65.1" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">LEVELS.TMP at (level - 1) x 2,040,</text>
<text x="476.8" y="77.8" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">2,040 bytes; set bit level - 1 of</text>
<text x="476.8" y="90.6" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">gSavedLevels</text>
