<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" class="fig"><defs><marker id="a8A8373" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8A8373"/></marker></defs>
<text x="0.0" y="18.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#2C386B" text-anchor="start">Leaving a level (a stairs or teleport script: LoadLevelOp, 122E:1AAB)</text>
<rect x="0.0" y="26.0" width="179.5" height="82.0" rx="6" fill="#FFFDF8" stroke="#3B4A8A" stroke-width="1.2"/>
<text x="89.8" y="57.8" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#2C386B" text-anchor="middle">ResetLevel</text>
<text x="89.8" y="71.4" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">finish a moving door, clear</text>
<text x="89.8" y="84.2" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">projectiles and attack frames</text>
<path d="M180.5,67.0 L192.5,67.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<rect x="193.5" y="26.0" width="179.5" height="82.0" rx="6" fill="#FFFDF8" stroke="#3B4A8A" stroke-width="1.2"/>
<text x="283.2" y="45.1" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#2C386B" text-anchor="middle">SaveLevelState</text>
<text x="283.2" y="58.7" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">pack: copy the 4 wall bytes of the</text>
<text x="283.2" y="71.4" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">1,024 cells, LCW-compress to a</text>
<text x="283.2" y="84.2" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">stream of at most 1,200 bytes,</text>
<text x="283.2" y="96.9" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">append the 30 monsters</text>
