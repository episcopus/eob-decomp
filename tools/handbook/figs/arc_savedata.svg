<rect x="193.5" y="398.0" width="179.5" height="62.0" rx="6" fill="#FFFDF8" stroke="#A8741A" stroke-width="1.2"/>
<text x="283.2" y="413.5" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#7A5412" text-anchor="middle">restore</text>
<text x="283.2" y="427.1" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">characters (keeping their portrait</text>
