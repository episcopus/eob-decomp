<rect x="193.5" y="272.0" width="179.5" height="92.0" rx="6" fill="#FFFDF8" stroke="#7A3E6B" stroke-width="1.2"/>
<text x="283.2" y="302.5" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#5C2D50" text-anchor="middle">merge</text>
<text x="283.2" y="316.1" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">read all of LEVELS.TMP (24,480)</text>
<text x="283.2" y="328.8" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">into gArtPage, pack the current</text>
<text x="283.2" y="341.6" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">level over its own slot there</text>
<path d="M374.0,318.0 L386.0,318.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<rect x="387.0" y="272.0" width="179.5" height="92.0" rx="6" fill="#FFFDF8" stroke="#7A3E6B" stroke-width="1.2"/>
<text x="476.8" y="296.1" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#5C2D50" text-anchor="middle">write</text>
<text x="476.8" y="309.7" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">recreate EOBDATA.SAV:</text>
<text x="476.8" y="322.4" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">characters (timers aged), 64-byte</text>
<text x="476.8" y="335.2" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">header, items, the level image, 3</text>
<text x="476.8" y="347.9" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">option bytes, 96 bytes</text>
<path d="M567.5,318.0 L579.5,318.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<rect x="580.5" y="272.0" width="179.5" height="92.0" rx="6" fill="#FFFDF8" stroke="#7A3E6B" stroke-width="1.2"/>
<text x="670.2" y="296.1" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#5C2D50" text-anchor="middle">check</text>
<text x="670.2" y="309.7" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">each write must return its full</text>
<text x="670.2" y="322.4" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">length; the result picks the</text>
<text x="670.2" y="335.2" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">message &quot;Game saved.&quot; or &quot;Save</text>
<text x="670.2" y="347.9" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">game failure!&quot;</text>
<text x="0.0" y="390.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#7A5412" text-anchor="start">Load game (LoadGame, ovl3:15B9; from the title menu or the camp menu)</text>
