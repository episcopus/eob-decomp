<text x="89.8" y="439.8" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">back to back into gArtPage; any</text>
<text x="89.8" y="452.6" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">short read = failure</text>
