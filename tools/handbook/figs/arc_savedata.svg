<text x="670.2" y="176.5" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="middle">items</text>
<text x="670.2" y="190.1" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">RebuildItemList: every item whose</text>
<text x="670.2" y="202.8" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">level byte is this level goes into its</text>
<text x="670.2" y="215.6" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">cell&#x27;s list</text>
<text x="0.0" y="264.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#5C2D50" text-anchor="start">Save game (SaveGame, ovl3:1368; the camp menu asks first)</text>
