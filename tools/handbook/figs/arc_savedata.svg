<text x="670.2" y="77.8" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">next section</text>
<text x="0.0" y="138.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#14504A" text-anchor="start">Entering a level (LoadLevel, ovl3:0A7C)</text>
<rect x="0.0" y="146.0" width="179.5" height="92.0" rx="6" fill="#FFFDF8" stroke="#1F6F66" stroke-width="1.2"/>
<text x="89.8" y="176.5" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="middle">INF and maze</text>
<text x="89.8" y="190.1" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">LEVELn.INF is unpacked: wall sets,</text>
<text x="89.8" y="202.8" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">timers, monster list. LEVELn.MAZ</text>
<text x="89.8" y="215.6" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">gives the pristine wall bytes</text>
<path d="M180.5,192.0 L192.5,192.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<rect x="193.5" y="146.0" width="179.5" height="92.0" rx="6" fill="#FFFDF8" stroke="#1F6F66" stroke-width="1.2"/>
<text x="283.2" y="170.1" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="middle">visited?</text>
<text x="283.2" y="183.7" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">bit level - 1 of gSavedLevels: the</text>
<text x="283.2" y="196.4" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">slot is read from LEVELS.TMP,</text>
<text x="283.2" y="209.2" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">unpacked over the walls, monsters</text>
<text x="283.2" y="221.9" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">copied back</text>
<path d="M374.0,192.0 L386.0,192.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<rect x="387.0" y="146.0" width="179.5" height="92.0" rx="6" fill="#FFFDF8" stroke="#1F6F66" stroke-width="1.2"/>
<text x="476.8" y="176.5" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="middle">first visit</text>
<text x="476.8" y="190.1" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">monsters are created from the</text>
<text x="476.8" y="202.8" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">INF list (InitMonster) and the walls</text>
<text x="476.8" y="215.6" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">stay as in the MAZ file</text>
<path d="M567.5,192.0 L579.5,192.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
