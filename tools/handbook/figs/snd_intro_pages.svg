<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316" width="760" height="316" class="fig"><defs><marker id="a8A8373" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8A8373"/></marker></defs>
<text x="0.0" y="11.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="start" letter-spacing="1.6">HOW A SCENE GETS A PICTURE TO THE SCREEN (VGA)</text>
<rect x="0.0" y="34.0" width="106.0" height="88.0" rx="6" fill="#ECE7DD" stroke="#8A8373" stroke-width="1.2"/>
<text x="53.0" y="61.4" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#3C3A36" text-anchor="middle">PAK file</text>
<text x="53.0" y="76.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="middle">one .CMP, LCW,</text>
<text x="53.0" y="89.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="middle">64,000 bytes</text>
<text x="53.0" y="103.3" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="middle">unpacked</text>
<rect x="130.0" y="34.0" width="106.0" height="88.0" rx="6" fill="#ECE7DD" stroke="#8A8373" stroke-width="1.2"/>
<text x="183.0" y="61.4" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#3C3A36" text-anchor="middle">slot 5</text>
<text x="183.0" y="76.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="middle">LoadPackedImage</text>
<text x="183.0" y="89.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="middle">reads the packed</text>
<text x="183.0" y="103.3" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="middle">bytes here</text>
<path d="M107.0,78.0 L129.0,78.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<rect x="260.0" y="34.0" width="106.0" height="88.0" rx="6" fill="#DCEBE7" stroke="#1F6F66" stroke-width="1.2"/>
<text x="313.0" y="61.4" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#14504A" text-anchor="middle">slot 3</text>
<text x="313.0" y="76.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="middle">Unpack4 writes</text>
<text x="313.0" y="89.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="middle">the 320 by 200</text>
<text x="313.0" y="103.3" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="middle">picture here</text>
<path d="M237.0,78.0 L259.0,78.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<rect x="390.0" y="34.0" width="106.0" height="88.0" rx="6" fill="#F4E8CC" stroke="#A8741A" stroke-width="1.2"/>
<text x="443.0" y="54.6" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#7A5412" text-anchor="middle">heap</text>
<text x="443.0" y="69.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="middle">gMakeImage cuts</text>
<text x="443.0" y="82.8" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="middle">rectangles into</text>
<text x="443.0" y="96.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="middle">shapes (runs of 0</text>
<text x="443.0" y="110.1" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="middle">are transparent)</text>
<path d="M367.0,78.0 L389.0,78.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<rect x="520.0" y="34.0" width="106.0" height="88.0" rx="6" fill="#EFE0EB" stroke="#7A3E6B" stroke-width="1.2"/>
<text x="573.0" y="61.4" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#5C2D50" text-anchor="middle">page 2 or 4</text>
<text x="573.0" y="76.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="middle">DrawShape draws</text>
<text x="573.0" y="89.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="middle">a shape, clipped to</text>
<text x="573.0" y="103.3" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="middle">the region</text>
<path d="M497.0,78.0 L519.0,78.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<rect x="650.0" y="34.0" width="106.0" height="88.0" rx="6" fill="#E1E5F2" stroke="#3B4A8A" stroke-width="1.2"/>
<text x="703.0" y="61.4" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#2C386B" text-anchor="middle">page 0</text>
<text x="703.0" y="76.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="middle">ClipRect copies a</text>
<text x="703.0" y="89.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="middle">rectangle: the</text>
<text x="703.0" y="103.3" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="middle">screen</text>
<path d="M627.0,78.0 L649.0,78.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<text x="0.0" y="146.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">Two other routes: CopyPage copies a whole page, and Dissolve moves pixels one at a time with GetPixel and PutPixel.</text>
<text x="0.0" y="182.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="start" letter-spacing="1.6">GPAGESEGS AFTER STARTUPGAME, GRAPHICS CHOICE 3 (I0892.C:337-342)</text>
<rect x="0.0" y="196.0" width="178.0" height="54.0" rx="6" fill="#E1E5F2" stroke="#3B4A8A" stroke-width="1.2"/>
<text x="89.0" y="220.1" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#2C386B" text-anchor="middle">pages 0, 1</text>
<text x="89.0" y="234.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="middle">the screen, A000:0000</text>
<rect x="193.0" y="196.0" width="178.0" height="54.0" rx="6" fill="#DCEBE7" stroke="#1F6F66" stroke-width="1.2"/>
<text x="282.0" y="213.2" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#14504A" text-anchor="middle">pages 2, 3</text>
<text x="282.0" y="227.8" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="middle">buffer A, MemAlloc 64,000</text>
<text x="282.0" y="241.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="middle">bytes</text>
<rect x="386.0" y="196.0" width="178.0" height="54.0" rx="6" fill="#EFE0EB" stroke="#7A3E6B" stroke-width="1.2"/>
<text x="475.0" y="220.1" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#5C2D50" text-anchor="middle">pages 4, 5</text>
<text x="475.0" y="234.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="middle">buffer B, 64,000 bytes</text>
<rect x="579.0" y="196.0" width="178.0" height="54.0" rx="6" fill="#ECE7DD" stroke="#8A8373" stroke-width="1.2"/>
<text x="668.0" y="220.1" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#3C3A36" text-anchor="middle">pages 6, 7</text>
<text x="668.0" y="234.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="middle">buffer C, 64,512 bytes</text>
<text x="0.0" y="272.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">Each pair of slots holds one segment on VGA: the even slot is the page a draw goes to, the odd slot the memory copy that LoadPackedImage</text>
<text x="0.0" y="285.9" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">and gMakeImage use (E19EC.C). A scene copies its picture to page 4 with CopyPage(3, 4) and then reveals it in pieces with ClipRect(..., 4, 0),</text>
<text x="0.0" y="299.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">rectangle by rectangle, one step per wait.</text>
</svg>