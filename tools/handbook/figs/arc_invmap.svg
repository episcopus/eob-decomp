<text x="364.4" y="16.0" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#2B2A28" text-anchor="start">Inventory screen, node list 2b</text>
<rect x="364.4" y="28.0" width="12.0" height="10.0" rx="1" fill="#A9D0C8" stroke="#1F6F66" stroke-width="1"/>
<text x="382.4" y="37.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.8" font-weight="700" fill="#2B2A28" text-anchor="start">slots 0, 1</text>
<text x="382.4" y="50.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">the two hands: item mask 08h; the same items the map screen&#x27;s hand</text>
<text x="382.4" y="61.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">boxes show</text>
<rect x="364.4" y="75.0" width="12.0" height="10.0" rx="1" fill="#B9C2E0" stroke="#3B4A8A" stroke-width="1"/>
<text x="382.4" y="84.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.8" font-weight="700" fill="#2B2A28" text-anchor="start">slots 2 to 15</text>
<text x="382.4" y="97.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">the pack: any item (mask FFFFh); 2 columns of 7 on an 18-pixel grid</text>
<rect x="364.4" y="110.5" width="12.0" height="10.0" rx="1" fill="#D5B8CC" stroke="#7A3E6B" stroke-width="1"/>
<text x="382.4" y="119.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.8" font-weight="700" fill="#2B2A28" text-anchor="start">slots 16 to 22</text>
<text x="382.4" y="132.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">one box per item class, by gSlotItemMask: 01h, 02h, 04h, 20h, 40h, 10h,</text>
<text x="382.4" y="144.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">and slot 22 takes anything; slot 16 is also a list head</text>
<rect x="364.4" y="157.5" width="12.0" height="10.0" rx="1" fill="#E3C98F" stroke="#A8741A" stroke-width="1"/>
<text x="382.4" y="166.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.8" font-weight="700" fill="#2B2A28" text-anchor="start">slots 23, 24</text>
<text x="382.4" y="179.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">mask 80h: two boxes for one class [H: the rings]</text>
<rect x="364.4" y="193.0" width="12.0" height="10.0" rx="1" fill="#D9D2C3" stroke="#8A8373" stroke-width="1"/>
<text x="382.4" y="202.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.8" font-weight="700" fill="#2B2A28" text-anchor="start">slots 25, 26</text>
<text x="382.4" y="215.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">mask 100h, drawn 10 x 10 (gInvSlotKind 2) [H: ammunition]</text>
<rect x="364.4" y="228.5" width="12.0" height="10.0" rx="1" fill="#E3C98F" stroke="#A8741A" stroke-width="1"/>
<text x="382.4" y="237.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.8" font-weight="700" fill="#2B2A28" text-anchor="start">food box</text>
<text x="382.4" y="250.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">FeedInventoryMember: eat the item on the pointer</text>
<rect x="364.4" y="264.0" width="12.0" height="10.0" rx="1" fill="#E3B2A5" stroke="#A8452F" stroke-width="1"/>
<text x="382.4" y="273.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.8" font-weight="700" fill="#2B2A28" text-anchor="start">face</text>
<text x="382.4" y="286.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">RestorePortraitPanel: back to the map; Esc or I</text>
<rect x="364.4" y="299.5" width="12.0" height="10.0" rx="1" fill="#D9D2C3" stroke="#8A8373" stroke-width="1"/>
<text x="382.4" y="308.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.8" font-weight="700" fill="#2B2A28" text-anchor="start">prev, next</text>
<text x="382.4" y="321.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">click: the previous or next member; F1 to F6 jump to members 1 to 6</text>
<text x="382.4" y="333.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">through the same callbacks (F5, F6 have no box)</text>
<rect x="364.4" y="346.5" width="12.0" height="10.0" rx="1" fill="#E3B2A5" stroke="#A8452F" stroke-width="1"/>
<text x="382.4" y="355.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.8" font-weight="700" fill="#2B2A28" text-anchor="start">P</text>
<text x="382.4" y="368.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">ToggleCharacterInfo: switch to the character sheet (node list 3) and</text>
<text x="382.4" y="380.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">back</text>
<text x="364.4" y="407.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#6E695F" text-anchor="start">The rest of list 2b is the map screen&#x27;s: view click, floor,</text>
<text x="364.4" y="419.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#6E695F" text-anchor="start">camp, movement and throw nodes stay active.</text>
