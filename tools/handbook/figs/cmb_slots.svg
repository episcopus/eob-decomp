<text x="0.0" y="306.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#6E695F" text-anchor="start">tick counts in gGameTicks;</text>
<text x="0.0" y="319.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#6E695F" text-anchor="start">saved games store them relative</text>
<text x="0.0" y="332.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#6E695F" text-anchor="start">(AgeCharTimers, ovl3:123D)</text>
<rect x="196.0" y="24.0" width="290.0" height="185.2" rx="6" fill="#DCEBE7" stroke="#1F6F66" stroke-width="1.2"/>
<text x="205.0" y="45.4" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#14504A" text-anchor="start">Arm: ApplyCharEffect  1414:05ED</text>
<text x="205.0" y="60.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">(who, interval, type, firstEmpty = 1)</text>
<text x="205.0" y="73.6" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">time = gGameTicks + interval; the member&#x27;s effect</text>
<text x="205.0" y="87.3" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">(6 + who)</text>
<text x="205.0" y="100.9" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">not armed: period = interval, slot 0 = (type, time),</text>
<text x="205.0" y="114.6" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">arm it</text>
<text x="205.0" y="128.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">armed: pull its expiry back to time if that is earlier;</text>
<text x="205.0" y="141.9" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">reuse the slot that already has this type, else the</text>
<text x="205.0" y="155.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">first empty slot</text>
<text x="205.0" y="169.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">all ten full and no such type: slot = -1, the stores</text>
<text x="205.0" y="182.8" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">land in the bytes before the arrays (QUIRK</text>
<text x="205.0" y="196.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">1414:0755)</text>
<rect x="196.0" y="221.2" width="290.0" height="116.9" rx="6" fill="#EFE0EB" stroke="#7A3E6B" stroke-width="1.2"/>
<text x="205.0" y="242.6" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#5C2D50" text-anchor="start">Tick: RunCharEffects  1414:07CA</text>
<text x="205.0" y="257.1" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">RunEffects calls it for effect 6 + who</text>
<text x="205.0" y="270.8" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">for every slot with time &lt;= gGameTicks: clear it,</text>
<text x="205.0" y="284.4" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">then by type (right)</text>
<text x="205.0" y="298.1" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">afterwards: period = the smallest remaining time -</text>
<text x="205.0" y="311.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">gGameTicks; with none left, period = -1 and the</text>
<text x="205.0" y="325.4" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">entry is disarmed</text>
<rect x="196.0" y="350.1" width="290.0" height="76.0" rx="6" fill="#F4E8CC" stroke="#A8741A" stroke-width="1.2"/>
<text x="205.0" y="371.4" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#7A5412" text-anchor="start">Re-arm after a load or a drop</text>
<text x="205.0" y="386.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">RearmCharEffects 1414:0B2E recomputes the</text>
<text x="205.0" y="399.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">same period for every present member;</text>
<text x="205.0" y="413.3" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">ClearCharEffectSlot clears all slots of one type</text>
