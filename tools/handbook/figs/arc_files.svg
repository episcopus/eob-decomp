<text x="220.0" y="188.9" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="middle">eobdata3.pak on the</text>
<text x="220.0" y="202.3" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="middle">current drive; if absent:</text>
<text x="220.0" y="215.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="middle">the dialog &quot;Insert disk 3</text>
<text x="220.0" y="229.1" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="middle">into any drive&quot;</text>
