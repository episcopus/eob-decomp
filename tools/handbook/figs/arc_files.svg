<text x="520.0" y="168.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#2C386B" text-anchor="middle">a handle slot</text>
<text x="520.0" y="182.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="middle">first free of 10 slots in</text>
<text x="520.0" y="195.6" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="middle">gFileHandles: DOS handle</text>
<text x="520.0" y="209.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="middle">| 4000h; slot offset and</text>
<text x="520.0" y="222.4" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="middle">length are kept</text>
<circle cx="462.0" cy="142.0" r="8.0" fill="#3B4A8A" stroke="none" stroke-width="1"/>
<text x="462.0" y="145.6" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<path d="M591.0,191.0 L599.0,191.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<rect x="600.0" y="130.0" width="140.0" height="122.0" rx="6" fill="#FFFDF8" stroke="#3B4A8A" stroke-width="1.2"/>
<text x="670.0" y="168.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#2C386B" text-anchor="middle">FileRead</text>
<text x="670.0" y="182.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="middle">reads at most what is</text>
<text x="670.0" y="195.6" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="middle">left of the member (the</text>
<text x="670.0" y="209.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="middle">length clamp), in chunks</text>
<text x="670.0" y="222.4" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="middle">of 0FA00h bytes</text>
<circle cx="612.0" cy="142.0" r="8.0" fill="#3B4A8A" stroke="none" stroke-width="1"/>
<text x="612.0" y="145.6" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="0.0" y="280.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="start" letter-spacing="1.6">C. WHAT THE 203 RECORDS ARE</text>
<rect x="0.0" y="292.0" width="760.0" height="34.0" rx="5" fill="#DCEBE7" stroke="#1F6F66" stroke-width="1"/>
<text x="10.0" y="313.0" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#14504A" text-anchor="start">10 plain files</text>
<text x="150.0" y="307.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.6" font-weight="400" fill="#3C3A36" text-anchor="start">INTRO.EXE and eobdata1.pak (disk 1), EOB.EXE, LEVELS.TMP, eobdata2.pak (disk 2), eobdata3.pak, 4, 5 (disks 3 to 5),</text>
<text x="150.0" y="319.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.6" font-weight="400" fill="#3C3A36" text-anchor="start">EOBDATA.SAV and eobdata6.pak (disk 6)</text>
<rect x="0.0" y="332.0" width="760.0" height="34.0" rx="5" fill="#E1E5F2" stroke="#3B4A8A" stroke-width="1"/>
<text x="10.0" y="353.0" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#2C386B" text-anchor="start">193 aliases</text>
<text x="150.0" y="347.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.6" font-weight="400" fill="#3C3A36" text-anchor="start">one per PAK member: 17 in eobdata1, 2 in eobdata2, 174 in eobdata3 to 6; sizes are the members&#x27; unpacked file sizes</text>
<rect x="0.0" y="372.0" width="760.0" height="34.0" rx="5" fill="#ECE7DD" stroke="#8A8373" stroke-width="1"/>
<text x="10.0" y="393.0" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#3C3A36" text-anchor="start">0 preloaded</text>
<text x="150.0" y="387.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.6" font-weight="400" fill="#3C3A36" text-anchor="start">no flags byte has FLAG_KEEP or FLAG_LOAD, so BuildFileCache loads nothing and no record ever has a copy in memory</text>
<text x="0.0" y="422.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">The disk numbers look like the floppy release&#x27;s: a file found on no drive makes the game ask for its disk by number.</text>
</svg>