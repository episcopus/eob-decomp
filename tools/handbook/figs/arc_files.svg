<rect x="701.1" y="22.0" width="36.9" height="34.0" rx="3" fill="#E3B2A5" stroke="#A8452F" stroke-width="1.1"/>
<text x="719.5" y="38.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#80311F" text-anchor="middle">fl</text>
<text x="719.5" y="51.0" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">+12</text>
<text x="0.0" y="72.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.8" font-weight="400" fill="#3C3A36" text-anchor="start">link &lt; 0: the record is a member of another record&#x27;s PAK (low 15 bits = that record); link &gt;= 0: a plain file, on disk number link + 1.</text>
<text x="0.0" y="87.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.8" font-weight="400" fill="#3C3A36" text-anchor="start">data is set only while a copy of the file is held in memory; flags would mark files to preload or load on demand. Every flags byte is 0 here.</text>
<text x="0.0" y="118.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="start" letter-spacing="1.6">B. FILEOPEN(&quot;BRICK.VCN&quot;, 1): FROM A NAME TO A STRETCH OF A PAK</text>
