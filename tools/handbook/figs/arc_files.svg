<text x="0.0" y="11.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="start" letter-spacing="1.6">A. ONE RECORD OF THE FILE TABLE (DS:01FF), 19 BYTES</text>
