<rect x="502.0" y="42.0" width="12.0" height="10.0" rx="2" fill="#ECE7DD" stroke="#8A8373" stroke-width="1"/>
<text x="518.0" y="50.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">3 ahead</text>
<rect x="571.4" y="42.0" width="12.0" height="10.0" rx="2" fill="#DCEBE7" stroke="#1F6F66" stroke-width="1"/>
<text x="587.4" y="50.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">2 ahead</text>
<rect x="502.0" y="58.0" width="12.0" height="10.0" rx="2" fill="#F4E8CC" stroke="#A8741A" stroke-width="1"/>
<text x="518.0" y="66.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">1 ahead</text>
<rect x="571.4" y="58.0" width="12.0" height="10.0" rx="2" fill="#EFE0EB" stroke="#7A3E6B" stroke-width="1"/>
<text x="587.4" y="66.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">own row</text>
<text x="502.0" y="86.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">solid frame: front wall (F) of a slot</text>
<text x="502.0" y="100.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">dashed frame: side wall (S) of a slot</text>
<text x="502.0" y="120.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">Pieces are copied in the order of the rows</text>
<text x="502.0" y="133.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">above, far to near, sides before fronts in each</text>
<text x="502.0" y="146.4" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">row. A later copy overwrites an earlier one;</text>
<text x="502.0" y="159.6" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">zero words are skipped, so a hole in a nearer</text>
<text x="502.0" y="172.8" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">piece shows what lies behind it.</text>
<text x="502.0" y="191.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">Left-hand sides are copied; right-hand sides</text>
<text x="502.0" y="204.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">are mirrored copies (columns reversed, bit</text>
<text x="502.0" y="217.4" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">4000h toggled) at the mirror position. Front</text>
<text x="502.0" y="230.6" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">walls are copied only.</text>
<text x="502.0" y="248.8" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">Pieces past the edge are clipped by column.</text>
<text x="502.0" y="262.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">Slots 0 and 6 have no front piece, and neither</text>
<text x="502.0" y="275.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">has the party&#x27;s row: the wall straight ahead is</text>
<text x="502.0" y="288.4" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">F13, 128 by 96 pixels.</text>
</svg>