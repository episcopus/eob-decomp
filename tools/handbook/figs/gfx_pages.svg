<text x="0.0" y="362.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">GetPageBuffer(k) is the far pointer to offset 0 of gPageSegs[k | 1]; the drivers turn a page number n into gPageSegs[n and 1Fh].</text>
<text x="0.0" y="378.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">In the CGA, Tandy and VGA tables the two slots of a pair name the same segment, so copying page 3 to page 2 is skipped (CopyPage tests that the</text>
<text x="0.0" y="392.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">segments differ). EGA is the only mode where page 2 (A200, planar video RAM) and the buffer in slot 3 are different memory.</text>
