<text x="271.0" y="45.4" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#14504A" text-anchor="start">1: ApplyItemAttack  0DE8:0359</text>
<text x="271.0" y="60.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">who above 1 (back rank)?  result -3, CAN&#x27;T</text>
<text x="271.0" y="73.6" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">REACH</text>
<text x="271.0" y="87.3" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">cell ahead = StepCell(party cell, facing)</text>
<text x="271.0" y="100.9" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">FindMeleeTarget (see the cell figure)</text>
<text x="271.0" y="114.6" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">no target: a hackable wall gets its wall</text>
<text x="271.0" y="128.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">byte raised, -2 HACK; else -1</text>
<text x="271.0" y="141.9" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">RollToHit (0DE8:0007); a miss is -1, MISS</text>
<text x="271.0" y="155.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">spell-made weapon and</text>
<text x="271.0" y="169.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">MonsterResistsMagic: -1</text>
<text x="271.0" y="182.8" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">RollAttackDamage (0DE8:011A); half when</text>
<text x="271.0" y="196.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">IsWeaponDamageHalved</text>
<text x="271.0" y="210.1" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">result = damage</text>
<rect x="262.0" y="236.8" width="250.0" height="130.6" rx="6" fill="#DCEBE7" stroke="#1F6F66" stroke-width="1.2"/>
<text x="271.0" y="258.2" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#14504A" text-anchor="start">2, 3: thrown, shot  0DE8:0537, 05BB</text>
<text x="271.0" y="272.8" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">thrown: the weapon itself leaves the hand</text>
<text x="271.0" y="286.4" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">launcher: first arrow (quiver, slot 16) or</text>
<text x="271.0" y="300.1" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">rock found</text>
<text x="271.0" y="313.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">none found: result -4, NO AMMO</text>
