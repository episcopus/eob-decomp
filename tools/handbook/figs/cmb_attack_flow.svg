<text x="9.0" y="141.3" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#2C386B" text-anchor="start">UseItemSlot</text>
<text x="9.0" y="156.4" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">0BD2:1001. Needs MemberIs(who,</text>
<text x="9.0" y="170.7" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">13): present, hp above 0, not</text>
<text x="9.0" y="185.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">paralysed. The hand must not be busy;</text>
<text x="9.0" y="199.3" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">the class must be allowed to use the</text>
<text x="9.0" y="213.6" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">item.</text>
