<text x="9.0" y="280.9" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">1  melee weapon</text>
<text x="9.0" y="295.2" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">2  thrown weapon (dagger, spear,</text>
<text x="9.0" y="309.5" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">dart, rock)</text>
<text x="9.0" y="323.8" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">3  launcher (bow, sling)</text>
<text x="9.0" y="338.1" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">5, 6  spell book, holy symbol</text>
<text x="9.0" y="352.4" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">9, 10  scroll;  18  wand;  14  potion;  7</text>
<text x="9.0" y="366.7" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">food</text>
