<text x="271.0" y="341.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">10 projectile records and onto the cell&#x27;s</text>
<text x="271.0" y="354.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">item list; result 0</text>
