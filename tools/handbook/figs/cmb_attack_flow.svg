<text x="9.0" y="45.4" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#2C386B" text-anchor="start">ClickHandSlot</text>
<text x="9.0" y="60.5" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">0ACD:0415: one mouse button swaps</text>
<text x="9.0" y="74.8" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">the item with the one on the pointer,</text>
<text x="9.0" y="89.1" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">the other uses it.</text>
