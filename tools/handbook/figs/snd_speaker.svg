<text x="518.0" y="136.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="600" fill="#3C3A36" text-anchor="start">voice 1</text>
<text x="518.0" y="150.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">volume 10</text>
<rect x="580.0" y="124.0" width="180.0" height="50.0" rx="3" fill="#FFFFFF" stroke="#D9D2C3" stroke-width="1"/>
<line x1="615.0" y1="128.0" x2="615.0" y2="170.0" stroke="#7A3E6B" stroke-width="1" stroke-dasharray="3 2"/>
<rect x="619.0" y="142.0" width="12.0" height="20.0" rx="2" fill="#D5B8CC" stroke="#7A3E6B" stroke-width="1"/>
<rect x="633.0" y="136.0" width="12.0" height="20.0" rx="2" fill="#D5B8CC" stroke="#7A3E6B" stroke-width="1"/>
<rect x="647.0" y="130.0" width="12.0" height="20.0" rx="2" fill="#D5B8CC" stroke="#7A3E6B" stroke-width="1"/>
<rect x="730.0" y="147.0" width="12.0" height="23.0" rx="1" fill="#7A3E6B" stroke="#7A3E6B" stroke-width="0.8"/>
<text x="518.0" y="202.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="600" fill="#3C3A36" text-anchor="start">voice 2</text>
<text x="518.0" y="216.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">volume 5</text>
<rect x="580.0" y="190.0" width="180.0" height="50.0" rx="3" fill="#FFFFFF" stroke="#D9D2C3" stroke-width="1"/>
<line x1="650.0" y1="194.0" x2="650.0" y2="236.0" stroke="#7A3E6B" stroke-width="1" stroke-dasharray="3 2"/>
<rect x="654.0" y="208.0" width="12.0" height="20.0" rx="2" fill="#D5B8CC" stroke="#7A3E6B" stroke-width="1"/>
<rect x="668.0" y="202.0" width="12.0" height="20.0" rx="2" fill="#D5B8CC" stroke="#7A3E6B" stroke-width="1"/>
<rect x="682.0" y="196.0" width="12.0" height="20.0" rx="2" fill="#D5B8CC" stroke="#7A3E6B" stroke-width="1"/>
<rect x="730.0" y="222.5" width="12.0" height="13.5" rx="1" fill="#7A3E6B" stroke="#7A3E6B" stroke-width="0.8"/>
<text x="580.0" y="252.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">starts: pass 0, 35, 70</text>
<text x="518.0" y="276.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">All three voices read the same stream from</text>
<text x="518.0" y="289.9" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">byte 0: the song has no voice parts. StartSound</text>
<text x="518.0" y="303.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">sets position 0 for voices 0 to 2, and holds</text>
<text x="518.0" y="317.6" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">voices 1 and 2 back with the counters 23h and</text>
<text x="518.0" y="331.4" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">46h. The volumes are the data image&#x27;s: 15, 10, 5</text>
<text x="518.0" y="345.3" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">(voice 3, 0, is never played). The result is an</text>
<text x="518.0" y="359.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">echo, quieter each time [I]. On the PC speaker</text>
<text x="518.0" y="373.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">gVoiceCount is 1, so only voice 0 sounds.</text>
</svg>