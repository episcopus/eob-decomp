<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" class="fig">
<text x="0.0" y="11.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#7A5412" text-anchor="start" letter-spacing="1.6">THE SPEAKER AND TANDY DRIVER: A SONG STREAM, THE NOTE TABLE AND THE TANDY ECHO</text>
<text x="0.0" y="36.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#7A5412" text-anchor="start">A song: sound 1 of pcgamesn.dat</text>
<rect x="0.0" y="46.0" width="26.0" height="24.0" rx="3" fill="#E1E5F2" stroke="#3B4A8A" stroke-width="1"/>
<text x="13.0" y="62.0" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#2C386B" text-anchor="middle">E2</text>
<rect x="28.0" y="46.0" width="26.0" height="24.0" rx="3" fill="#E1E5F2" stroke="#3B4A8A" stroke-width="1"/>
<text x="41.0" y="62.0" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#2C386B" text-anchor="middle">01</text>
<rect x="56.0" y="46.0" width="26.0" height="24.0" rx="3" fill="#DCEBE7" stroke="#1F6F66" stroke-width="1"/>
<text x="69.0" y="62.0" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#14504A" text-anchor="middle">20</text>
<rect x="84.0" y="46.0" width="26.0" height="24.0" rx="3" fill="#ECE7DD" stroke="#8A8373" stroke-width="1"/>
<text x="97.0" y="62.0" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#3C3A36" text-anchor="middle">00</text>
<rect x="112.0" y="46.0" width="26.0" height="24.0" rx="3" fill="#DCEBE7" stroke="#1F6F66" stroke-width="1"/>
<text x="125.0" y="62.0" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#14504A" text-anchor="middle">2C</text>
<rect x="140.0" y="46.0" width="26.0" height="24.0" rx="3" fill="#ECE7DD" stroke="#8A8373" stroke-width="1"/>
<text x="153.0" y="62.0" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#3C3A36" text-anchor="middle">00</text>
<rect x="168.0" y="46.0" width="26.0" height="24.0" rx="3" fill="#DCEBE7" stroke="#1F6F66" stroke-width="1"/>
<text x="181.0" y="62.0" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#14504A" text-anchor="middle">38</text>
<rect x="196.0" y="46.0" width="26.0" height="24.0" rx="3" fill="#ECE7DD" stroke="#8A8373" stroke-width="1"/>
<text x="209.0" y="62.0" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#3C3A36" text-anchor="middle">00</text>
<rect x="224.0" y="46.0" width="26.0" height="24.0" rx="3" fill="#F5E0D9" stroke="#A8452F" stroke-width="1"/>
<text x="237.0" y="62.0" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#80311F" text-anchor="middle">FF</text>
<text x="0.0" y="92.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">E2 01: length multiplier 1. Then three (note,</text>
<text x="0.0" y="105.9" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">duration) pairs: note byte 20h, 2Ch, 38h are</text>
<text x="0.0" y="119.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">notes 32, 44 and 56 of the table (110, 220 and</text>
<text x="0.0" y="133.6" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">440 Hz), each with duration byte 0. A duration</text>
<text x="0.0" y="147.4" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">byte d lasts (d + 1) x multiplier - 1 passes, and a</text>
<text x="0.0" y="161.3" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">stored 0 still sounds for 2 passes (7 ms): a rising</text>
<text x="0.0" y="175.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">blip of about 21 ms. FFh ends the voice.</text>
<text x="0.0" y="218.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#7A5412" text-anchor="start">Bytes in a stream</text>
<text x="0.0" y="236.0" font-family="'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#2B2A28" text-anchor="start">00</text>
<text x="78.0" y="236.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">rest</text>
<text x="0.0" y="251.0" font-family="'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#2B2A28" text-anchor="start">01-5F</text>
<text x="78.0" y="251.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">note index</text>
<text x="0.0" y="266.0" font-family="'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#2B2A28" text-anchor="start">60-7F</text>
<text x="78.0" y="266.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">voice stays silent for good</text>
<text x="0.0" y="281.0" font-family="'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#2B2A28" text-anchor="start">E2 n</text>
<text x="78.0" y="281.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">length multiplier := n (0 means 1)</text>
<text x="0.0" y="296.0" font-family="'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#2B2A28" text-anchor="start">E8 n / E9 n</text>
<text x="78.0" y="296.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">multiplier minus / plus n</text>
<text x="0.0" y="311.0" font-family="'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#2B2A28" text-anchor="start">E6 w</text>
<text x="78.0" y="311.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">note at frequency w Hz</text>
<text x="0.0" y="326.0" font-family="'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#2B2A28" text-anchor="start">CD n, CE d</text>
<text x="78.0" y="326.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">repeat counter, loop back d bytes</text>
<text x="0.0" y="341.0" font-family="'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#2B2A28" text-anchor="start">D1 n, D2 d</text>
<text x="78.0" y="341.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">second repeat counter and loop</text>
<text x="0.0" y="356.0" font-family="'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#2B2A28" text-anchor="start">other 80-FF</text>
<text x="78.0" y="356.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">end of the voice</text>
<text x="270.0" y="36.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#7A5412" text-anchor="start">A note on the hardware</text>
<rect x="270.0" y="46.0" width="226.0" height="120.0" rx="5" fill="#F4E8CC" stroke="#A8741A" stroke-width="1.2"/>
<text x="279.0" y="64.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#7A5412" text-anchor="start">PC speaker, one voice</text>
<text x="279.0" y="80.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">table word = 1193180 / frequency (index</text>
<text x="279.0" y="93.9" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">1: 18.35 Hz; index 95: 4,187 Hz)</text>
<text x="279.0" y="111.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">out 42h: low byte, then high byte (channel</text>
<text x="279.0" y="125.6" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">2 is in mode 3 from 0B6h written to 43h)</text>
<text x="279.0" y="143.4" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">on: port 61h bits 0 and 1 set; off:</text>
<text x="279.0" y="157.3" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">cleared. Index 0 is a rest.</text>
<rect x="270.0" y="176.0" width="226.0" height="150.0" rx="5" fill="#EFE0EB" stroke="#7A3E6B" stroke-width="1.2"/>
<text x="279.0" y="194.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#5C2D50" text-anchor="start">Tandy, SN76489 on port C0h</text>
<text x="279.0" y="210.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">table word = 111860 / frequency, at</text>
<text x="279.0" y="223.9" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">most 1023 (indexes 1 to 3 are clamped);</text>
<text x="279.0" y="237.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">index 95 is 27</text>
<text x="279.0" y="255.6" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">tone: 1 cc 0 dddd (voice cc, low 4 bits),</text>
<text x="279.0" y="269.4" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">then 0 dddddd (high 6 bits)</text>
<text x="279.0" y="287.3" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">volume: 1 cc 1 vvvv with the voice&#x27;s value</text>
<text x="279.0" y="301.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">XOR 0Fh, 0 loudest [H]</text>
<text x="518.0" y="36.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#5C2D50" text-anchor="start">Tandy: one song, three voices</text>
<text x="518.0" y="70.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="600" fill="#3C3A36" text-anchor="start">voice 0</text>
<text x="518.0" y="84.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">volume 15</text>
