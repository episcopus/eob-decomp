<text x="443.5" y="55.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">3 (0.2 s)</text>
<text x="410.0" y="69.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">thrown items and spells in flight</text>
<text x="410.0" y="91.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="600" fill="#2B2A28" text-anchor="start">StepDoor</text>
<rect x="414.0" y="96.0" width="34.5" height="8.0" rx="2" fill="#B9C2E0" stroke="#3B4A8A" stroke-width="1"/>
<text x="454.5" y="104.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">5 (0.3 s)</text>
<text x="410.0" y="118.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">a door that is opening or closing</text>
<text x="410.0" y="140.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="600" fill="#2B2A28" text-anchor="start">BlinkSelected</text>
<rect x="414.0" y="145.0" width="47.1" height="8.0" rx="2" fill="#B9C2E0" stroke="#3B4A8A" stroke-width="1"/>
<text x="467.1" y="153.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">9 (0.5 s)</text>
<text x="410.0" y="167.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">frame of the member being moved</text>
<text x="410.0" y="189.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="600" fill="#2B2A28" text-anchor="start">CheckFarTable</text>
<rect x="414.0" y="194.0" width="49.3" height="8.0" rx="2" fill="#3B4A8A" stroke="#3B4A8A" stroke-width="1"/>
<text x="469.3" y="202.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">10 (0.5 s)</text>
<text x="410.0" y="216.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">animated walls (teleporter) flip</text>
<text x="410.0" y="238.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="600" fill="#2B2A28" text-anchor="start">UpdateMonsterGroup x4</text>
<rect x="414.0" y="243.0" width="64.2" height="8.0" rx="2" fill="#A8452F" stroke="#A8452F" stroke-width="1"/>
<text x="484.2" y="251.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">20 (1.1 s)</text>
<text x="410.0" y="265.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">monster groups 0 to 3</text>
<text x="410.0" y="287.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="600" fill="#2B2A28" text-anchor="start">RandomiseMonsterOffsets</text>
