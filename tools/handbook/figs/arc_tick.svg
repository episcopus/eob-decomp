<rect x="414.0" y="341.0" width="83.8" height="8.0" rx="2" fill="#A9D0C8" stroke="#1F6F66" stroke-width="1"/>
<text x="503.8" y="349.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">50 (2.7 s)</text>
<text x="410.0" y="363.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">poison, spells, timers of each member</text>
<text x="410.0" y="385.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="600" fill="#2B2A28" text-anchor="start">DecayMemberState</text>
<rect x="414.0" y="390.0" width="149.6" height="8.0" rx="2" fill="#1F6F66" stroke="#1F6F66" stroke-width="1"/>
<text x="569.6" y="398.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">1080 (59.3 s)</text>
<text x="410.0" y="412.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">food of each member</text>
<text x="410.0" y="426.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">Pale bars start disarmed and are armed on demand. Period in ticks</text>
<text x="410.0" y="439.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">(1 tick = 1/18.2 s), log scale; LoadLevel resets the monster periods.</text>
