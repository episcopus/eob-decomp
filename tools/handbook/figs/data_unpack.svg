<text x="0.0" y="272.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="start" letter-spacing="1.6">LCW COMMANDS (THE FIRST BYTE DECIDES)</text>
<rect x="0.0" y="280.0" width="70.0" height="19.0" rx="3" fill="#1F6F66" stroke="none" stroke-width="1"/>
<text x="35.0" y="293.5" font-family="'DejaVu Sans Mono', monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">00 to 7F</text>
<text x="82.0" y="294.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="600" fill="#14504A" text-anchor="start">copy from behind</text>
<text x="230.0" y="294.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">n = ((c SHR 4) AND 7) + 3 bytes; distance = 12 bits (low nibble of c, next byte)</text>
<rect x="0.0" y="302.0" width="70.0" height="19.0" rx="3" fill="#3B4A8A" stroke="none" stroke-width="1"/>
<text x="35.0" y="315.5" font-family="'DejaVu Sans Mono', monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">80 to BF</text>
<text x="82.0" y="316.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="600" fill="#2C386B" text-anchor="start">literal run</text>
<text x="230.0" y="316.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">n = c AND 3F bytes follow; 80 itself ends the data</text>
<rect x="0.0" y="324.0" width="70.0" height="19.0" rx="3" fill="#7A3E6B" stroke="none" stroke-width="1"/>
<text x="35.0" y="337.5" font-family="'DejaVu Sans Mono', monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">C0 to FD</text>
<text x="82.0" y="338.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="600" fill="#5C2D50" text-anchor="start">copy from the output</text>
<text x="230.0" y="338.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">n = (c AND 3F) + 3 bytes from an absolute u16 position</text>
<rect x="0.0" y="346.0" width="70.0" height="19.0" rx="3" fill="#A8741A" stroke="none" stroke-width="1"/>
<text x="35.0" y="359.5" font-family="'DejaVu Sans Mono', monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">FE</text>
<text x="82.0" y="360.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="600" fill="#7A5412" text-anchor="start">fill</text>
<text x="230.0" y="360.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">u16 count, u8 value: the byte repeated</text>
<rect x="0.0" y="368.0" width="70.0" height="19.0" rx="3" fill="#A8452F" stroke="none" stroke-width="1"/>
<text x="35.0" y="381.5" font-family="'DejaVu Sans Mono', monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">FF</text>
<text x="82.0" y="382.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="600" fill="#80311F" text-anchor="start">long absolute copy</text>
<text x="230.0" y="382.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">u16 count, u16 position</text>
