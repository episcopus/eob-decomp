<text x="432.0" y="68.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">Release: 66 runtime modules found as 1.00&#x27;s, 59 as 1.01&#x27;s</text>
<text x="432.0" y="81.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">(make rtl-compare)</text>
<text x="432.0" y="98.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">Switches: eliminated by matching whole modules (section 2.1.1)</text>
<text x="432.0" y="114.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">Debug info: -v keeps code tails apart, as the original does</text>
<text x="432.0" y="131.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">Assembler: TASM 2.0 SMART off, one pass for the drivers</text>
<text x="432.0" y="147.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">Linker: TLINK 3.0, signature FB 30 at 1Eh in the header</text>
<text x="0.0" y="322.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#6E695F" text-anchor="start">Not in the picture: the Borland runtime library is linked, never decompiled (CL.LIB, found module by module in the originals).</text>
<text x="0.0" y="339.5" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#6E695F" text-anchor="start">Differences left in the rebuilds: the link date written into the overlay data, and the order of the overlay stub entries.</text>
<text x="0.0" y="357.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#6E695F" text-anchor="start">Only TCC -c (internal assembler) merges identical tails; the originals were built with debug information, which stops that.</text>
