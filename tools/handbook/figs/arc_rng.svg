<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 474" width="760" height="474" class="fig">
<rect x="0.0" y="0.0" width="366.0" height="214.0" rx="6" fill="#E1E5F2" stroke="#3B4A8A" stroke-width="1.2"/>
<text x="10.0" y="20.0" font-family="Inter, 'Inter Display', sans-serif" font-size="13" font-weight="700" fill="#2C386B" text-anchor="start">rand(): the C runtime&#x27;s generator</text>
<text x="356.0" y="20.0" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#2C386B" text-anchor="end">0000:55B7</text>
<text x="10.0" y="42.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">state: one 32-bit word, ds:8784 (image value 1)</text>
<rect x="10.0" y="54.0" width="346.0" height="34.0" rx="6" fill="#FFFDF8" stroke="#3B4A8A" stroke-width="1.2"/>
<text x="183.0" y="76.0" font-family="'DejaVu Sans Mono', monospace" font-size="12" font-weight="600" fill="#2C386B" text-anchor="middle">seed = seed x 015A4E35h + 1   (mod 2^32)</text>
<rect x="10.0" y="98.0" width="346.0" height="34.0" rx="6" fill="#FFFDF8" stroke="#3B4A8A" stroke-width="1.2"/>
<text x="183.0" y="120.0" font-family="'DejaVu Sans Mono', monospace" font-size="12" font-weight="600" fill="#2C386B" text-anchor="middle">result = (seed &gt;&gt; 16) and 7FFFh      0 to 32767</text>
<text x="10.0" y="152.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.8" font-weight="400" fill="#3C3A36" text-anchor="start">Seeded once, in StartupGame (07C8:0199): srand(time(NULL))</text>
<text x="10.0" y="166.3" font-family="Inter, 'Inter Display', sans-serif" font-size="10.8" font-weight="400" fill="#3C3A36" text-anchor="start">stores the low 16 bits of the clock&#x27;s seconds as the low word and 0</text>
<text x="10.0" y="180.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.8" font-weight="400" fill="#3C3A36" text-anchor="start">as the high word. So there are 65,536 possible games of dice, and a</text>
<text x="10.0" y="194.8" font-family="Inter, 'Inter Display', sans-serif" font-size="10.8" font-weight="400" fill="#3C3A36" text-anchor="start">seed repeats about every 18 hours.</text>
<rect x="394.0" y="0.0" width="366.0" height="214.0" rx="6" fill="#EFE0EB" stroke="#7A3E6B" stroke-width="1.2"/>
<text x="404.0" y="20.0" font-family="Inter, 'Inter Display', sans-serif" font-size="13" font-weight="700" fill="#5C2D50" text-anchor="start">RandomByte: a 24-bit shift mix</text>
<text x="750.0" y="20.0" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#5C2D50" text-anchor="end">1D8C:0000</text>
<text x="404.0" y="42.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">state: 3 bytes b0 b1 b2 at ds:8484 (image value 34 12 76)</text>
<rect x="404.0" y="56.0" width="64.0" height="30.0" rx="6" fill="#FFFDF8" stroke="#7A3E6B" stroke-width="1.2"/>
<text x="436.0" y="74.9" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#5C2D50" text-anchor="middle">b2</text>
<rect x="480.0" y="56.0" width="64.0" height="30.0" rx="6" fill="#FFFDF8" stroke="#7A3E6B" stroke-width="1.2"/>
<text x="512.0" y="74.9" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#5C2D50" text-anchor="middle">b1</text>
<rect x="556.0" y="56.0" width="64.0" height="30.0" rx="6" fill="#FFFDF8" stroke="#7A3E6B" stroke-width="1.2"/>
<text x="588.0" y="74.9" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#5C2D50" text-anchor="middle">b0</text>
<text x="404.0" y="104.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">b2 and b1 shift left, b0 right; the bits that fall out feed the next byte.</text>
<text x="404.0" y="118.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">bit 1 of b0 enters b2; bit 7 of b2 enters b1; b0 takes a bit from</text>
<text x="404.0" y="132.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">(b0 &gt;&gt; 2) - b0 - carry. The result is  b0 xor b1  (one byte).</text>
<text x="404.0" y="154.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.8" font-weight="400" fill="#3C3A36" text-anchor="start">Never seeded: every run walks the same 139,810-step cycle from</text>
<text x="404.0" y="168.3" font-family="Inter, 'Inter Display', sans-serif" font-size="10.8" font-weight="400" fill="#3C3A36" text-anchor="start">the same start, so effects that use it look the same each time.</text>
<text x="404.0" y="182.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.8" font-weight="400" fill="#3C3A36" text-anchor="start">Only two callers, both in the spell burst effect (E0EF3.C).</text>
<text x="0.0" y="244.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="start" letter-spacing="1.6">WHO USES THEM</text>
<rect x="0.0" y="256.0" width="760.0" height="60.0" rx="5" fill="#E1E5F2" stroke="#3B4A8A" stroke-width="1"/>
<text x="10.0" y="274.0" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="700" fill="#2C386B" text-anchor="start">RollDice(count, sides, bonus)</text>
<text x="750.0" y="274.0" font-family="'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#2C386B" text-anchor="end">082C:0458</text>
<text x="10.0" y="288.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.6" font-weight="400" fill="#3C3A36" text-anchor="start">sum of count rolls, each  rand x sides / 32767 + 1  (a 1 + sides is folded to 1), plus the bonus, which is a char: 0FFh means -1. About 90 call sites in</text>
<text x="10.0" y="300.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.6" font-weight="400" fill="#3C3A36" text-anchor="start">15 units: to-hit, damage, saves, hit points, 4d6 minus the lowest for abilities, 1d10+3 for the ambient sound.</text>
<rect x="0.0" y="322.0" width="760.0" height="60.0" rx="5" fill="#E1E5F2" stroke="#3B4A8A" stroke-width="1"/>
<text x="10.0" y="340.0" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="700" fill="#2C386B" text-anchor="start">RandomRange(lo, hi)</text>
<text x="750.0" y="340.0" font-family="'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#2C386B" text-anchor="end">1AAA:0005</text>
<text x="10.0" y="354.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.6" font-weight="400" fill="#3C3A36" text-anchor="start">rand x (hi - lo + 1) / 32767 + lo, drawn again when it exceeds hi. Particle speeds and spreads of spell bursts, the shuffle of the tile animation in</text>
<text x="10.0" y="366.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.6" font-weight="400" fill="#3C3A36" text-anchor="start">overlay 5.</text>
<rect x="0.0" y="388.0" width="760.0" height="44.0" rx="5" fill="#EFE0EB" stroke="#7A3E6B" stroke-width="1"/>
<text x="10.0" y="406.0" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="700" fill="#5C2D50" text-anchor="start">RandomByte()</text>
<text x="750.0" y="406.0" font-family="'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#5C2D50" text-anchor="end">1D8C:0000</text>
<text x="10.0" y="420.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.6" font-weight="400" fill="#3C3A36" text-anchor="start">the low two bits or one bit of the result: the edge a burst particle starts on, whether it mirrors.</text>
<text x="0.0" y="448.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">First values, run in the oracle on the original: rand from the image seed 346, 130, 10982, 1090, 11656; after srand(1234), RollDice(1, 6, 0)</text>
<text x="0.0" y="462.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">gives 1, 6, 5, 5, 6, 3, 5, 4; RandomByte gives 62, 196, 85, 196, 63, 165, 39, 120 (each equals the Python model of the formulas above).</text>
</svg>