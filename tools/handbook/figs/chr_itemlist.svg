<text x="0.0" y="112.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">ITEM.DAT fills 0 to 431: 350 are on the maps (key = map cell, level = 1 to 12), 62 are in no map list (key 0), 20 are free (key -1).</text>
<text x="0.0" y="126.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">CopyItemToFreeSlot clones a template into the first record with key -1, from id 1 on; 500 records are all the game ever has.</text>
