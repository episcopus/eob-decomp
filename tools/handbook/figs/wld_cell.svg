<text x="308.0" y="278.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#2C386B" text-anchor="middle">mode 1</text>
<rect x="340.0" y="252.0" width="64.0" height="30.0" rx="0" fill="#EFE0EB" stroke="#7A3E6B" stroke-width="1.2"/>
<text x="372.0" y="265.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="middle">bit 2</text>
<rect x="404.0" y="252.0" width="64.0" height="30.0" rx="0" fill="#EFE0EB" stroke="#7A3E6B" stroke-width="1.2"/>
<text x="436.0" y="265.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="middle">bit 1</text>
<rect x="468.0" y="252.0" width="64.0" height="30.0" rx="0" fill="#EFE0EB" stroke="#7A3E6B" stroke-width="1.2"/>
<text x="500.0" y="265.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="middle">bit 0</text>
<text x="180.0" y="302.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="600" fill="#2C386B" text-anchor="middle">trigger mask: a set bit enables the event</text>
<text x="436.0" y="302.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="600" fill="#5C2D50" text-anchor="middle">monster count, 0 to 4 in practice</text>
<text x="548.0" y="264.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="600" fill="#6E695F" text-anchor="start">mode</text>
<text x="598.0" y="264.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="600" fill="#6E695F" text-anchor="start">event (RunCellScript)</text>
<text x="548.0" y="280.0" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#2C386B" text-anchor="start">1</text>
<text x="598.0" y="280.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">the party enters the cell</text>
<text x="548.0" y="295.0" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#2C386B" text-anchor="start">2</text>
<text x="598.0" y="295.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">the party leaves it</text>
<text x="548.0" y="310.0" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#2C386B" text-anchor="start">4</text>
<text x="598.0" y="310.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">an item is put into it</text>
<text x="548.0" y="325.0" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#2C386B" text-anchor="start">8</text>
<text x="598.0" y="325.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">an item is taken from it</text>
<text x="548.0" y="340.0" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#2C386B" text-anchor="start">0x10</text>
<text x="598.0" y="340.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">a thrown item flies into it</text>
<text x="0.0" y="362.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">Enabled whatever the mask: 0x20 (the level timer, cell 0 only), 0x40 (a mouse click on the wall) and 0x80 (nothing raises it). The key &#x27;activate&#x27; uses</text>
<text x="0.0" y="375.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">0xFF. LoadLevel ORs the file&#x27;s flag byte into +4 and stores the script offset at +7 for each entry of the level file&#x27;s trigger table.</text>
</svg>