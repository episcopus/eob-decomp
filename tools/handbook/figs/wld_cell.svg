<line x1="22.0" y1="124.0" x2="22.0" y2="130.0" stroke="#1F6F66" stroke-width="0.8"/>
<text x="26.0" y="144.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#14504A" text-anchor="start">Four wall types</text>
<text x="26.0" y="160.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">One byte per side, in direction order: 0 north, 1 east, 2 south,</text>
<text x="26.0" y="173.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">3 west. The value indexes the four per-kind tables of the level</text>
<text x="26.0" y="187.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">(flags, picture, handler, decoration chain). 0 is open space.</text>
<line x1="342.0" y1="124.0" x2="342.0" y2="130.0" stroke="#7A3E6B" stroke-width="0.8"/>
<text x="346.0" y="144.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#5C2D50" text-anchor="start">+4</text>
<text x="346.0" y="160.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">See below.</text>
<line x1="422.0" y1="124.0" x2="422.0" y2="130.0" stroke="#A8741A" stroke-width="0.8"/>
<text x="426.0" y="144.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#7A5412" text-anchor="start">Items</text>
<text x="426.0" y="160.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">Head of a circular list of the</text>
<text x="426.0" y="173.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">items lying in the cell (an index</text>
<text x="426.0" y="187.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">into gItems, 0 = none).</text>
<line x1="582.0" y1="124.0" x2="582.0" y2="130.0" stroke="#3B4A8A" stroke-width="0.8"/>
<text x="586.0" y="144.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#2C386B" text-anchor="start">Script</text>
<text x="586.0" y="160.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">Offset of the cell&#x27;s script in</text>
<text x="586.0" y="173.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">the level file (0 = none).</text>
<line x1="0.0" y1="224.0" x2="760.0" y2="224.0" stroke="#D9D2C3" stroke-width="1"/>
<text x="0.0" y="240.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="start" letter-spacing="1.6">BYTE +4 BIT BY BIT, AND THE EVENTS THE MASK SWITCHES ON</text>
