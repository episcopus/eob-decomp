<text x="0.0" y="384.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">Entering facing east goes down; entering any other way is bounced back out. 432 tests in the 12 level files have the &#x27;literal == literal&#x27; shape: 108 groups</text>
<text x="0.0" y="398.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">of four in 54 scripts, each followed by a MOVE. The first operand is a constant where the design seems to call for the party&#x27;s facing.</text>
