<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" class="fig"><defs><marker id="a8A8373" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8A8373"/></marker></defs>
<text x="0.0" y="11.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="start" letter-spacing="1.6">THE PROOF LADDER: EACH RUNG IS A TOOL&#x27;S VERDICT, NOT A PERSON&#x27;S</text>
<rect x="0.0" y="28.0" width="176.5" height="150.0" rx="6" fill="#ECE7DD" stroke="#8A8373" stroke-width="1.2"/>
<rect x="0.0" y="28.0" width="176.5" height="26.0" rx="6" fill="#8A8373" stroke="#8A8373" stroke-width="1.2"/>
<rect x="0.0" y="44.0" width="176.5" height="10.0" rx="0" fill="#8A8373" stroke="none" stroke-width="1"/>
<text x="10.0" y="46.0" font-family="Inter, 'Inter Display', sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="start">L0  Drafted</text>
<text x="10.0" y="76.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">C or assembly in src/ that</text>
<text x="10.0" y="91.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">compiles with the pinned</text>
<text x="10.0" y="106.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">toolchain</text>
<text x="10.0" y="150.0" font-family="'DejaVu Sans Mono', monospace" font-size="9.5" font-weight="400" fill="#3C3A36" text-anchor="start">make match</text>
<path d="M177.5,103.0 L193.5,103.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<rect x="194.5" y="28.0" width="176.5" height="150.0" rx="6" fill="#DCEBE7" stroke="#1F6F66" stroke-width="1.2"/>
<rect x="194.5" y="28.0" width="176.5" height="26.0" rx="6" fill="#1F6F66" stroke="#1F6F66" stroke-width="1.2"/>
<rect x="194.5" y="44.0" width="176.5" height="10.0" rx="0" fill="#1F6F66" stroke="none" stroke-width="1"/>
<text x="204.5" y="46.0" font-family="Inter, 'Inter Display', sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="start">L2  Matched</text>
<text x="204.5" y="76.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">our compiler output equals</text>
<text x="204.5" y="91.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">the original&#x27;s instructions;</text>
<text x="204.5" y="106.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">every address field names the</text>
<text x="204.5" y="121.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">same thing</text>
<text x="204.5" y="150.0" font-family="'DejaVu Sans Mono', monospace" font-size="9.5" font-weight="400" fill="#14504A" text-anchor="start">make match WRITE=1</text>
<rect x="204.5" y="159.1" width="97.3" height="17.8" rx="8.924999999999999" fill="#1F6F66" stroke="#1F6F66" stroke-width="1"/>
<text x="253.2" y="171.8" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">1,011 functions</text>
<path d="M372.0,103.0 L388.0,103.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<rect x="389.0" y="28.0" width="176.5" height="150.0" rx="6" fill="#E1E5F2" stroke="#3B4A8A" stroke-width="1.2"/>
<rect x="389.0" y="28.0" width="176.5" height="26.0" rx="6" fill="#3B4A8A" stroke="#3B4A8A" stroke-width="1.2"/>
<rect x="389.0" y="44.0" width="176.5" height="10.0" rx="0" fill="#3B4A8A" stroke="none" stroke-width="1"/>
<text x="399.0" y="46.0" font-family="Inter, 'Inter Display', sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="start">L3  Rebuilt</text>
<text x="399.0" y="76.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">make rebuild links all units</text>
<text x="399.0" y="91.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">into a program whose image,</text>
<text x="399.0" y="106.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">relocations and overlays equal</text>
<text x="399.0" y="121.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">the original&#x27;s</text>
<text x="399.0" y="150.0" font-family="'DejaVu Sans Mono', monospace" font-size="9.5" font-weight="400" fill="#2C386B" text-anchor="start">make rebuild</text>
<rect x="399.0" y="159.1" width="127.1" height="17.8" rx="8.924999999999999" fill="#3B4A8A" stroke="#3B4A8A" stroke-width="1"/>
<text x="462.6" y="171.8" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">3 programs, 4 drivers</text>
<path d="M566.5,103.0 L582.5,103.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<rect x="583.5" y="28.0" width="176.5" height="150.0" rx="6" fill="#EFE0EB" stroke="#7A3E6B" stroke-width="1.2"/>
<rect x="583.5" y="28.0" width="176.5" height="26.0" rx="6" fill="#7A3E6B" stroke="#7A3E6B" stroke-width="1.2"/>
<rect x="583.5" y="44.0" width="176.5" height="10.0" rx="0" fill="#7A3E6B" stroke="none" stroke-width="1"/>
<text x="593.5" y="46.0" font-family="Inter, 'Inter Display', sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="start">Played</text>
<text x="593.5" y="76.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">the oracle runs original and</text>
<text x="593.5" y="91.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">rebuild on recorded sessions:</text>
<text x="593.5" y="106.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">same instructions, screens,</text>
<text x="593.5" y="121.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">sound writes, state digests</text>
<text x="593.5" y="150.0" font-family="'DejaVu Sans Mono', monospace" font-size="9.5" font-weight="400" fill="#5C2D50" text-anchor="start">make golden REBUILT=1</text>
<rect x="593.5" y="159.1" width="67.5" height="17.8" rx="8.924999999999999" fill="#7A3E6B" stroke="#7A3E6B" stroke-width="1"/>
<text x="627.3" y="171.8" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">7 sessions</text>
<rect x="0.0" y="200.0" width="760.0" height="86.0" rx="8" fill="#F4F0E6" stroke="none" stroke-width="1"/>
<text x="14.0" y="220.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#7A5412" text-anchor="start" letter-spacing="1.6">WHAT KEEPS THE VERDICTS HONEST</text>
<text x="14.0" y="242.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">Negative fixtures: 11 near-miss units the matcher must reject (a bound 52 changed to 53, the wrong table, an extra store).</text>
<text x="14.0" y="262.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">Pinned inputs: re/inputs.toml holds the SHA-256 of every original file; nothing under eob/ is ever changed.</text>
<text x="14.0" y="280.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">Only tools write levels: an agent cannot mark a function matched; make match WRITE=1 does, and make match-gate re-proves them all.</text>
</svg>