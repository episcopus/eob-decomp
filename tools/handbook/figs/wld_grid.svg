<text x="552.0" y="89.0" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="400" fill="#3C3A36" text-anchor="start">side 3 of the target cell</text>
<text x="392.0" y="110.0" font-family="'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#3C3A36" text-anchor="start">2</text>
<text x="430.0" y="110.0" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="400" fill="#3C3A36" text-anchor="start">south</text>
<text x="492.0" y="110.0" font-family="'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#3C3A36" text-anchor="start">+32</text>
<text x="552.0" y="110.0" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="400" fill="#3C3A36" text-anchor="start">side 0 of the target cell</text>
<text x="392.0" y="131.0" font-family="'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#3C3A36" text-anchor="start">3</text>
