<text x="148.0" y="194.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="700" fill="#14504A" text-anchor="end">side 3: west</text>
<text x="204.0" y="370.0" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="middle">cell c = y * 32 + x   (x = c &amp; 31, y = c &gt;&gt; 5)</text>
<text x="204.0" y="388.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="middle">positions 0..3 are the quadrants NW, NE, SW, SE; 4 is the centre</text>
<text x="392.0" y="22.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="start" letter-spacing="1.6">STEPPING (STEPCELL, STEPIFOPEN)</text>
