<text x="492.0" y="131.0" font-family="'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#3C3A36" text-anchor="start">-1</text>
<text x="552.0" y="131.0" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="400" fill="#3C3A36" text-anchor="start">side 1 of the target cell</text>
<text x="392.0" y="156.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">The step lands on (c + offset) &amp; 0x3FF, so north and south wrap</text>
<text x="392.0" y="170.5" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">between row 0 and row 31 and a step east from x = 31 enters x = 0</text>
<text x="392.0" y="185.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">of the next row. The target&#x27;s wall on the side facing back needs flag</text>
<text x="392.0" y="199.5" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">bit 0, and the cell must hold no monster.</text>
