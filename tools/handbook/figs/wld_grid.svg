<text x="542.0" y="262.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">The helper (17A6:0314) compares</text>
<text x="542.0" y="276.5" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">twice one coordinate difference</text>
<text x="542.0" y="291.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">with the other. A cardinal code owns</text>
<text x="542.0" y="305.5" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">a 2:1 slope band, a diagonal lies</text>
<text x="542.0" y="320.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">between. The same cell gives 255. A</text>
<text x="542.0" y="334.5" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">monster facing orient (0 to 3) looks</text>
<text x="542.0" y="349.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">along code orient * 2.</text>
