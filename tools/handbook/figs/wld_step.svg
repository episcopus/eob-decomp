<text x="382.0" y="93.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">HandleMapKey</text>
<rect x="372.0" y="109.0" width="388.0" height="49.0" rx="6" fill="#EFE0EB" stroke="#7A3E6B" stroke-width="1.1"/>
<text x="382.0" y="125.0" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#5C2D50" text-anchor="start">RunEffects  (1414:04E7)</text>
<text x="382.0" y="138.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">every effect of the 16 whose expiry has passed runs its handler; then</text>
<text x="382.0" y="150.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">TickLevelScriptTimer</text>
<rect x="372.0" y="166.0" width="388.0" height="36.5" rx="6" fill="#EFE0EB" stroke="#7A3E6B" stroke-width="1.1"/>
<text x="382.0" y="182.0" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#5C2D50" text-anchor="start">DrawViewFrame(1)</text>
<text x="382.0" y="195.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">only when gViewDirty is set</text>
<rect x="372.0" y="210.5" width="388.0" height="49.0" rx="6" fill="#EFE0EB" stroke="#7A3E6B" stroke-width="1.1"/>
<text x="382.0" y="226.5" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#5C2D50" text-anchor="start">ambient sound</text>
