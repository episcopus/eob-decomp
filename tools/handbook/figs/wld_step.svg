<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="760" height="452" class="fig"><defs><marker id="a8A8373" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8A8373"/></marker></defs>
<text x="0.0" y="11.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="start" letter-spacing="1.6">ONE STEP OF THE PARTY (LEFT) AND ONE PASS OF THE MAP LOOP THAT RUNS EVERYTHING ELSE (RIGHT)</text>
<rect x="0.0" y="30.0" width="340.0" height="65.5" rx="6" fill="#DCEBE7" stroke="#1F6F66" stroke-width="1.1"/>
<text x="10.0" y="47.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#14504A" text-anchor="start">movement key</text>
<text x="10.0" y="61.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">MoveForward, MoveBackward, MoveLeft, MoveRight (0ACD:04F8</text>
<text x="10.0" y="73.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">to 05FF): heading d = facing, +2, -1 or +1. The arrows move</text>
<text x="10.0" y="86.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">without turning; TurnLeft and TurnRight only change gPartyDir.</text>
<path d="M170.0,96.5 L170.0,107.5" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<rect x="0.0" y="108.5" width="340.0" height="65.5" rx="6" fill="#E1E5F2" stroke="#3B4A8A" stroke-width="1.1"/>
<text x="10.0" y="125.5" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="700" fill="#2C386B" text-anchor="start">StepIfOpen(gPartyCell, d)</text>
<text x="10.0" y="139.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">target = StepCell; the wall of the target on side d ^ 2 needs flag</text>
<text x="10.0" y="152.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">bit 0; no monster in the target. Else -1: &#x27;You can&#x27;t go that way.&#x27;,</text>
<text x="10.0" y="164.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">sound 0x1D, key buffer flushed.</text>
<path d="M170.0,175.0 L170.0,186.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<rect x="0.0" y="187.0" width="340.0" height="78.0" rx="6" fill="#E1E5F2" stroke="#3B4A8A" stroke-width="1.1"/>
<text x="10.0" y="204.0" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="700" fill="#2C386B" text-anchor="start">MoveParty(target)  122E:0001</text>
<text x="10.0" y="218.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">AlertNearbyMonsters; gPartyCell = target; RunCellScript(old, 2);</text>
<text x="10.0" y="230.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">RunCellScript(new, 1); AlertNearbyMonsters; gStepCount++;</text>
<text x="10.0" y="243.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">gPickViewPos = 0xFF; gViewDirty = 1; a newline to the message</text>
<text x="10.0" y="255.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">area; UpdateDDEffects.</text>
<path d="M170.0,266.0 L170.0,277.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<rect x="0.0" y="278.0" width="340.0" height="53.0" rx="6" fill="#ECE7DD" stroke="#8A8373" stroke-width="1.1"/>
<text x="10.0" y="295.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#3C3A36" text-anchor="start">the next pass of the loop</text>
<text x="10.0" y="309.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">gViewDirty makes DrawViewFrame redraw the view; gStepCount</text>
<text x="10.0" y="321.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">feeds the level timer.</text>
<text x="372.0" y="40.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#5C2D50" text-anchor="start">RunMapLoop (0ACD:0E8A), every pass</text>
<rect x="372.0" y="52.0" width="388.0" height="49.0" rx="6" fill="#EFE0EB" stroke="#7A3E6B" stroke-width="1.1"/>
<text x="382.0" y="68.0" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#5C2D50" text-anchor="start">PollMapInput</text>
