<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="760" height="580" class="fig"><defs><marker id="a8A8373" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8A8373"/></marker></defs>
<rect x="0.0" y="4.0" width="560.0" height="70.0" rx="6" fill="#ECE7DD" stroke="#8A8373" stroke-width="1.2"/>
<text x="10.0" y="22.0" font-family="Inter, 'Inter Display', sans-serif" font-size="13.5" font-weight="700" fill="#3C3A36" text-anchor="start">1  C0L start-up code</text>
<text x="550.0" y="22.0" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="end">0000:0000</text>
<text x="10.0" y="39.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">DS = DGROUP (212E), the C runtime and the overlay manager are set up, then main is called</text>
<text x="10.0" y="53.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">(07C8:0001)</text>
<text x="582.0" y="43.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#6E695F" text-anchor="start">before any game code</text>
<line x1="564.0" y1="39.0" x2="576.0" y2="39.0" stroke="#D9D2C3" stroke-width="1.2"/>
<path d="M280.0,75.0 L280.0,85.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<rect x="0.0" y="86.0" width="560.0" height="70.0" rx="6" fill="#DCEBE7" stroke="#1F6F66" stroke-width="1.2"/>
<text x="10.0" y="104.0" font-family="Inter, 'Inter Display', sans-serif" font-size="13.5" font-weight="700" fill="#14504A" text-anchor="start">2  Main</text>
<text x="550.0" y="104.0" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#14504A" text-anchor="end">07C8:0001</text>
<text x="10.0" y="121.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">reads argv: graphics, sound, mouse digits, the word homie, the mode to restore</text>
<text x="10.0" y="135.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">saves INT 3Fh, installs Int3FHandler; needs a 65,000-byte free block</text>
<text x="10.0" y="149.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">hooks: gExitHook, gAllocFailHook; InstallKeyboard, InstallHardErr, InstallTickHandler</text>
<text x="582.0" y="125.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#6E695F" text-anchor="start">INT 9, INT 1Ch, INT 24h, INT 3Fh taken</text>
<line x1="564.0" y1="121.0" x2="576.0" y2="121.0" stroke="#D9D2C3" stroke-width="1.2"/>
<path d="M280.0,157.0 L280.0,167.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<rect x="0.0" y="168.0" width="560.0" height="70.0" rx="6" fill="#DCEBE7" stroke="#1F6F66" stroke-width="1.2"/>
<text x="10.0" y="186.0" font-family="Inter, 'Inter Display', sans-serif" font-size="13.5" font-weight="700" fill="#14504A" text-anchor="start">3  StartupGame</text>
<text x="550.0" y="186.0" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#14504A" text-anchor="end">07C8:0199</text>
<text x="10.0" y="203.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">video mode, InitMouse, load the graphics driver *.OVL (RunOverlayRequest)</text>
<text x="10.0" y="217.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">build the page table (8 segments, MemAlloc), load FONT8 and FONT6, palette</text>
<text x="10.0" y="231.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">InitOverlayCache (file table), CalibrateRetrace, srand(time), SetTextWindow(0), sound card on</text>
<text x="582.0" y="207.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#6E695F" text-anchor="start">gStartupDone = 1</text>
<line x1="564.0" y1="203.0" x2="576.0" y2="203.0" stroke="#D9D2C3" stroke-width="1.2"/>
<path d="M280.0,239.0 L280.0,249.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<rect x="0.0" y="250.0" width="560.0" height="70.0" rx="6" fill="#DCEBE7" stroke="#1F6F66" stroke-width="1.2"/>
<text x="10.0" y="268.0" font-family="Inter, 'Inter Display', sans-serif" font-size="13.5" font-weight="700" fill="#14504A" text-anchor="start">4  Main again</text>
<text x="550.0" y="268.0" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#14504A" text-anchor="end">07C8:0001</text>
<text x="10.0" y="285.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">eobpal.col to the DAC for VGA, text attributes 0F and 0C, node callback cleared</text>
<text x="10.0" y="299.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">mouse flag from argv[3] and whether a driver answered; calls StartupAlloc</text>
<text x="582.0" y="289.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#6E695F" text-anchor="start">gKeyboardOptions = 1</text>
<line x1="564.0" y1="285.0" x2="576.0" y2="285.0" stroke="#D9D2C3" stroke-width="1.2"/>
<path d="M280.0,321.0 L280.0,331.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<rect x="0.0" y="332.0" width="560.0" height="70.0" rx="6" fill="#E1E5F2" stroke="#3B4A8A" stroke-width="1.2"/>
<text x="10.0" y="350.0" font-family="Inter, 'Inter Display', sans-serif" font-size="13.5" font-weight="700" fill="#2C386B" text-anchor="start">5  StartupAlloc</text>
<text x="550.0" y="350.0" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#2C386B" text-anchor="end">07A9:000A</text>
<text x="10.0" y="367.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">five MemAlloc blocks: 7,500, 6,000, 120, 4,096 and 1,600 bytes</text>
<text x="10.0" y="381.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">GetPageBuffer(7), (5), (3); LoadSoundDriver; SetUnpackBuffer; then LoadItemData</text>
<text x="582.0" y="371.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#6E695F" text-anchor="start">gBarGraphsOn = 1</text>
<line x1="564.0" y1="367.0" x2="576.0" y2="367.0" stroke="#D9D2C3" stroke-width="1.2"/>
<path d="M280.0,403.0 L280.0,413.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<rect x="0.0" y="414.0" width="560.0" height="70.0" rx="6" fill="#EFE0EB" stroke="#7A3E6B" stroke-width="1.2"/>
<text x="10.0" y="432.0" font-family="Inter, 'Inter Display', sans-serif" font-size="13.5" font-weight="700" fill="#5C2D50" text-anchor="start">6  LoadItemData</text>
<text x="550.0" y="432.0" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#5C2D50" text-anchor="end">ovl2:09CC</text>
<text x="10.0" y="449.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">pointer shape, InitGameTables, ITEM.DAT, ITEMTYPE.DAT, UI colours, INTRO picture</text>
<text x="10.0" y="463.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">LoadGamePanel: the title menu; returns once a game is loaded or a party is made</text>
<text x="582.0" y="453.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#6E695F" text-anchor="start">title menu runs here</text>
<line x1="564.0" y1="449.0" x2="576.0" y2="449.0" stroke="#D9D2C3" stroke-width="1.2"/>
<path d="M280.0,485.0 L280.0,495.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<rect x="0.0" y="496.0" width="560.0" height="70.0" rx="6" fill="#E1E5F2" stroke="#3B4A8A" stroke-width="1.2"/>
<text x="10.0" y="514.0" font-family="Inter, 'Inter Display', sans-serif" font-size="13.5" font-weight="700" fill="#2C386B" text-anchor="start">7  RunMapLoop</text>
<text x="550.0" y="514.0" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#2C386B" text-anchor="end">0ACD:0E8A</text>
<text x="10.0" y="531.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">after LoadDecorateIcons (item sheets, ITEMRMP) the game loop starts and never returns</text>
<text x="10.0" y="545.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">the program ends in ShutdownGame (07C8:058A), through exit</text>
<text x="582.0" y="535.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#6E695F" text-anchor="start">the game</text>
