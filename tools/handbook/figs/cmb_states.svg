<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 423" width="760" height="423" class="fig">
<text x="0.0" y="11.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="start" letter-spacing="1.6">HIT POINTS, STATUS BITS AND THE PARTY-WIPE CHECK</text>
<rect x="0.0" y="24.0" width="360.0" height="88.0" rx="6" fill="#DCEBE7" stroke="#1F6F66" stroke-width="1.2"/>
<text x="9.0" y="58.2" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#14504A" text-anchor="start">hp above 0: awake</text>
<text x="9.0" y="72.8" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">acts, casts, is a target, shares experience; MemberIs bits 1, 2, 4</text>
<text x="9.0" y="86.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">pass</text>
<rect x="370.0" y="24.0" width="220.0" height="88.0" rx="6" fill="#F4E8CC" stroke="#A8741A" stroke-width="1.2"/>
<text x="379.0" y="58.2" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#7A5412" text-anchor="start">0 to -9: unconscious</text>
<text x="379.0" y="72.8" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">cannot act (bit 4 fails); still a target</text>
<text x="379.0" y="86.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">and still heals; nothing bleeds</text>
<rect x="600.0" y="24.0" width="160.0" height="88.0" rx="6" fill="#F5E0D9" stroke="#A8452F" stroke-width="1.2"/>
<text x="609.0" y="51.4" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#80311F" text-anchor="start">-10 or less: dead</text>
<text x="609.0" y="66.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">hp is set to -10; status</text>
<text x="609.0" y="79.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">keeps only bit 0;</text>
<text x="609.0" y="93.3" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">HealCharacter ignores it</text>
<text x="0.0" y="130.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">hp is a signed byte: Aid and healing items are capped at 127; a death is when hp reaches -10 (DamageCharacter, 0DE8:09B9).</text>
<text x="0.0" y="150.0" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#2B2A28" text-anchor="start">MemberIs(who, mask)  0D1C:0670: every bit in the mask must hold</text>
<text x="0.0" y="168.0" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#2C386B" text-anchor="start">1</text>
<text x="34.0" y="168.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">slot holds a character (status bit 0)</text>
<text x="0.0" y="184.0" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#2C386B" text-anchor="start">2</text>
<text x="34.0" y="184.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">hp above -10 (not dead)</text>
<text x="0.0" y="200.0" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#2C386B" text-anchor="start">4</text>
<text x="34.0" y="200.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">hp above 0 (not unconscious)</text>
<text x="0.0" y="216.0" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#2C386B" text-anchor="start">8</text>
<text x="34.0" y="216.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">not paralysed (status bit 2)</text>
<text x="0.0" y="232.0" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#2C386B" text-anchor="start">16</text>
<text x="34.0" y="232.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">not poisoned (status bit 1)</text>
<text x="330.0" y="168.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#6E695F" text-anchor="start">common masks</text>
<text x="330.0" y="184.0" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#2C386B" text-anchor="start">1</text>
<text x="362.0" y="184.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">any member present</text>
<text x="330.0" y="200.0" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#2C386B" text-anchor="start">3</text>
<text x="362.0" y="200.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">alive: targets of healing, spells, shared XP</text>
<text x="330.0" y="216.0" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#2C386B" text-anchor="start">5</text>
<text x="362.0" y="216.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">awake: counted by the party-wipe check</text>
<text x="330.0" y="232.0" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#2C386B" text-anchor="start">13</text>
<text x="362.0" y="232.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">able to act: use an item, turn undead</text>
<text x="0.0" y="270.0" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#2B2A28" text-anchor="start">Conditions and what ends them (timed effect types 8 and 9)</text>
<rect x="0.0" y="282.0" width="244.0" height="130.6" rx="6" fill="#EFE0EB" stroke="#7A3E6B" stroke-width="1.2"/>
<text x="9.0" y="303.4" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#5C2D50" text-anchor="start">Poisoned: status bit 1</text>
<text x="9.0" y="318.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">a monster with flag 16 hits, or a poison</text>
<text x="9.0" y="331.6" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">potion is drunk, and the member fails a</text>
<text x="9.0" y="345.3" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">kind-0 save</text>
<text x="9.0" y="358.9" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">every 546 ticks (30 s): 5 hp of damage and</text>
<text x="9.0" y="372.6" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">a message, until cured</text>
<text x="9.0" y="386.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">Slow Poison (flag 128): the ticks do</text>
<text x="9.0" y="399.9" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">nothing for a while</text>
<rect x="258.0" y="282.0" width="244.0" height="116.9" rx="6" fill="#EFE0EB" stroke="#7A3E6B" stroke-width="1.2"/>
<text x="267.0" y="303.4" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#5C2D50" text-anchor="start">Paralysed: status bit 2</text>
<text x="267.0" y="318.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">monster flag 32 (save kind 2) or Mind</text>
<text x="267.0" y="331.6" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">Blast (kind 1, whole party)</text>
<text x="267.0" y="345.3" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">ends by itself after 5 * 546 = 2730 ticks</text>
<text x="267.0" y="358.9" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">(150 s), with a message</text>
<text x="267.0" y="372.6" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">Remove Paralysis clears up to four</text>
<text x="267.0" y="386.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">members at once</text>
<rect x="516.0" y="282.0" width="244.0" height="103.2" rx="6" fill="#F5E0D9" stroke="#A8452F" stroke-width="1.2"/>
<text x="525.0" y="303.4" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#80311F" text-anchor="start">Party wiped</text>
<text x="525.0" y="318.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">checked only when a member dies: if no</text>
<text x="525.0" y="331.6" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">member is present with hp above 0, a</text>
<text x="525.0" y="345.3" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">message is shown, a key is awaited and</text>
<text x="525.0" y="358.9" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">the game exits. There is no game-over</text>
<text x="525.0" y="372.6" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">menu.</text>
</svg>