<text x="0.0" y="404.0" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">next</text>
<text x="56.0" y="404.0" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">...</text>
