<text x="150.0" y="338.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">n pairs (monster speed class, period in ticks), ended by FF</text>
<text x="0.0" y="360.0" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">next</text>
