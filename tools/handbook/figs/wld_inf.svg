<text x="0.0" y="426.0" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">T</text>
<text x="56.0" y="426.0" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">2 + 5k</text>
<text x="150.0" y="426.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">trigger table: count k, then k entries (cell u16, flag byte, script offset u16), ending at the end of the file</text>
</svg>