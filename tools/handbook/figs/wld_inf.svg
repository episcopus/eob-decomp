<text x="150.0" y="294.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">level timer: mode (0 off, 1 ticks, 2 steps, 3 both), period in ticks, steps</text>
<text x="0.0" y="316.0" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">47</text>
<text x="56.0" y="316.0" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">13 + 13</text>
<text x="150.0" y="316.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">two monster sprite sheets: loader 0, 1 or 2 (255 none), then the sheet name</text>
<text x="0.0" y="338.0" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">73</text>
