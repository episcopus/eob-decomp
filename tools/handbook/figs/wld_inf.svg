<text x="150.0" y="360.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">30 monster records of 14 bytes (a record with cell 0 is an empty slot)</text>
<text x="0.0" y="382.0" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">next</text>
