<text x="150.0" y="272.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">door pictures: two (set, first slot) pairs for LoadDoorShapes, 255 = none</text>
<text x="0.0" y="294.0" font-family="'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#3C3A36" text-anchor="start">42</text>
