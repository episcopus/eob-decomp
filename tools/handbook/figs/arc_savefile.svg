<text x="539.8" y="218.0" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="start">bless, prayer, detect magic</text>
<text x="380.0" y="232.0" font-family="'DejaVu Sans Mono', monospace" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="start">+0C</text>
<text x="412.0" y="232.0" font-family="'DejaVu Sans Mono', monospace" font-size="9.8" font-weight="400" fill="#6E695F" text-anchor="start">FBD4</text>
<text x="448.0" y="232.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="700" fill="#2B2A28" text-anchor="start">gLevelFlags[0]</text>
<text x="526.2" y="232.0" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="start">never used</text>
<text x="380.0" y="246.0" font-family="'DejaVu Sans Mono', monospace" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="start">+10</text>
<text x="412.0" y="246.0" font-family="'DejaVu Sans Mono', monospace" font-size="9.8" font-weight="400" fill="#6E695F" text-anchor="start">FBD8</text>
<text x="448.0" y="246.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="700" fill="#2B2A28" text-anchor="start">gLevelFlags[1..11]</text>
<text x="545.3" y="246.0" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="start">32-bit script flags, one word per level</text>
<text x="380.0" y="260.0" font-family="'DejaVu Sans Mono', monospace" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="start">+3C</text>
<text x="412.0" y="260.0" font-family="'DejaVu Sans Mono', monospace" font-size="9.8" font-weight="400" fill="#6E695F" text-anchor="start">FC04</text>
<text x="448.0" y="260.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="700" fill="#2B2A28" text-anchor="start">gGameFlags</text>
<text x="513.8" y="260.0" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="start">32-bit script flags of the whole game</text>
<text x="8.0" y="296.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#6E695F" text-anchor="start">Words are 16-bit. gLevelFlags is indexed by gCurLevel (1 to 12), so index 0 is never used and level 12 writes into gGameFlags: the two share the last 4 bytes.</text>
<text x="0.0" y="322.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="start" letter-spacing="1.6">ONE LEVEL STATE, 2,040 BYTES (7F8H), THE UNIT OF LEVELS.TMP AND OF THE 12 SLOTS</text>
<rect x="8.0" y="336.0" width="436.6" height="36.0" rx="0" fill="#B9C2E0" stroke="#3B4A8A" stroke-width="1"/>
<text x="14.0" y="351.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="600" fill="#2C386B" text-anchor="start">LCW stream of the 4,096 wall bytes (1,024 cells x 4); at most 1,200 bytes (4B0h), the</text>
<text x="14.0" y="362.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#2C386B" text-anchor="start">rest of the area unused</text>
<rect x="445.6" y="336.0" width="305.4" height="36.0" rx="0" fill="#E3B2A5" stroke="#A8452F" stroke-width="1"/>
<text x="451.6" y="351.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="600" fill="#80311F" text-anchor="start">30 monster records, 28 bytes each: 840 bytes (348h)</text>
<text x="8.0" y="394.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#6E695F" text-anchor="start">The walls of a cell can change (doors, switches), and the monsters move, so a level is saved as its changed walls and its monsters. The pristine walls</text>
<text x="8.0" y="407.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#6E695F" text-anchor="start">are in LEVELn.MAZ; items are not here (they live in the 500-item block, with a level number each).</text>
</svg>