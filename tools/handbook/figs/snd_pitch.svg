<text x="0.0" y="312.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">Under each bar: Hz at block 4 [H]. The steps are about 5.95 percent, a semitone; semitone 0 is near a B flat, not a C.</text>
<text x="0.0" y="336.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">A duration d counts down only when the voice&#x27;s speed accumulator carries: units per driver tick = speed / 256, a tick is 13.7 ms (72.8 Hz), so</text>
<text x="0.0" y="349.9" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">d units last d x 256 / speed ticks. A speed of FFh is one unit per tick; the intro&#x27;s three pieces set 168, 234 and 180.</text>
