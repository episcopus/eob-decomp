<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" width="760" height="376" class="fig">
<text x="0.0" y="11.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="start" letter-spacing="1.6">FROM A NOTE BYTE TO REGISTERS A0H AND B0H, AND FROM A DURATION TO TICKS</text>
<text x="0.0" y="36.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="600" fill="#3C3A36" text-anchor="start">note byte (the first byte of a note, below 80h)</text>
<rect x="0.0" y="44.0" width="96.0" height="30.0" rx="3" fill="#DCEBE7" stroke="#1F6F66" stroke-width="1.2"/>
<text x="48.0" y="64.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="middle">octave</text>
<rect x="96.0" y="44.0" width="96.0" height="30.0" rx="3" fill="#EFE0EB" stroke="#7A3E6B" stroke-width="1.2"/>
<text x="144.0" y="64.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#5C2D50" text-anchor="middle">semitone</text>
<text x="0.0" y="92.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">bit 7 is clear; high nibble 0 to 7, low nibble 0 to 11</text>
<text x="0.0" y="114.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">SetVoicePitch (4A3A): octave nibble + transpose (+07, 10h per</text>
<text x="0.0" y="127.9" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">octave), semitone + detune (+12, wraps at 12), F-number from the</text>
<text x="0.0" y="141.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">table + fine tune (+24), then the bend (+42) is added or subtracted</text>
<text x="0.0" y="155.6" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">through a 32-byte curve of gLevelCurvePtrs.</text>
<text x="390.0" y="36.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="600" fill="#3C3A36" text-anchor="start">the registers it writes</text>
<text x="390.0" y="56.0" font-family="'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">A0h + voice</text>
<rect x="480.0" y="42.0" width="272.0" height="24.0" rx="3" fill="#F4E8CC" stroke="#A8741A" stroke-width="1.2"/>
<text x="616.0" y="62.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#7A5412" text-anchor="middle">F-number low 8 bits</text>
<text x="390.0" y="92.0" font-family="'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">B0h + voice</text>
<rect x="480.0" y="78.0" width="68.0" height="24.0" rx="3" fill="#ECE7DD" stroke="#8A8373" stroke-width="1.2"/>
<text x="514.0" y="94.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="700" fill="#3C3A36" text-anchor="middle">-</text>
<rect x="548.0" y="78.0" width="34.0" height="24.0" rx="3" fill="#F5E0D9" stroke="#A8452F" stroke-width="1.2"/>
<text x="565.0" y="94.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="700" fill="#80311F" text-anchor="middle">key</text>
<rect x="582.0" y="78.0" width="102.0" height="24.0" rx="3" fill="#DCEBE7" stroke="#1F6F66" stroke-width="1.2"/>
<text x="633.0" y="94.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="700" fill="#14504A" text-anchor="middle">block</text>
<rect x="684.0" y="78.0" width="68.0" height="24.0" rx="3" fill="#F4E8CC" stroke="#A8741A" stroke-width="1.2"/>
<text x="718.0" y="94.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="700" fill="#7A5412" text-anchor="middle">F hi</text>
<text x="480.0" y="118.0" font-family="'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">bits 7 6  5  4 3 2  1 0</text>
<text x="390.0" y="138.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">Bit 5 is the key-on bit: VoiceKeyOn sets it, VoiceKeyOff clears it. The</text>
<text x="390.0" y="151.9" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">block is the octave; the F-number has 10 bits. On the OPL2 [H] f = F x</text>
<text x="390.0" y="165.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">49,716 / 2^(20 - block) Hz.</text>
<text x="0.0" y="186.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="600" fill="#3C3A36" text-anchor="start">gFNumbers (3E31): 12 words, one octave</text>
