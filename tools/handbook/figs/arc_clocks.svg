<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 462" width="760" height="462" class="fig"><defs><marker id="a8A8373" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8A8373"/></marker></defs>
<text x="0.0" y="11.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="start" letter-spacing="1.6">TIMER: EVERYTHING THE GAME CALLS TIME COMES FROM IRQ0</text>
<rect x="0.0" y="24.0" width="120.0" height="78.0" rx="6" fill="#ECE7DD" stroke="#8A8373" stroke-width="1.2"/>
<text x="60.0" y="47.2" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#3C3A36" text-anchor="middle">PIT channel 0</text>
<text x="60.0" y="61.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">IRQ0 at 18.2 Hz, or</text>
<text x="60.0" y="74.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">faster while a sound</text>
<text x="60.0" y="87.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">driver runs</text>
<rect x="150.0" y="24.0" width="190.0" height="78.0" rx="6" fill="#F4E8CC" stroke="#A8741A" stroke-width="1.2"/>
<text x="245.0" y="41.3" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#7A5412" text-anchor="middle">INT 08h, driver ISR</text>
<text x="245.0" y="55.0" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">AdLib: divisor 555h, 874 Hz, every</text>
<text x="245.0" y="67.8" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">48th pass chains on;</text>
<text x="245.0" y="80.5" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">speaker, Tandy: 1000h, 291 Hz,</text>
<text x="245.0" y="93.2" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">every 16th</text>
<rect x="370.0" y="24.0" width="100.0" height="78.0" rx="6" fill="#ECE7DD" stroke="#8A8373" stroke-width="1.2"/>
<text x="420.0" y="53.7" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#3C3A36" text-anchor="middle">BIOS INT 08h</text>
<text x="420.0" y="67.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">18.2 Hz, then INT</text>
<text x="420.0" y="80.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">1Ch</text>
<rect x="500.0" y="24.0" width="254.0" height="78.0" rx="6" fill="#E1E5F2" stroke="#3B4A8A" stroke-width="1.2"/>
<text x="627.0" y="53.7" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#2C386B" text-anchor="middle">INT 1Ch: 1D8F:0055</text>
<text x="627.0" y="67.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">adds 1 to each counter below, counts a countdown</text>
<text x="627.0" y="80.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">down, chains to the old handler</text>
