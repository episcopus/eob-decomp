<text x="455.0" y="316.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#2C386B" text-anchor="middle">ring, 1AAD:007C</text>
<text x="455.0" y="329.8" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">256 bytes of events: 1 word, or</text>
<text x="455.0" y="342.5" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">3 for a mouse click (code, x, y)</text>
