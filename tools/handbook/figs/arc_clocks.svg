<text x="662.0" y="309.6" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#5C2D50" text-anchor="middle">readers</text>
<text x="662.0" y="323.4" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">IsKeyPending, ReadKey,</text>
<text x="662.0" y="336.1" font-family="Inter, 'Inter Display', sans-serif" font-size="9.8" font-weight="400" fill="#3C3A36" text-anchor="middle">WaitKeyEvent, WaitGameKey,</text>
