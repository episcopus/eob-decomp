<path d="M341.0,63.0 L369.0,63.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<path d="M471.0,63.0 L499.0,63.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<text x="0.0" y="126.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#2C386B" text-anchor="start">What the handler writes</text>
<rect x="0.0" y="134.0" width="760.0" height="18.0" rx="3" fill="#F4F0E6" stroke="none" stroke-width="1"/>
<text x="8.0" y="147.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="700" fill="#3C3A36" text-anchor="start">address</text>
<text x="92.0" y="147.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="700" fill="#3C3A36" text-anchor="start">name</text>
<text x="240.0" y="147.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="700" fill="#3C3A36" text-anchor="start">kind</text>
<text x="440.0" y="147.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="700" fill="#3C3A36" text-anchor="start">read by</text>
<text x="8.0" y="167.0" font-family="'DejaVu Sans Mono', monospace" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">ds:8488</text>
<text x="92.0" y="167.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.8" font-weight="600" fill="#2B2A28" text-anchor="start">gTicksSinceEvent</text>
<text x="240.0" y="167.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">16-bit, always</text>
<text x="440.0" y="167.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">stamps recorded input events</text>
<text x="8.0" y="186.0" font-family="'DejaVu Sans Mono', monospace" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">ds:848A</text>
<text x="92.0" y="186.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.8" font-weight="600" fill="#2B2A28" text-anchor="start">gTicks</text>
<text x="240.0" y="186.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">32-bit, always</text>
<text x="440.0" y="186.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">WaitTicks, cursor blink, delays, selection frame</text>
<text x="8.0" y="205.0" font-family="'DejaVu Sans Mono', monospace" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">ds:8492</text>
<text x="92.0" y="205.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.8" font-weight="600" fill="#2B2A28" text-anchor="start">gGameTicks</text>
<text x="240.0" y="205.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">32-bit, only while ds:849E bit 1</text>
<text x="440.0" y="205.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">timed effects, level script timer, member effect timers</text>
<text x="8.0" y="224.0" font-family="'DejaVu Sans Mono', monospace" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">ds:849A</text>
<text x="92.0" y="224.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.8" font-weight="600" fill="#2B2A28" text-anchor="start">gFrameWaitTicks</text>
<text x="240.0" y="224.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">32-bit countdown to 0</text>
<text x="440.0" y="224.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">DrawViewFrame waits for it: holds attack and hit frames</text>
<text x="8.0" y="243.0" font-family="'DejaVu Sans Mono', monospace" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">ds:848E, 8496</text>
<text x="92.0" y="243.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.8" font-weight="600" fill="#2B2A28" text-anchor="start">(no reader)</text>
<text x="240.0" y="243.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">32-bit each; 848E only while bit 0</text>
<text x="440.0" y="243.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.3" font-weight="400" fill="#3C3A36" text-anchor="start">the counters nothing in src/ reads</text>
<text x="0.0" y="261.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">Bit 1 of ds:849E is cleared around the camp menu, level loads, wand and spell animations, hit flashes: game time stops while the player waits.</text>
<text x="0.0" y="280.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="start" letter-spacing="1.6">KEYBOARD AND MOUSE: INTERRUPTS FILL ONE 128-WORD RING</text>
