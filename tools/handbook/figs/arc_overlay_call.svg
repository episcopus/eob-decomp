<text x="611.0" y="46.0" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" font-weight="700" fill="#5C2D50" text-anchor="start">overlay code</text>
<text x="591.0" y="64.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">runs at pool:09CC</text>
<text x="591.0" y="78.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">(LoadItemData, ovl2:09CC);</text>
<text x="591.0" y="92.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">its RETF goes back to the</text>
<text x="591.0" y="106.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">caller</text>
