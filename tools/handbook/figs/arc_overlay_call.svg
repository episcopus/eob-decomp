<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 496" width="760" height="496" class="fig"><defs><marker id="a8A8373" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8A8373"/></marker></defs>
<text x="0.0" y="11.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="start" letter-spacing="1.6">A CALL THAT CROSSES INTO AN OVERLAY (EXAMPLE: STARTUPALLOC CALLS LOADITEMDATA)</text>
<rect x="0.0" y="26.0" width="176.0" height="128.0" rx="6" fill="#DCEBE7" stroke="#1F6F66" stroke-width="1.2"/>
<circle cx="14.0" cy="42.0" r="8.0" fill="#1F6F66" stroke="none" stroke-width="1"/>
<text x="14.0" y="45.6" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="29.0" y="46.0" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" font-weight="700" fill="#14504A" text-anchor="start">caller</text>
<text x="9.0" y="64.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">a far call to the stub entry:</text>
<text x="9.0" y="78.0" font-family="'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">9A 2A 00 06 21</text>
<text x="9.0" y="92.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">= call 2106:002A</text>
<text x="9.0" y="106.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">the return address is the</text>
<text x="9.0" y="120.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">caller&#x27;s</text>
<rect x="194.0" y="26.0" width="176.0" height="128.0" rx="6" fill="#F4E8CC" stroke="#A8741A" stroke-width="1.2"/>
<circle cx="208.0" cy="42.0" r="8.0" fill="#A8741A" stroke="none" stroke-width="1"/>
<text x="208.0" y="45.6" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="223.0" y="46.0" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" font-weight="700" fill="#7A5412" text-anchor="start">stub, segment 2106</text>
<text x="203.0" y="64.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">overlay 2&#x27;s entry table; each</text>
<text x="203.0" y="78.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">entry is 5 bytes:</text>
<text x="203.0" y="92.0" font-family="'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">CD 3F CC 09 00</text>
<text x="203.0" y="106.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">INT 3Fh, then the code offset</text>
<text x="203.0" y="120.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">09CC</text>
<rect x="388.0" y="26.0" width="176.0" height="128.0" rx="6" fill="#E1E5F2" stroke="#3B4A8A" stroke-width="1.2"/>
<circle cx="402.0" cy="42.0" r="8.0" fill="#3B4A8A" stroke="none" stroke-width="1"/>
<text x="402.0" y="45.6" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="417.0" y="46.0" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" font-weight="700" fill="#2C386B" text-anchor="start">INT 3Fh</text>
<text x="397.0" y="64.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">the game&#x27;s hook 1A72:0006</text>
<text x="397.0" y="78.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">checks EOB.EXE can be</text>
<text x="397.0" y="92.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">opened, then chains to the</text>
<text x="397.0" y="106.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">manager, 1E8B:04D0, which</text>
<text x="397.0" y="120.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">reads the word after the INT</text>
<text x="397.0" y="134.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">and finds the record</text>
<rect x="582.0" y="26.0" width="176.0" height="128.0" rx="6" fill="#EFE0EB" stroke="#7A3E6B" stroke-width="1.2"/>
<circle cx="596.0" cy="42.0" r="8.0" fill="#7A3E6B" stroke="none" stroke-width="1"/>
