<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" class="fig"><defs><marker id="a8A8373" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8A8373"/></marker></defs>
<text x="0.0" y="11.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="start" letter-spacing="1.6">THE CAMP MENU: RUNCAMPMENU (OVL1:1ACD) AND WHAT EACH BUTTON DOES</text>
<rect x="260.0" y="24.0" width="120.0" height="34.0" rx="6" fill="#DCEBE7" stroke="#1F6F66" stroke-width="1.2"/>
<text x="320.0" y="45.2" font-family="Inter, 'Inter Display', sans-serif" font-size="13" font-weight="700" fill="#14504A" text-anchor="middle">Camp</text>
<rect x="60.0" y="24.0" width="130.0" height="34.0" rx="6" fill="#E1E5F2" stroke="#3B4A8A" stroke-width="1.2"/>
<text x="125.0" y="45.1" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" font-weight="700" fill="#2C386B" text-anchor="middle">Game Options</text>
<rect x="450.0" y="24.0" width="130.0" height="34.0" rx="6" fill="#E1E5F2" stroke="#3B4A8A" stroke-width="1.2"/>
<text x="515.0" y="45.1" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" font-weight="700" fill="#2C386B" text-anchor="middle">Preferences</text>
<path d="M260.0,36.0 L190.0,36.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)" marker-start="url(#a8A8373)"/>
<path d="M380.0,36.0 L450.0,36.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)" marker-start="url(#a8A8373)"/>
<rect x="260.0" y="70.0" width="120.0" height="30.0" rx="6" fill="#ECE7DD" stroke="#8A8373" stroke-width="1.2"/>
<text x="320.0" y="88.7" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#3C3A36" text-anchor="middle">leave the camp</text>
<path d="M320.0,58.0 L320.0,70.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<text x="328.0" y="66.0" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" font-weight="400" fill="#6E695F" text-anchor="start">Exit</text>
<text x="0.0" y="120.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">Exit in the two sub-menus returns to Camp. The game clock is stopped while the menu is open (gTimerEnableFlags bit 1 cleared).</text>
<rect x="0.0" y="134.0" width="760.0" height="140.0" rx="6" fill="#DCEBE7" stroke="#1F6F66" stroke-width="1.2"/>
<text x="10.0" y="149.0" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#14504A" text-anchor="start">Camp (menu 0)</text>
<text x="14.0" y="170.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="700" fill="#2B2A28" text-anchor="start">Rest Party</text>
<text x="190.0" y="170.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">CampLoop (overlay 6). A nonzero result ends the camp; otherwise gNeedsRest is cleared</text>
<rect x="2.0" y="177.0" width="756.0" height="20.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="0.35"/>
<text x="14.0" y="190.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="700" fill="#2B2A28" text-anchor="start">Memorize Spells</text>
<text x="190.0" y="190.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">SelectPartyMember(17h), then SpellSlotScreen(who, 0): the mage&#x27;s spell book</text>
<text x="14.0" y="210.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="700" fill="#2B2A28" text-anchor="start">Pray for Spells</text>
<text x="190.0" y="210.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">SelectPartyMember(1Ah), then SpellSlotScreen(who, 1): a cleric&#x27;s or paladin&#x27;s list</text>
<rect x="2.0" y="217.0" width="756.0" height="20.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="0.35"/>
<text x="14.0" y="230.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="700" fill="#2B2A28" text-anchor="start">Scribe Scrolls</text>
<text x="190.0" y="230.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">ScribeScrolls (ovl1:1691): copy carried mage scrolls into a spell book, one at a time</text>
<text x="14.0" y="250.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="700" fill="#2B2A28" text-anchor="start">Preferences, Game Options</text>
<text x="190.0" y="250.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">open the sub-menu</text>
<rect x="2.0" y="257.0" width="756.0" height="20.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="0.35"/>
<text x="14.0" y="270.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="700" fill="#2B2A28" text-anchor="start">Exit</text>
<text x="190.0" y="270.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">leave; first the message &#x27;Your party needs to rest to gain spells.&#x27; if gNeedsRest is set</text>
<rect x="0.0" y="286.0" width="760.0" height="80.0" rx="6" fill="#E1E5F2" stroke="#3B4A8A" stroke-width="1.2"/>
<text x="10.0" y="301.0" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#2C386B" text-anchor="start">Game Options (menu 1)</text>
<text x="14.0" y="322.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="700" fill="#2B2A28" text-anchor="start">Load Game, Save Game</text>
<text x="190.0" y="322.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">AskYesNo, then LoadGame (210C:0039) or SaveGame (210C:0089); Save writes EOBDATA.SAV</text>
<rect x="2.0" y="329.0" width="756.0" height="20.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="0.35"/>
<text x="14.0" y="342.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="700" fill="#2B2A28" text-anchor="start">Drop Character</text>
<text x="190.0" y="342.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">refused with fewer than 5 members present (&#x27;less than four characters&#x27;); else DropCharacter</text>
<text x="14.0" y="362.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="700" fill="#2B2A28" text-anchor="start">Quit Game</text>
<text x="190.0" y="362.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">AskYesNo(2Eh), then ShutdownGame</text>
<rect x="0.0" y="378.0" width="760.0" height="80.0" rx="6" fill="#E1E5F2" stroke="#3B4A8A" stroke-width="1.2"/>
<text x="10.0" y="393.0" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#2C386B" text-anchor="start">Preferences (menu 2)</text>
<text x="14.0" y="414.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="700" fill="#2B2A28" text-anchor="start">Tunes, Sounds</text>
<text x="190.0" y="414.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">flip gTunesOn and gSoundOn and rewrite the button&#x27;s ON/OFF label</text>
<rect x="2.0" y="421.0" width="756.0" height="20.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="0.35"/>
<text x="14.0" y="434.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="700" fill="#2B2A28" text-anchor="start">Bar Graphs</text>
<text x="190.0" y="434.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">flip gBarGraphsOn (HP bar or the &#x27;n of m&#x27; text) and redraw the party</text>
<text x="14.0" y="454.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="700" fill="#2B2A28" text-anchor="start">Mouse</text>
<text x="190.0" y="454.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">flip gMouseDisabled, only if a mouse driver was found</text>
<text x="0.0" y="476.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#6E695F" text-anchor="start">Keys 5Bh/65h light the first button, 60h/62h move up and down the selectable ones, 5Dh/67h the last; 2Bh/3Dh/61h press the lit one.</text>
</svg>