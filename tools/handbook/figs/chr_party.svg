<text x="432.5" y="134.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">AddPartyMember copies a pool record</text>
<text x="432.5" y="147.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">into the first slot whose status bit 0 is</text>
<text x="432.5" y="160.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">clear; with six present ChooseChar asks</text>
<text x="432.5" y="173.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">whom to remove.</text>
<rect x="330.0" y="196.0" width="205.0" height="80.0" rx="6" fill="#F5E0D9" stroke="#A8452F" stroke-width="1.2"/>
<text x="432.5" y="220.4" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#80311F" text-anchor="middle">drop</text>
<text x="432.5" y="234.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">DropCharacter, only with 5 or more</text>
<text x="432.5" y="247.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">present: items go to the floor, and for</text>
<text x="432.5" y="260.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">slots 0 to 3 slot 5 (else 4) moves in.</text>
