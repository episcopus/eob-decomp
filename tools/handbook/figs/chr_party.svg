<text x="0.0" y="305.6" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">of 2 and 3. Screen: x = slot &amp; 1, y = slot &gt;&gt; 1.</text>
<rect x="330.0" y="26.0" width="205.0" height="62.0" rx="6" fill="#DCEBE7" stroke="#1F6F66" stroke-width="1.2"/>
<text x="432.5" y="47.9" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#14504A" text-anchor="middle">create</text>
<text x="432.5" y="62.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">RunCharacterPanel fills slots 0 to 3</text>
<text x="432.5" y="75.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">and sets status to 1, food to 100.</text>
<rect x="330.0" y="96.0" width="205.0" height="92.0" rx="6" fill="#E1E5F2" stroke="#3B4A8A" stroke-width="1.2"/>
