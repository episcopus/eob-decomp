<text x="560.0" y="165.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">through the member picker; Load, Save</text>
<text x="560.0" y="178.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">and Quit through Yes / No; results,</text>
<text x="560.0" y="191.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">failures and hints through the message</text>
<text x="560.0" y="204.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">box (a key or about 120 frames).</text>
<text x="0.0" y="352.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="start" letter-spacing="1.6">THE MENU MACHINERY</text>
<text x="0.0" y="372.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.4" font-weight="400" fill="#3C3A36" text-anchor="start">Each menu is a node list built by BuildMenuButtons (ovl1:1153) from 5-byte menu records (ds:628C) and 9-byte button definitions (208E:0000).</text>
<text x="0.0" y="386.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.4" font-weight="400" fill="#3C3A36" text-anchor="start">RunCampMenu loops on DispatchKeyWait over that list: the letter on a button is its key06 word, Home and End (keypad 7, 1) light the first and last</text>
<text x="0.0" y="400.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.4" font-weight="400" fill="#3C3A36" text-anchor="start">button, Up and Down move the lit one, Enter, Space or keypad 5 press it, a click presses the button under the pointer. Esc is remapped to Exit.</text>
<text x="0.0" y="414.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.4" font-weight="400" fill="#3C3A36" text-anchor="start">Game time is stopped while it runs (gTimerEnableFlags bit 1 cleared); on the way out the view frame and the INVENT sheet are redrawn.</text>
</svg>