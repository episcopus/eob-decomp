<text x="0.0" y="424.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#2C386B" text-anchor="start">Invisibility</text>
<text x="150.0" y="424.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">until the member attacks or casts an attack spell, or is dispelled</text>
<text x="0.0" y="440.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#2C386B" text-anchor="start">Fear, turned undead</text>
<text x="150.0" y="440.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">monsters keep running until something hits them</text>
