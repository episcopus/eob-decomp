<text x="0.0" y="372.0" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#2B2A28" text-anchor="start">No timer at all:</text>
<text x="0.0" y="392.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#2C386B" text-anchor="start">Armor</text>
<text x="150.0" y="392.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">absorbs caster level + 8 points of damage, then ends (CharRec +DF)</text>
<text x="0.0" y="408.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#2C386B" text-anchor="start">Stoneskin</text>
