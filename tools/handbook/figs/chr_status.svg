<text x="20.0" y="142.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">bar colour state 2 when hp &lt;= 0, state 1 when (maxHp + 10) / 3 &gt; hp + 10, else state 0</text>
