<text x="516.0" y="26.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="start" letter-spacing="1.6">HOW TO READ IT</text>
<text x="516.0" y="44.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">Every rectangle is a number in the code:</text>
<text x="516.0" y="57.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">the view and the text windows are rows</text>
<text x="516.0" y="70.4" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">of the region table (ds:009F), the hit</text>
<text x="516.0" y="83.6" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">rectangles are screen nodes (the 38</text>
<text x="516.0" y="96.8" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">records of gTable1b), the member</text>
<text x="516.0" y="110.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">blocks come from tables at ds:5D1F to</text>
<text x="516.0" y="123.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">5D4F.</text>
<text x="516.0" y="141.4" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">x is in pixels here. The region table and</text>
<text x="516.0" y="154.6" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">several routines count x in 8-pixel</text>
<text x="516.0" y="167.8" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">columns: the view is 22 columns wide, a</text>
<text x="516.0" y="181.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">member block 8.</text>
<text x="516.0" y="199.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">A member block is built on page 2 at x 8</text>
<text x="516.0" y="212.4" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">or 80 and copied to page 0 at x + 176</text>
<text x="516.0" y="225.6" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">(the drawing routines add 0xB0 while</text>
<text x="516.0" y="238.8" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#3C3A36" text-anchor="start">gDrawPage is 0).</text>
