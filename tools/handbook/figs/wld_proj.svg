<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" width="760" height="570" class="fig"><defs><marker id="aA8452F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#A8452F"/></marker></defs>
<text x="0.0" y="11.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="start" letter-spacing="1.6">A FLYING ITEM OR SPELL: HALF A CELL EVERY 3 TICKS (EFFECT 1, MOVEDDEFFECTS)</text>
<rect x="20.0" y="52.0" width="112.0" height="112.0" rx="0" fill="#FFFDF8" stroke="#8A8373" stroke-width="1.4"/>
<rect x="26.0" y="58.0" width="44.0" height="44.0" rx="3" fill="#FFFDF8" stroke="#1F6F66" stroke-width="1"/>
<text x="48.0" y="85.0" font-family="Inter, 'Inter Display', sans-serif" font-size="13" font-weight="700" fill="#14504A" text-anchor="middle">0</text>
<rect x="82.0" y="58.0" width="44.0" height="44.0" rx="3" fill="#FFFDF8" stroke="#1F6F66" stroke-width="1"/>
<text x="104.0" y="85.0" font-family="Inter, 'Inter Display', sans-serif" font-size="13" font-weight="700" fill="#14504A" text-anchor="middle">1</text>
<rect x="26.0" y="114.0" width="44.0" height="44.0" rx="3" fill="#FFFDF8" stroke="#1F6F66" stroke-width="1"/>
<text x="48.0" y="141.0" font-family="Inter, 'Inter Display', sans-serif" font-size="13" font-weight="700" fill="#14504A" text-anchor="middle">2</text>
<rect x="82.0" y="114.0" width="44.0" height="44.0" rx="3" fill="#FFFDF8" stroke="#1F6F66" stroke-width="1"/>
<text x="104.0" y="141.0" font-family="Inter, 'Inter Display', sans-serif" font-size="13" font-weight="700" fill="#14504A" text-anchor="middle">3</text>
<text x="142.0" y="112.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">next cell ahead</text>
<rect x="20.0" y="164.0" width="112.0" height="112.0" rx="0" fill="#DCEBE7" stroke="#1F6F66" stroke-width="1.4"/>
<rect x="26.0" y="170.0" width="44.0" height="44.0" rx="3" fill="#FFFDF8" stroke="#1F6F66" stroke-width="1"/>
<text x="48.0" y="197.0" font-family="Inter, 'Inter Display', sans-serif" font-size="13" font-weight="700" fill="#14504A" text-anchor="middle">0</text>
<rect x="82.0" y="170.0" width="44.0" height="44.0" rx="3" fill="#FFFDF8" stroke="#1F6F66" stroke-width="1"/>
<text x="104.0" y="197.0" font-family="Inter, 'Inter Display', sans-serif" font-size="13" font-weight="700" fill="#14504A" text-anchor="middle">1</text>
<rect x="26.0" y="226.0" width="44.0" height="44.0" rx="3" fill="#FFFDF8" stroke="#1F6F66" stroke-width="1"/>
<text x="48.0" y="253.0" font-family="Inter, 'Inter Display', sans-serif" font-size="13" font-weight="700" fill="#14504A" text-anchor="middle">2</text>
<rect x="82.0" y="226.0" width="44.0" height="44.0" rx="3" fill="#FFFDF8" stroke="#1F6F66" stroke-width="1"/>
<text x="104.0" y="253.0" font-family="Inter, 'Inter Display', sans-serif" font-size="13" font-weight="700" fill="#14504A" text-anchor="middle">3</text>
<text x="142.0" y="224.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">the party&#x27;s cell</text>
<path d="M48.0,236.0 L48.0,206.0" fill="none" stroke="#A8452F" stroke-width="1.8" marker-end="url(#aA8452F)"/>
<path d="M48.0,178.0 L48.0,150.0" fill="none" stroke="#A8452F" stroke-width="1.8" marker-end="url(#aA8452F)"/>
<text x="24.0" y="294.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="600" fill="#80311F" text-anchor="start">thrown north from position 2:</text>
<text x="24.0" y="308.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#80311F" text-anchor="start">2 -&gt; 0 (same cell), 0 -&gt; 2 (next cell), ...</text>
<text x="24.0" y="324.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">gNextPosByDir[dir * 4 + pos]: bit 7 set = cross</text>
<text x="24.0" y="338.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">into StepCell(cell, dir); the rest is the new pos</text>
<text x="300.0" y="38.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="start" letter-spacing="1.6">ONE STEP OF ONE LIVE RECORD</text>
<rect x="300.0" y="52.0" width="460.0" height="48.0" rx="6" fill="#E1E5F2" stroke="#3B4A8A" stroke-width="1.1"/>
<text x="309.0" y="68.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#2C386B" text-anchor="start">pick the next position</text>
<text x="309.0" y="81.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.2" font-weight="400" fill="#3C3A36" text-anchor="start">sel = gNextPosByDir[dir * 4 + (pos &amp; 3)]; bit 7 means the next cell, target = StepCell(cell,</text>
<text x="309.0" y="93.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.2" font-weight="400" fill="#3C3A36" text-anchor="start">dir)</text>
<rect x="300.0" y="109.0" width="460.0" height="48.0" rx="6" fill="#E1E5F2" stroke="#3B4A8A" stroke-width="1.1"/>
<text x="309.0" y="125.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#2C386B" text-anchor="start">StepDDEffect: may it enter?</text>
<text x="309.0" y="138.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.2" font-weight="400" fill="#3C3A36" text-anchor="start">wall of the target on the side facing back: an item passes when flag bit 0, or while still</text>
<text x="309.0" y="150.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.2" font-weight="400" fill="#3C3A36" text-anchor="start">in its launch cell, or flag bit 1 and a small item; a spell when flag bit 0 or the same cell</text>
<rect x="300.0" y="166.0" width="460.0" height="48.0" rx="6" fill="#F5E0D9" stroke="#A8452F" stroke-width="1.1"/>
<text x="309.0" y="182.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#80311F" text-anchor="start">no: it hits the wall</text>
<text x="309.0" y="195.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.2" font-weight="400" fill="#3C3A36" text-anchor="start">gWallTrigger = 0x10 (item) or 1 (spell), DispatchWallHandler on that wall, then the</text>
<text x="309.0" y="207.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.2" font-weight="400" fill="#3C3A36" text-anchor="start">record is cleared</text>
<rect x="300.0" y="223.0" width="460.0" height="48.0" rx="6" fill="#DCEBE7" stroke="#1F6F66" stroke-width="1.1"/>
<text x="309.0" y="239.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="start">yes: move</text>
<text x="309.0" y="252.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.2" font-weight="400" fill="#3C3A36" text-anchor="start">the item leaves the old cell&#x27;s list and joins the target&#x27;s with tag pos | 4; count down</text>
<text x="309.0" y="264.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.2" font-weight="400" fill="#3C3A36" text-anchor="start">m0D; a new cell runs its script in mode 0x10</text>
<rect x="300.0" y="280.0" width="460.0" height="48.0" rx="6" fill="#EFE0EB" stroke="#7A3E6B" stroke-width="1.1"/>
<text x="309.0" y="296.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#5C2D50" text-anchor="start">TestDDEffect: anyone there?</text>
<text x="309.0" y="309.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.2" font-weight="400" fill="#3C3A36" text-anchor="start">monsters in the quadrant or centre: TryRecordAttack (to-hit roll, damage,</text>
<text x="309.0" y="321.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.2" font-weight="400" fill="#3C3A36" text-anchor="start">DamageMonster); no monsters and the party&#x27;s cell: RunRecordAttack hits a member</text>
<rect x="300.0" y="337.0" width="460.0" height="48.0" rx="6" fill="#ECE7DD" stroke="#8A8373" stroke-width="1.1"/>
<text x="309.0" y="353.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#3C3A36" text-anchor="start">end of flight</text>
<text x="309.0" y="366.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.2" font-weight="400" fill="#3C3A36" text-anchor="start">after a hit or when m0D runs out (12 steps, about 6 cells): ClearDDEffect: tag &amp; 3,</text>
<text x="309.0" y="378.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.2" font-weight="400" fill="#3C3A36" text-anchor="start">script mode 4 (the item lands), sound 0x12</text>
<line x1="0.0" y1="404.0" x2="760.0" y2="404.0" stroke="#D9D2C3" stroke-width="1"/>
<text x="0.0" y="418.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="start" letter-spacing="1.6">THE RECORD, STRUCT PROJECTILE, 18 BYTES (GPROJECTILES, DS:DD2C, 10 RECORDS)</text>
