<text x="0.0" y="488.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">act: 0 free, 1 a thrown item, 2 a spell effect. m02: nonzero on launch, so nothing is hit in the launching cell; cleared when the record crosses into a new</text>
<text x="0.0" y="500.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">cell. item: an index into gItems (a spell: the effect mode).</text>
<text x="0.0" y="514.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">typ: the item type. who: the thrower (a party member, or -1 for a script or a monster; monsters&#x27; missiles hit the party). fl: bit 0x20 makes a blocked</text>
<text x="0.0" y="526.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">flight call AnimateEffect. rng: steps left, 12 at launch.</text>
<text x="0.0" y="540.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">A script can launch one (opcode E9) or turn every flying object in its cell (E8 F5). ResetLevel clears all ten before a save or a level change, putting thrown</text>
<text x="0.0" y="552.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">items down where they flew.</text>
</svg>