<text x="299.0" y="173.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">1 ahead</text>
<text x="299.0" y="231.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">beside</text>
<text x="470.0" y="22.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="start" letter-spacing="1.6">HOW TO READ IT</text>
<text x="470.0" y="44.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">Slot k holds the cell number gViewCellIds[k] = (party</text>
<text x="470.0" y="58.2" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">cell + offset) &amp; 0x3FF and a pointer to that cell&#x27;s nine</text>
<text x="470.0" y="72.4" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">bytes (gViewCells[k]).</text>
<text x="470.0" y="92.6" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">ds:199D has one row of 18 offsets per facing. For</text>
<text x="470.0" y="106.8" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">east the row is -93, -61, -29, +3, +35, +67, +99,</text>
<text x="470.0" y="121.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">then -62, -30, +2, +34, +66, then -31, +1, +33, then</text>
<text x="470.0" y="135.2" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">-32, 0, +32: the picture turned a quarter turn.</text>
<text x="470.0" y="155.4" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">IsCellInView (0D1C:0006) is how monsters, doors and</text>
<text x="470.0" y="169.6" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">items ask &#x27;is this cell on screen?&#x27;: it searches the</text>
<text x="470.0" y="183.8" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">first 15 slots of ds:A9C8 for the cell and, on a hit,</text>
<text x="470.0" y="198.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">sets gViewDirty so the next pass redraws. The three</text>
<text x="470.0" y="212.2" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">dashed slots are not searched (it loops 15 times, the</text>
<text x="470.0" y="226.4" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="400" fill="#3C3A36" text-anchor="start">table has 18 words).</text>
