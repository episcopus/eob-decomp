<text x="215.0" y="278.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="600" fill="#14504A" text-anchor="middle">the party, facing north (slot 16)</text>
<text x="401.0" y="57.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">3 ahead</text>
