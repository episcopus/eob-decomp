<text x="0.0" y="320.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" font-weight="400" fill="#6E695F" text-anchor="start">GetPageBuffer(kind) returns the odd slot (always memory), GetPageVideo(kind) the even one (the segment the driver draws to).</text>
