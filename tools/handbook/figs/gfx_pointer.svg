<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 454" width="760" height="454" class="fig"><defs><marker id="a8A8373" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8A8373"/></marker></defs>
<text x="0.0" y="11.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" font-weight="700" fill="#14504A" text-anchor="start" letter-spacing="1.6">THE SOFTWARE MOUSE POINTER: SAVE UNDER, DRAW, RESTORE</text>
<text x="0.0" y="34.0" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#2C386B" text-anchor="start">the mouse moves (INT 33h handler, 1A72:017A)</text>
<rect x="0.0" y="44.0" width="360.0" height="44.0" rx="6" fill="#ECE7DD" stroke="#8A8373" stroke-width="1.2"/>
<text x="180.0" y="63.2" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#3C3A36" text-anchor="middle">clamp x to 319, publish gCursorX, gCursorY</text>
<text x="180.0" y="77.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">only when gPointerBusy is 0; otherwise the event draws nothing</text>
<rect x="0.0" y="96.0" width="360.0" height="44.0" rx="6" fill="#ECE7DD" stroke="#8A8373" stroke-width="1.2"/>
<text x="180.0" y="115.2" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#3C3A36" text-anchor="middle">moved, and gHideDepth is 0?</text>
<text x="180.0" y="129.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">else nothing to redraw</text>
<path d="M180.0,88.0 L180.0,96.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<rect x="0.0" y="148.0" width="360.0" height="44.0" rx="6" fill="#E1E5F2" stroke="#3B4A8A" stroke-width="1.2"/>
<text x="180.0" y="160.7" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#2C386B" text-anchor="middle">SaveDrawState(), HidePointer()</text>
<text x="180.0" y="174.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">HidePointer puts the saved rectangle back through gRestoreRect</text>
<text x="180.0" y="187.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">(ds:804E), gHideDepth = 1</text>
<path d="M180.0,140.0 L180.0,148.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<rect x="0.0" y="200.0" width="360.0" height="72.0" rx="6" fill="#E1E5F2" stroke="#3B4A8A" stroke-width="1.2"/>
<text x="180.0" y="220.2" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#2C386B" text-anchor="middle">ShowPointer()</text>
<text x="180.0" y="234.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">gHideDepth = 0, gDrawnX/Y = cursor; gSaveRect (ds:80AE) copies the</text>
<text x="180.0" y="247.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">screen under the new place into the save-under buffer; gDrawShape</text>
<text x="180.0" y="260.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">(ds:80C2) draws the pointer shape on page 0</text>
<path d="M180.0,192.0 L180.0,200.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<rect x="0.0" y="280.0" width="360.0" height="44.0" rx="6" fill="#ECE7DD" stroke="#8A8373" stroke-width="1.2"/>
<text x="180.0" y="299.2" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#3C3A36" text-anchor="middle">RestoreDrawState()</text>
<text x="180.0" y="313.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">the driver&#x27;s region (and, on EGA, its registers) are put back</text>
<path d="M180.0,272.0 L180.0,280.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<text x="400.0" y="34.0" font-family="Inter, 'Inter Display', sans-serif" font-size="12" font-weight="700" fill="#5C2D50" text-anchor="start">the game draws on the screen (page 0)</text>
<rect x="400.0" y="44.0" width="360.0" height="72.0" rx="6" fill="#EFE0EB" stroke="#7A3E6B" stroke-width="1.2"/>
<text x="580.0" y="64.2" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#5C2D50" text-anchor="middle">HidePointerZone(l, t, r, b)</text>
<text x="580.0" y="78.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">or LockHidePointer() for no zone. The zone is stored; if the pointer&#x27;s</text>
<text x="580.0" y="91.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">rectangle overlaps it, the pointer is hidden as above and 4000h (redraw</text>
<text x="580.0" y="104.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">owed) is set</text>
<rect x="400.0" y="124.0" width="360.0" height="72.0" rx="6" fill="#ECE7DD" stroke="#8A8373" stroke-width="1.2"/>
<text x="580.0" y="144.2" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#3C3A36" text-anchor="middle">the drawing</text>
<text x="580.0" y="158.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">DrawText, gFillRect, CopyRegion, DrawShape: the driver writes the</text>
<text x="580.0" y="171.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">screen. While the zone hide is on, the mouse handler does not redraw</text>
<text x="580.0" y="184.2" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">inside the zone (its left edge is not tested, QUIRK 1A72:0248)</text>
<path d="M580.0,116.0 L580.0,124.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<rect x="400.0" y="204.0" width="360.0" height="72.0" rx="6" fill="#EFE0EB" stroke="#7A3E6B" stroke-width="1.2"/>
<text x="580.0" y="230.7" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#5C2D50" text-anchor="middle">ShowPointerZone()</text>
<text x="580.0" y="244.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">or LockShowPointer(): gHideDepth goes down; at 0, with a redraw owed,</text>
<text x="580.0" y="257.7" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="middle">ShowPointer saves the new background and draws the pointer again</text>
<path d="M580.0,196.0 L580.0,204.0" fill="none" stroke="#8A8373" stroke-width="1.3" marker-end="url(#a8A8373)"/>
<rect x="400.0" y="294.0" width="360.0" height="148.0" rx="8" fill="#F4F0E6" stroke="none" stroke-width="1"/>
<text x="410.0" y="310.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" font-weight="700" fill="#2B2A28" text-anchor="start">state the two lanes share</text>
<text x="410.0" y="325.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="700" fill="#3C3A36" text-anchor="start">gHideDepth ds:8146</text>
<text x="570.0" y="325.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">0 drawn; counts nested hides,</text>
<text x="570.0" y="337.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">saturates at FFFFh</text>
<text x="410.0" y="353.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="700" fill="#3C3A36" text-anchor="start">gPointerState ds:8160</text>
<text x="570.0" y="353.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">8000h zone hide on; 4000h redraw</text>
<text x="570.0" y="365.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">owed; low byte a repeat count</text>
<text x="410.0" y="381.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="700" fill="#3C3A36" text-anchor="start">gPointerBusy ds:812E</text>
<text x="570.0" y="381.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">taken (test, then increment, not a</text>
<text x="570.0" y="393.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">lock) by every wrapper</text>
<text x="410.0" y="409.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="700" fill="#3C3A36" text-anchor="start">save-under buffer ds:816A</text>
<text x="570.0" y="409.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">cols x rows x 8 bytes (SaveRectSize);</text>
<text x="570.0" y="421.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">the pointer&#x27;s rectangle is (shape cols</text>
<text x="570.0" y="434.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10" font-weight="400" fill="#3C3A36" text-anchor="start">+ 1) columns wide, rounded to 8 pixels</text>
</svg>