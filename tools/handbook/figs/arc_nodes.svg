<text x="4.0" y="80.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.2" font-weight="400" fill="#3C3A36" text-anchor="start">key: the node&#x27;s own id (the number a callback returns). k06, k08: key words that act as a left and a right click. draw: kind and the two modes. flags: which</text>
<text x="4.0" y="93.5" font-family="Inter, 'Inter Display', sans-serif" font-size="10.2" font-weight="400" fill="#3C3A36" text-anchor="start">buttons and phases fire it. reg, x, y, w, h: its box in a text region&#x27;s pixels. state: on, previous-on and pressed bits. callback: a far function. data: tile ids or a</text>
<text x="4.0" y="106.9" font-family="Inter, 'Inter Display', sans-serif" font-size="10.2" font-weight="400" fill="#3C3A36" text-anchor="start">button definition. df: copy of the definition flags.</text>
