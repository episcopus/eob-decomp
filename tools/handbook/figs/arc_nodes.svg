<text x="0.0" y="264.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.2" font-weight="400" fill="#6E695F" text-anchor="start">The map screen nodes use flags 1100h: react to a press of either button. Other bits: 0008h inactive, 0001h on-flag, 0004h pressed look,</text>
<text x="0.0" y="277.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.2" font-weight="400" fill="#6E695F" text-anchor="start">0002h clear on leave, 0020h end the walk here, 0040h capture the pointer, 0080h freeze the list while captured (the last five read from the code [I]).</text>
